heries_grants@fws.gov.Pre-proposals will be ranked to determine funding levels for each at which time applicants will be notified via email of approved funding amounts.Full proposals are due within 60 days of email notification of funding level (by 11:59 pm Eastern Standard Time). If grant request will be combined with Interjurisdictional AIS Grant (solicited under separate NOFO), then full proposal will be due 60 days after notice of both Interjurisdictional AIS Grant opportunity funding level and this NOFO funding level. Applicants must submit full proposal applications, for the approved funding amounts, via GrantSolutions.","rolling":null,"amount_min":100000,"amount_max":600000,"match_required":false,"match_pct":null,"summary":"Using appropriations to the Great Lakes Restoration Initiative (GLRI), the U.S. Fish and Wildlife Service (FWS) anticipates providing grants to support implementation of Great Lakes State Aquatic Invasive Species Management Plans (State AIS Plans). State AIS Plans have been transmitted by state governors and then approved by the Aquatic Nuisance Species Task Force. All state grants will be awarded based on a competitive process for which only Great Lakes states or their designee are eligible.","eligibility":"We are seeking one application from a primary state natural resource agency in each of the Great Lakes states. However, that agency may designate an entity (of any type) to apply for the award on their behalf.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["parks"],"alns":["15.662"],"listings":[{"aln":"15.662","name":"Great Lakes Restoration"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/362749","tier":"likely","is_new":false,"is_updated":false,"days_to_close":62,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":499,"slug":"f26as00084-aquatic-invasive-species-grants-to-great-lakes-tribes-fiscal-year-202-grants-gov-362303","name":"F26AS00084 Aquatic Invasive Species Grants to Great Lakes Tribes - Fiscal Year 2026 Great Lakes Restoration Initiative","number":"F26AS00084","level":"federal","state":null,"agency":"Fish and Wildlife Service","agency_code":"DOI-FWS","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-05-07","closes_at":"2026-12-31","closes_text":"All pre-proposals (including Project Narrative, Budget Narrative) must be received no later than 11:59 pm Eastern Standard Time 60 days after this NOFO is posted to grants.gov.All pre-proposals will be submitted via email to: fws3_fisheries_grants@fws.gov.Pre-proposals will be ranked to determine funding levels for each at which time applicants will be notified via email of approved funding amounts.Full proposals are due within 60 days of email notification of funding level (by 11:59 pm Eastern Standard Time). If grant request will be combined with Interjurisdictional AIS Grant (solicited under separate NOFO), then full proposal will be due 60 days after notice of both Interjurisdictional AIS Grant opportunity funding level and this NOFO funding level. Applicants must submit full proposal applications, for the approved funding amounts, via GrantSolutions.","rolling":null,"amount_min":20000,"amount_max":100000,"match_required":false,"match_pct":null,"summary":"Using appropriations to the Great Lakes Restoration Initiative (GLRI), the U.S. Fish and Wildlife Service (FWS) anticipates providing grants to support development and/or implementation of Great Lakes Tribal Aquatic Invasive Species Management Plans (Tribal AIS Plans). Therefore, a Tribal AIS Plan must be in place that supports the proposed work, or development of such a plan must be a part of the proposed work. All tribal grants will be awarded based on a riorities and focus on pathway intervention, detection activities, and active prevention. Two categories of projects will be considered for funding: Sustaining Projects and New Projects. Sustaining Projects are projects that continue previously funded interjurisdictional work and are deemed a priority for continued regional AIS management and prevention support. New Projects are previously unfunded work with the potential to improve regional AIS management and prevention.","rolling":null,"amount_min":20000,"amount_max":923809,"match_required":false,"match_pct":null,"summary":"Using appropriations to the Great Lakes Restoration Initiative (GLRI), the U.S. Fish and Wildlife Service (FWS) anticipates providing grants to support implementation of interjurisdictional projects that cut across state and tribal Great Lakes Interstate Aquatic Invasive Species Management Plans (AIS Plans). Grants will be awarded based on a competitive process for which only Great Lakes states and tribes (or their designee) are eligible. Funding will be prioritized towards target action-oriented projects that support Great Lakes Panel regional priorities and focus on pathway intervention, detection activities, and active prevention. Two categories of projects will be considered for funding: Sustaining Projects and New Projects. Sustaining Projects are projects that continue previously funded interjurisdictional work and are deemed a priority for continued regional AIS management and prevention support. New Projects are previously unfunded work with the potential to improve regional AIS management and prevention.","eligibility":"We are seeking one application from a state and tribal natural resource agency in the Great Lakes Basin. However, that agency may designate an entity (of any type) to apply for the award on their behalf.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["parks"],"alns":["15.662"],"listings":[{"aln":"15.662","name":"Great Lakes Restoration"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/362498","tier":"likely","is_new":false,"is_updated":false,"days_to_close":62,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":491,"slug":"controlling-and-preventing-stis-in-us-health-departments-cap-stis-grants-gov-362349","name":"Controlling and Preventing STIs in US Health Departments (CAP-STIs)","number":"CDC-RFA-PS-27-0008","level":"federal","state":null,"agency":"Centers for Disease Control - NCHHSTP","agency_code":"HHS-CDC-NCHHSTP","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-05-11","closes_at":"2027-01-11","closes_text":null,"rolling":null,"amount_min":0,"amount_max":0,"match_required":false,"match_pct":null,"summary":"CDC is funding programs that track, prevent, and control sexually transmitted infections (STI) in state, district, territorial, and city or county health departments. The purpose of this NOFO is to track, prevent, and control three common STIs: syphilis, gonorrhea, and chlamydia. The NOFO supports the goals of the Sexually Transmitted Infections National Strategic Plan 2021-2025: Prevent new STIs. Improve the health of people by reducing adverse outcomes of STIs. Implement STI prevention technology and innovations more quickly. Reduce the impact of STIs in areas or populations disproportionately impacted by STIs. Achieve integrated, coordinated efforts that address the STI epidemic. Local surveillance data will determine the priority populations for this NOFO. Each program should focus on populations that are disproportionately impacted by STI transmission. To be successful with this NOFO, you will need to collaborate with partners to address interconnected comorbidities and sexual health.","eligibility":"All fifty (50) states, the District of Columbia, the US Virgin Islands and Puerto Rico are eligible to apply. To ensure implementation of STI control and prevention nationwide, CDC intends to fund all fifty states, the District of Columbia, the US Virgin Islands and Puerto Rico, non-competitively, according to a funding formula based on the respective jurisdiction\"s population & morbidity of three reportable STIs (chlamydia, gonorrhea and primary & secondary syphilis).Section 318(c) of the Public Health Services Act, 42 USC 247c(c), provides that the Secretary of HHS may provide funding to \"States and, in consultation with the State health authority, to political subdivisions of States...\" to conduct STI prevention & control projects. This language allows CDC to fund cities in addition to their respective states. Under the previous STI prevention & control funding opportunity PS19-1901 (& prior to that, PS14-1402), CDC funded the following cities based upon population, STI morbidity & organizational capacity: New York City, Philadelphia, Baltimore, Chicago, Los Angeles & San Francisco.To maximize the efficiency of program delivery, CDC may again fund a limited number of cities under this award. Funding for cities will be awarded competitively, based on the same criteria shown above for the state formula: population, STI morbidity, as well as organizational capacity. Directly funded cities must have a demonstrated capacity to report chlamydia, gonorrhea and syphilis surveillance data to CDC; an agreement with their parent state to apply separately for NOFO funding & to coordinate/collaborate appropriately following any funding; & data showing that the surrounding metropolitan statistical area (MSA) reported 2024 data showing:> or = to 500 cases of syphilis aged 15-44 reported in 2024 > or = 7500 cases of gonorrhea aged 15-44 reported in 2024 > or = to 15,000 cases of chlamydia aged 15-44 reported in 2024 > or = to 4 million residents estimated in 2024 Cities that apply for funding must submit their 2024 surveillance summary demonstrating the number of required cases & residents, a joint statement of collaboration/coordination with their respective state, or a letter indicating the city has notified the state of its application for funding of this award. In the event that cities do not compete successfully for the funding, all funds will be provided to the state, which will be responsible for distributing funds to its constituent cities as appropriate.","applicant_types":["county","municipality","special_district","state"],"categories":["health"],"alns":["93.977"],"listings":[{"aln":"93.977","name":"Sexually Transmitted Diseases (STD) Prevention and Control Grants"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/362349","tier":"likely","is_new":false,"is_updated":false,"days_to_close":73,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":249,"slug":"fiscal-year-fy-2027-americorps-state-and-national-competitive-grants-grants-gov-363696","name":"Fiscal Year (FY) 2027 AmeriCorps State and National Competitive Grants","number":"AC-08-28-26","level":"federal","state":null,"agency":"AmeriCorps","agency_code":"AC","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-08-28","closes_at":"2027-01-13","closes_text":null,"rolling":null,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"AmeriCorps improves lives, strengthens communities, and fosters civic engagement through service and volunteering. AmeriCorps brings people together to tackle some of the country’s most pressing challenges through national service and volunteerism. AmeriCorps members serve with organizations dedicated to the improvement of communities and those serving. AmeriCorps grants are awarded to eligible organizations that engage AmeriCorps members in evidence-based or evidence-informed interventions to strengthen communities. An AmeriCorps member is a person who does community service through AmeriCorps. Members may receive a living allowance and other benefits. After successful completion of their service, members earn a Segal AmeriCorps Education Award they can use to pay for higher education expenses or apply to qualified student loans.","eligibility":"State Service Commission and/or States and US Territories","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["health","housing","infrastructure","other","public_safety","water","workforce"],"alns":["94.006"],"listings":[{"aln":"94.006","name":"AmeriCorps State and National 94.006"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/363696","tier":"likely","is_new":false,"is_updated":false,"days_to_close":75,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":302,"slug":"noi-prospect-program-providing-opportunities-for-specialized-education-in-critic-grants-gov-363510","name":"NOI: PROSPECT Program: Providing Opportunities for Specialized Education in Critical Technologies","number":"DE-FOA-0003662","level":"federal","state":null,"agency":"Golden Field Office","agency_code":"DOE-GFO","connector":"grants_gov","funding_type":"other","funding_source":"direct","status":"open","opens_at":"2026-08-07","closes_at":"2027-01-15","closes_text":null,"rolling":null,"amount_min":1,"amount_max":1,"match_required":false,"match_pct":null,"summary":"The U.S Department of Energy (DOE)’s Office of Critical Minerals and Energy Innovation (CMEI) intends to establish, on behalf of the Analysis and Strategy Office (ASO), the PROSPECT Program—Providing Opportunities for Specialized Education in Critical Technologies—and anticipates investing up to $100 million, subject to the availability of appropriated funds, to strengthen the nation's educational capacity in critical minerals and materials.¿ The activities under this anticipated PROSPECT Program support collaborative approaches that strengthen educational pathways across the entire critical minerals and materials value chain—from mineral resource development and extraction through processing, manufacturing, recycling, and related supply chain activities. Specifically, the planned PROSPECT Program would build on existing investments in critical minerals and materials research, development, demonstration, and deployment by ensuring that the United States has the highly skilled workforce needed to support continued innovation and growth across the domestic supply chain.¿ Through collaboration among academia, industry, national laboratories, and other partners, the program is expected to help develop a durable talent pipeline that strengthens U.S. economic competitiveness, energy security, and national security. This Notice of Intent (NOI) is issued so that interested parties are aware of CMEI’s intention to establish this PROSPECT Program in the near term. All the information contained in this NOI is subject to change. CMEI will not respond to questions concerning this NOI. Complete information, including the full Notice of Intent, can be found on the DOE CMEI Funding Opportunities website: https://eere-exchange.energy.gov/.","eligibility":null,"applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["energy"],"alns":["81.117"],"listings":[{"aln":"81.117","name":"Energy Efficiency and Renewable Energy Information Dissemination, Outreach, Training and Technical Analysis/Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363510","tier":"likely","is_new":false,"is_updated":false,"days_to_close":77,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":6618,"slug":"landscape-scale-restoration-grant-program-for-non-federal-lands-grants-gov-364144","name":"Landscape Scale Restoration Grant Program for Non-Federal Lands","number":"USDA-FS-2026-LSR","level":"federal","state":null,"agency":"Forest Service","agency_code":"USDA-FS","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-28","closes_at":"2027-01-26","closes_text":"Applications due in grants.gov 11:59 p.m. Eastern January 26, 2027. Note: By December 17, 2026 all applicants except federally recognized Tribes and Tribal organizations must submit the project narrative and budget to the relevant State Forester(s) for sponsorship consideration.","rolling":null,"amount_min":100000,"amount_max":600000,"match_required":true,"match_pct":null,"summary":"The Forest Service is offering this one LSR non-federal lands Notice of Funding Opportunity (NOFO) which replaces the three regional (Southern/IITF, Western, and Northeast/Midwestern) NOFOs. The purpose of the Landscape Scale Restoration (LSR) Program is to encourage collaborative, science-based restoration of priority forest landscapes. This competitive grant program supports collaborative high impact projects that lead to measurable outcomes on priority forest landscapes, leverage public and private resources, and further priorities identified in a State Forest Action Plan or equivalent science-based restoration strategy. Proposals should reduce wildfire risk, improve fish and wildlife habitats, maintain or improve water quality and watershed function, and/or mitigate invasive plants, insects, and disease. Eligible Lands: LSR projects must be conducted on rural non-industrial private forest land, and/or rural state or local government forest land. See NOFO for more definitions. For the purposes of this program, “rural” is defined as all areas outside Census places greater than 50,000 people according to the latest United States Census. Please use the LSR Project Planning Tool (Project Eligibility) to confirm if your proposed project location is eligible within this definition. Individual Award Funding: Minimum: $100,000 per project. $50,000 per project for the Virgin Islands, Guam, American Samoa, the Northern Mariana Islands, the Freely Associated States of the Republic of Palau (Palau), the Federated States of Micronesia, and the Republic of the Marshall Islands. Maximum: $300,000 for single-state projects; $600,000 for multi-state projects. Cost Share Required: Grant recipients must match (cost share) the Federal grant funds 1:1 with non-Federal sources. State Forester Sponsorship: All applications except those submitted by federally recognized Tribes and Tribal organizations require the relevant State Forester(s) to sponsor the project. Each State Forester may sponsor/participate in up to a total of 10 applications, including up to 5 single-state applications and up to 5 multi-state applications. For Tribes and Tribal organizations: Federally Recognized Tribes are limited to 2 applications for this NOFO. There is a separate national LSR NOFO for federally recognized Tribes and Tribal organizations: USDA-FS-2026-LSR-TRIBAL. Federally recognized Tribes and Tribal organizations may apply to either or both NOFOs but cannot receive more than one award for the same scope of work. For additional information and requirements, please refer to the NOFO document, which is posted in both the \"Related Documents\" tab and in the \"Instructions\" link located in the \"Package\" tab.","eligibility":"There is a separate national LSR Notice of Funding Opportunity (NOFO) for federally recognized Tribes and Tribal organizations: USDA-FS-2026-LSR-TRIBAL. Federally recognized Tribes and Tribal organizations may apply to either or both NOFOs but cannot receive more than one award for the same scope of work.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["parks","water"],"alns":["10.742"],"listings":[{"aln":"10.742","name":"Landscape-Scale Restoration"}],"first_seen":"2026-10-28T16:13:19Z","last_changed":"2026-10-28T16:13:19Z","source_url":"https://www.grants.gov/search-results-detail/364144","tier":"likely","is_new":true,"is_updated":false,"days_to_close":88,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":192,"slug":"fy2026-2027-community-compass-technical-assistance-and-capacity-building-program-grants-gov-363878","name":"FY2026/2027 Community Compass Technical Assistance and Capacity Building Program Notice of Funding Opportunity","number":"PDR-2600-DC-0006","level":"federal","state":null,"agency":"Department of Housing and Urban Development","agency_code":"HUD","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-09-16","closes_at":"2027-02-03","closes_text":null,"rolling":null,"amount_min":250000,"amount_max":35000000,"match_required":false,"match_pct":null,"summary":"The Community Compass Technical Assistance (CCTA) program awards competitive grants to eligible applicants. With these grants, you will provide technical assistance (TA) to the people and organizations HUD serves. Under this Notice of Funding Opportunity (NOFO), HUD will award up to $86,000,000 in 2026 funding for TA. We invite applications from organizations with deep experience and a commitment to excellence. If awarded, you will deliver results in communities across the country and support the Administration's priorities. As a recipient, you will: Develop tools and products that train and educate, Work directly with communities to improve their systems and processes, Assess your audience so you can design curriculums that fit their needs, Partner with HUD on urgent, high-priority projects, Serve as a thought partner with HUD by helping identify needs, s_at":"2022-01-13","closes_at":"2027-02-11","closes_text":"Electronically submitted applications must be submitted no later than 11:59 pm ET on the listed application due date.","rolling":null,"amount_min":50000,"amount_max":5000000,"match_required":false,"match_pct":null,"summary":"CDC seeks to enhance the nation’s ability to rapidly mobilize, surge, and respond to public health emergencies (PHEs) as identified by CDC by establishing a roster of approved but unfunded (ABU) applicants that may receive rapid funding to respond to PHEs of such magnitude, complexity, or significance that they would have an overwhelming impact upon, and exceed resources available to, the jurisdictions. Applicants will undergo an objective merit review process, and entities that successfully meet the requirements for approval will be placed on the ABU list. CDC will use this ABU list for emergencies that require federal support to effectively respond to, manage, and address identified public health threats. CDC will make funding related to this NOFO available once it has determined a public health emergency exists or is considered imminent and will be contingent upon the availability and stipulations of appropriations. CDC will provide additional guidance and information to those on the ABU list when this NOFO is funded. Since this NOFO is designed to collect applications prior to a PHE, applicants are encouraged to submit work plans and budgets that demonstrate their ability to respond to a PHE. COVID-19 public health response plans, such as plans funded under CDC-RFA-TP18-1802 in 2020 are acceptable for this purpose. If this NOFO is funded for a specific PHE, CDC will develop supplemental guidance that outlines additional work plan and budget requirements tailored to the emergency. This NOFO is not a capacity-building funding mechanism, and it is not intended to create or establish new public health (PH) emergency management programs. It may be used to re- establish capacity lost or diminished because of the public health crisis. It is designed to support the surge needs of existing programs responding to a significant PHE. CDC will provide supplemental guidance to entities on the ABU list when this NOFO is activated regarding specific activities intended to address the emergency. CDC has strong relationships with governmental PH departments, community-based organizations, and other domestic partners and supports them for planning, capacity-building, preparedness, and response to PHEs. This NOFO complements these ongoing capacity-building preparedness and response programs by providing a mechanism for CDC to rapidly mobilize and fund PH organizations for specific response needs. Applicants must describe how this funding will not duplicate or supplant other federal funding. Upon occurrence of a PHE, CDC can rapidly fund specific applicants to accelerate public health crisis response activities such as coordinating emergency operations, hiring surge staff, and conducting needs assessments to determine the resources necessary to address the public health crisis. The NOFO also provides funding for specialized public health emergency response activities tailored to the specific public health crisis.","eligibility":"This NOFO is intended for states, political subdivisions of states, and other public entities as specified in section 317(a) of the Public Health Service Act (42 USC § 247(b)). It targets public health organizations that serve state, tribal, local, and territorial populations and are constitutionally empowered to protect the health and welfare of their respective communities, focused on executing emergency preparedness and response services. To demonstrate existing capacity for public health emergency management, applicants must submit their response organizational charts and work plans. If these documents are not submitted, the application will be considered non-responsive and will receive no further review. Local government organizations ents (IVH-STTP)","number":"CDC-RFA-PS-27-0009","level":"federal","state":null,"agency":"Centers for Disease Control - NCHHSTP","agency_code":"HHS-CDC-NCHHSTP","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-06-09","closes_at":"2027-02-16","closes_text":null,"rolling":null,"amount_min":0,"amount_max":0,"match_required":false,"match_pct":null,"summary":"This NOFO supports integrated viral hepatitis surveillance and prevention programs in states, territories, and large cities in the United States. Key strategies include viral hepatitis outbreak response and surveillance for hepatitis A, acute and chronic hepatitis B, and acute, chronic, and perinatal hepatitis C. Surveillance activities include developing and utilizing disease registries, conducting data matching, generating data summaries, utilizing data to monitor program progress and inform program activities and to enhance case investigations for data-to-care opportunities, and strengthening health department infrastructure to expand surveillance capacity. Prevention activities include supporting viral hepatitis elimination planning, partnerships, and coordination in high-impact and healthcare settings, increasing hepatitis B and hepatitis C testing, treatment, and service integration in high-impact settings, and developing perinatal hepatitis C programs. Expected outcomes include improved surveillance and reporting of viral hepatitis, improved strategic planning and partner collaboration in viral hepatitis elimination, and expanded access to viral hepatitis prevention, diagnosis, and treatment in high-impact settings. This multi-component NOFO includes two required components and two optional components: Component 1: Outbreak Response and Surveillance (Required) Component 2: Planning, Partnerships, and Promotion (Required) Component 3: Testing, Treatment, and Prevention (Optional) Component 4: Perinatal Hepatitis C Program (Optional) ic of Palau.RCORP-Evaluation activities may only support HRSA-designated rural counties and rural census tracts.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["health"],"alns":["93.690"],"listings":[{"aln":"93.690","name":"Rural Communities Opioid Response Programs"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363600","tier":"likely","is_new":false,"is_updated":false,"days_to_close":144,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":261,"slug":"appalachian-region-healthcare-support-program-grants-gov-363697","name":"Appalachian Region Healthcare Support Program","number":"HRSA-27-053","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-08-24","closes_at":"2027-03-27","closes_text":null,"rolling":null,"amount_min":0,"amount_max":2500000,"match_required":false,"match_pct":null,"summary":"The Appalachian Region Healthcare Support Program provides technical assistance (TA) to help rural healthcare organizations, including critical access hospitals (CAHs), small rural hospitals, rural health clinics, tribal healthcare facilities, and other healthcare organizations located in the rural counties served by the Appalachian Regional Commission (ARC) with planning and implementing health care service improvements. The goal of this program is to strengthen healthcare delivery in rural areas of the Appalachian Region by improving financial and operational performance as well as the quality of care in rural healthcare organizations.","eligibility":"Successful applications must target rural healthcare organizations located in the Appalachian region. For the purposes of this notice of funding opportunity, a \"rural healthcare organization\" is a healthcare organization located in a rural county in the Appalachian region. \"Healthcare organizations\" include: critical access hospitals (CAHs), small rural hospitals, rural health clinics, tribal healthcare facilities, and other healthcare organizations.","applicant_types":["business","county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["health"],"alns":["93.619"],"listings":[{"aln":"93.619","name":"Rural Health Limited Geographic Areas: Delta, Appalachian Region, and Northern Border Region"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363697","tier":"likely","is_new":false,"is_updated":false,"days_to_close":148,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":338,"slug":"drug-free-communities-dfc-support-program-competing-continuation-year-6-grants-gov-363354","name":"Drug-Free Communities (DFC) Support Program – Competing Continuation (Year 6)","number":"CDC-RFA-CE22-22050601CONT27","level":"federal","state":null,"agency":"Centers for Disease Control - NCIPC","agency_code":"HHS-CDC-NCIPC","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-28","closes_at":"2027-03-31","closes_text":null,"rolling":null,"amount_min":0,"amount_max":125000,"match_required":true,"match_pct":null,"summary":"The Drug-Free Communities (DFC) Support Program was created by the Drug-Free Communities Act of 1997 (Public Law 105-20). The Executive Office of the President, Office of National Drug Control Policy (ONDCP), and the Department of Health and Human Services (HHS), Centers for Disease Control and Prevention (CDC), National Center for Injury Prevention and Control (NCIPC) are accepting applications for Fiscal Year (FY) 2026 Drug-Free Communities (DFC) Support Program Grants. The purpose of the DFC Support Program is to establish and strengthen collaborations to support the efforts of community coalitions working to prevent and reduce substance use among youth. By statute, the DFC Support Program has two goals: 1) Establish and strengthen the collaboration among communities, public and private non-profit agencies, as well as federal, state, local, and tribal governments to support the efforts of community coalitions working to prevent and reduce substance use among youth (individuals 18 years of age and younger). 2) Reduce substance use among youth and, over time, reduce substance use among adults by addressing the factors in a community that increases the risk of substance use and promoting the factors that minimize the risk of substance use. This funding opportunity will fund applicants who have concluded the first (Year 1 – 5) funding cycle or have experienced a lapse in funding.","eligibility":"Eligible applicants are community-based coalitions addressing youth substance use that have previously received a DFC grant (Year 1–5), have experienced a lapse in funding, or have concluded the first five-year funding cycle and are applying for a second five-year funding cycle.A DFC legal applicant (an organization applying on behalf of a coalition, the coalition, or the applicant coalition) must reside within the United States and/or the U.S. territories.Applicants must be a nonprofit (as defined by the IRS as a 501(c) organization); or an entity that the Administrator determines to be appropriate; or part of, or is associated with an established legally recognized domestic, public or private nonprofit organization.These entities can include state and local governments, federally recognized tribes, state-recognized tribes, urban Indian organizations (as defined in Pub. L. No. 94-437), public or private universities and colleges, professional associations, voluntary organizations, self-help groups, consumer and provider services-oriented constituency groups, community- and faith-based organizations, and tribal organizations. (Pub. L. No. 114-198 Sec 103).For the purposes of this NOFO and the DFC Support Program, a coalition is defined as a community-based formal arrangement for cooperation and collaboration among groups or sectors of a community in which each group retains its identity, but all agree to work together toward a common goal of building a safe, healthy, and drug-free community.","applicant_types":["county","higher_ed","municipality","nonprofit","school","special_district","tribe"],"categories":["health"],"alns":["93.276"],"listings":[{"aln":"93.276","name":"Drug-Free Communities Support Program Grants"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363354","tier":"likely","is_new":false,"is_updated":false,"days_to_close":152,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":333,"slug":"drug-free-communities-dfc-support-program-new-year-1-grants-gov-363353","name":"Drug-Free Communities (DFC) Support Program – NEW (Year 1)","number":"CDC-RFA-CE-27-0058","level":"federal","state":null,"agency":"Centers for Disease Control - NCIPC","agency_code":"HHS-CDC-NCIPC","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-28","closes_at":"2027-03-31","closes_text":null,"rolling":null,"amount_min":0,"amount_max":125000,"match_required":true,"match_pct":null,"summary":"The Drug-Free Communities (DFC) Support Program was created by the Drug-Free Communities Act of 1997 (Public Law 105-20). The Executive Office of the President, Office of National Drug Control Policy (ONDCP), and the Department of Health and Human Services (HHS), Centers for Disease Control and Prevention (CDC), National Center for Injury Prevention and Control (NCIPC) are accepting applications for Fiscal Year (FY) 2027 Drug-Free Communities (DFC) Support Program grants. The purpose of the DFC Support Program is to establish and strengthen collaboration to support the efforts of community coalitions working to prevent youth substance use. By statute, the DFC Support Program has two goals: 1) Establish and strengthen collaboration among communities, public and private non-profit agencies, as well as federal, state, local, and tribal governments to support the efforts of community coalitions working to prevent and reduce substance abuse among youth (individuals 18 years of age and younger). 2) Reduce substance abuse among youth and, over time, reduce substance abuse among adults by addressing the factors in a community that increase the risk of substance abuse and promoting the factors that minimize the risk of substance abuse.","eligibility":"Nonprofits having a 501(c)(3) status with the IRS, other than institutions of higher education. A DFC legal applicant (an organization applying on behalf of a coalition, the coalition, or the applicant coalition) must reside within the United States and/or the U.S. territories.Additional Information on Eligibility: Eligible applicants are community-based coalitions addressing youth substance use that have not yet previously received a DFC grant. Applicants must be a nonprofit (as defined by the IRS as a 501(c) organization); or an entity that the Administrator determines to be appropriate; or part of, or is associated with an established legally recognized domestic, public or private nonprofit organization. For example, state and local governments, federally recognized tribes, state-recognized tribes, urban Indian organizations (as defined in Pub. L. No. 94-437), public or private universities and colleges, professional associations, voluntary organizations, self-help groups, consumer and provider services-oriented constituency groups, community- and faith-based organizations, and tribal organizations. (Pub. L. No. 114-198 Sec 103). For the purposes of this NOFO and the DFC Support Program, a coalition is defined as a community-based formal arrangement for cooperation and collaboration among groups or sectors of a community in which each group retains its identity, but all agree to work together toward a common goal of building a safe, healthy, and drug-free community.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["health"],"alns":["93.276"],"listings":[{"aln":"93.276","name":"Drug-Free Communities Support Program Grants"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363353","tier":"likely","is_new":false,"is_updated":false,"days_to_close":152,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":283,"slug":"rural-communities-opioid-response-program-community-systems-development-grants-gov-363601","name":"Rural Communities Opioid Response Program - Community Systems Development","number":"HRSA-27-042","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-08-14","closes_at":"2027-04-06","closes_text":null,"rolling":null,"amount_min":0,"amount_max":500000,"match_required":false,"match_pct":null,"summary":"The Rural Communities Opioid Response Program (RCORP) - Community Systems Development provides funding to communities in rural areas to develop and/or expand behavioral health systems of care through formalized networks that expand operational and clinical service capacity regionally through coordinated implementation of evidence-based SUD prevention, treatment, recovery, and related services.","eligibility":"You can apply if you are a domestic public or private, non-profit or for-profit entity. \"Domestic\" means the 50 states, the District of Columbia, the Commonwealth of Puerto Rico, the Northern Mariana Islands, American Samoa, Guam, the U.S. Virgin Islands, the Federated States of Micronesia, the Republic of the Marshall Islands, and the Republic of Palau.RCORP-Community Systems Development services and activities may only support HRSA-designated rural counties and rural census tracts.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["health"],"alns":["93.690"],"listings":[{"aln":"93.690","name":"Rural Communities Opioid Response Programs"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363601","tier":"likely","is_new":false,"is_updated":false,"days_to_close":158,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":92,"slug":"notice-of-intent-to-issue-nofo-de-foa-0003649-leveraging-domestic-infrastructure-grants-gov-364070","name":"Notice of Intent to Issue NOFO DE-FOA-0003649: Leveraging Domestic Infrastructure and Resources to Unleash Alternative Chemicals, Fuels and Feedstocks","number":"DE-FOA-0003648","level":"federal","state":null,"agency":"Golden Field Office","agency_code":"DOE-GFO","connector":"grants_gov","funding_type":"other","funding_source":"direct","status":"open","opens_at":"2026-10-13","closes_at":"2027-04-26","closes_text":null,"rolling":null,"amount_min":0,"amount_max":0,"match_required":false,"match_pct":null,"summary":"CMEI intends to issue, on behalf of AFFO, a NOFO titled, “Leveraging Domestic Infrastructure and Resources to Unleash Alternative Chemicals, Fuels, and Feedstocks”. This NOFO will seek applications for financial assistance awards that would support AFFO’s vision to push the frontiers of science and engineering, advance energy addition, and unleash American energy innovation. The purpose of the potential NOFO is to solicit innovative technologies that harness existing domestic biomass and pipeline resources to expand energy production and distribution. The NOFO will advance multiple alternative fuels and feedstock technology areas to maximize the benefits of these existing resources: the production of liquid intermediate products made from biomass, that are chemically, thermally, and physically stable, and that could be sold as commodities for various end applications, including for further upgrading to renewable fuels and chemicals; production of commodity chemicals and fuels at market prices from alternative feedstocks, leveraging existing refinery assets; and establishing pilot sites for blended hydrogen-natural gas that closely simulate actual gas distribution networks, to improve reliability, scalability, suitability, performance, and durability. This NOI is for informational purposes only; we are not requesting comments or applications at this time. All information provided here is subject to change. This notice serves to inform interested parties that the DOE may issue a notice of funding opportunity (NOFO). Please be aware that any future NOFO could differ significantly from what is described here, or one may not be issued at all. We will provide a designated channel for questions once a NOFO is officially released. Complete information, including the full Notice of Intent, can be found on the DOE Funding Opportunities website: https://exchange.energy.gov/.","eligibility":null,"applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["energy"],"alns":["81.117"],"listings":[{"aln":"81.117","name":"Energy Efficiency and Renewable Energy Information Dissemination, Outreach, Training and Technical Analysis/Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364070","tier":"likely","is_new":false,"is_updated":false,"days_to_close":178,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":260,"slug":"f26as00105-national-fish-passage-program-grants-gov-363699","name":"F26AS00105 National Fish Passage Program","number":"F26AS00105","level":"federal","state":null,"agency":"Fish and Wildlife Service","agency_code":"DOI-FWS","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-08-24","closes_at":"2027-04-30","closes_text":"Electronically submitted applications must be submitted no later than 11:59 PM, ET, on the listed application due date.","rolling":null,"amount_min":1,"amount_max":1000000,"match_required":false,"match_pct":null,"summary":"The National Fish Passage Program (NFPP) provides technical and financial assistance to partners to remove instream barriers and restore aquatic connectivity, improve community safety, and support local economies. Fish passage projects benefit communities by reducing flood risk, improving recreational opportunities, and improving roads while supporting native fish populations and aquatic ecosystems. NFPP project examples include obsolete and dangerous infrastructure removals, culvert replacements, floodplain restoration, and the installation of fishways. It is estimated that for every $1 million invested by the program, $1.5 million in value is added to the economy.The program is delivered through U.S. Fish and Wildlife Service (Service) field offices nationwide. Local Service staff work with partners to identify and implement projects. Projects are based on sound science, advance the Service mission, and promote aquatic connectivity. Contact a regional NFPP Coordinator in your area for information about program priorities and the application process.The Commerce, Justice, Science; Energy and Water Development; and Interior and Environment Appropriations Act, 2026, allocated $15 million for the National Fish Passage Program, of which $5 million is designated for implementing the Fisheries Restoration and Irrigation Mitigation Act (FRIMA) (Public Law 106-502) of 2000.","eligibility":"The program seeks and develops projects collaboratively with partners, including but not limited to: State and local agencies, Tribes, non-governmental organizations, other Federal agencies, and private landowners. Additional requirements and geographic restrictions apply to FRIMA funded projects. See website for more information.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["water"],"alns":["15.685"],"listings":[{"aln":"15.685","name":"National Fish Passage"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363699","tier":"likely","is_new":false,"is_updated":false,"days_to_close":182,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":270,"slug":"modernizing-violent-death-and-suicide-surveillance-using-the-national-violent-de-grants-gov-363683","name":"Modernizing Violent Death and Suicide Surveillance Using the National Violent Death Reporting System (NVDRS)","number":"CDC-RFA-CE-27-0006","level":"federal","state":null,"agency":"Centers for Disease Control - NCIPC","agency_code":"HHS-CDC-NCIPC","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-08-20","closes_at":"2027-05-04","closes_text":null,"rolling":null,"amount_min":0,"amount_max":966085,"match_required":false,"match_pct":null,"summary":"The National Violent Death Reporting System (NVDRS) is CDC's state-based surveillance system for violent deaths and suicides. NVDRS combines information from death certificates, coroner or medical examiner reports, including toxicology reports, and law enforcement reports to provide comprehensive, incident-level data on the circumstances surrounding violent deaths. Through this Notice of Funding Opportunity, CDC will support eligible state, territorial, and local government entities, or their bona fide agents, in operating and modernizing NVDRS. Recipients will conduct statewide or territory-wide surveillance by collecting, linking, managing, analyzing, and submitting high-quality data on violent deaths and suicides. A central focus of this NOFO is timely and complete data reporting through two coordinated reporting processes: quarterly provisional data pulls and annual data closeout. Beginning in Year 1, recipients will prepare data for CDC's quarterly provisional data pulls to support earlier access to preliminary, actionable information. Recipients will progressively update case records as additional source documents and information become available. Annual data closeout is the primary process for producing the complete, finalized, and validated NVDRS dataset for each data year. Recipients must ensure that all eligible cases are fully abstracted, updated, validated, and completed using all required and available data sources by the annual closeout deadline. The finalized annual dataset supports national reporting, analysis, dissemination, and public health action. This NOFO also emphasizes modernization of data systems and workflows to increase efficiency, reduce reporting burden, improve data quality and timeliness, and enhance data usability. All recipients will complete a modernization readiness assessment within six months of award and implement at least one modernization pilot during the period of performance. Pilot activities may include automated data import and extraction, electronic data exchange and interoperability, workflow automation, data-quality tools, and enhanced data analysis and visualization. With CDC approval, recipients may also participate in optional activities that link NVDRS data with other relevant data systems to improve surveillance and expand public health insights. The intended outcome is a sustainable, modernized national surveillance system that produces timely provisional data and complete, reliable, high-quality annual data to inform violence and suicide prevention and support public health action.","eligibility":"Eligible applicants are U.S. state governments, including the District of Columbia; U.S. territorial governments; and political subdivisions of states, including county, city or township, and special district governments.Bona fide agents may apply on behalf of an eligible state, territorial, or local government organization. A bona fide agent must submit documentation demonstrating its formal arrangement with and authority to apply on behalf of the eligible governmental entity.Only one application will be funded from each eligible state or territory. Applicants must demonstrate the ability to implement statewide or territory-wide surveillance and access the data sources required for the National Violent Death Reporting System, including death certificates, coroner or medical examiner reports, including toxicology reports, and law enforcement reports.","applicant_types":["county","municipality","special_district","state"],"categories":["health"],"alns":["93.136"],"listings":[{"aln":"93.136","name":"Injury Prevention and Control Research and State and Community Based Programs"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363683","tier":"likely","is_new":false,"is_updated":false,"days_to_close":186,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":225,"slug":"assisted-outpatient-treatment-grants-gov-363811","name":"Assisted Outpatient Treatment","number":"SM-27-002","level":"federal","state":null,"agency":"Substance Abuse and Mental Health Services Adminis","agency_code":"HHS-SAMHS-SAMHSA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-09-03","closes_at":null,"closes_text":null,"rolling":null,"amount_min":null,"amount_max":null,"match_required":false,"match_pct":null,"summary":"The purpose of this program is to facilitate the implementation of Assisted Outpatient Treatment (AOT) for adults with serious mental illness (SMI). Recipients are expected to implement the AOT program, working with civil courts, community partners, and other entities to support community-based treatment for adults with SMI who meet criteria for AOT.","eligibility":"Eligibility is statutorily limited to counties, cities, mental health systems (including mental health authorities), mental health courts, or any other entities with authority under the law of the State in which the applicant is located to implement, monitor and oversee assisted outpatient programs.","applicant_types":["county","municipality"],"categories":["health"],"alns":["93.997"],"listings":[{"aln":"93.997","name":"Assisted Outpatient Treatment"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363811","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":1004,"slug":"atlanta-fy-2021-fy-2023-eda-planning-and-local-technical-assistance-grants-gov-332052","name":"Atlanta FY 2021 – FY 2023 EDA Planning and Local Technical Assistance","number":"EDA-ATL-TA-ATRO-2021-2006846","level":"federal","state":null,"agency":"Department of Commerce","agency_code":"DOC","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2021-03-15","closes_at":null,"closes_text":"Applications are accepted on a continuing basis and processed as received. This Planning and Local Technical Assistance opportunity will remain in effect until superseded by a future announcement.","rolling":null,"amount_min":0,"amount_max":300000,"match_required":true,"match_pct":null,"summary":"NOTICE: Application Process as of April 6th EDA is excited to announce the launch of its new grants management platform: the Economic Development Grants Experience (EDGE). EDGE was developed to streamline the application and grants management process by implementing a single platform with increased transparency, improved user experience, higher data quality, and more efficiency throughout the entire grant lifecycle. As of April 6th, 2023, applications can no longer be submitted on Grants.gov, and will ONLY be accepted through EDGE. To apply in EDGE, please go to: sfgrants.eda.gov. More information on how to apply is provided in the full NOFO. PARTNERSHIP PLANNING program instructions: Please note that applicants will be invited to submit applications through EDGE for the Partnership Planning program. For more information, please reach out to your EDA point of contact. Program Description: EDA makes planning and local technical assistance investments to support economic development, foster job creation, and attract private investment in economically distressed areas of the United States. Under the Planning program, EDA makes Partnership Planning, Short-Term Planning, and State Planning awards to eligible recipients to create and implement regional economic development plans designed to build capacity and guide the economic prosperity and resiliency of an area or region. More specifically, EDA makes Partnership Planning investments to designated planning organizations (i.e., District Organizations) serving EDA-designated Economic Development Districts and to Indian Tribes to facilitate the development, implementation, revision, or replacement of Comprehensive Economic Development Strategies (CEDS), which articulate and prioritize the strategic economic goals of recipients’ respective regions. EDA also makes Short-Term and State Planning awards for economic development planning activities that guide the eventual creation and retention of high-quality jobs, particularly for the unemployed and underemployed in the Nation’s most economically distressed regions. Under the Local Technical Assistance program, EDA makes awards to strengthen the capacity of local or State organizations, institutions of higher education, and other eligible entities to undertake and promote effective economic development programs through projects such as feasibility studies, impact analyses, disaster resiliency plans, and project planning. *Please note: While the published Notice of Funding Opportunity (available under \"Related Documents\") states that the ED900A form and the SF424B form are both required for a complete application, these forms are no longer required and have therefore been removed from the package template.","eligibility":"Pursuant to section 3 of the Public Works and Economic Development Act of 1965 (42 U.S.C. § 3122) (PWEDA) and EDA’s regulation at 13 C.F.R. § 300.3, the following types of entities are eligible to receive funding assistance from EDA: 1. District Organizations (as defined in 13 C.F.R. § 300.3); 2. Indian Tribes or a consortium of Indian Tribes; 3. States, cities, or other political subdivisions of a State, including a special purpose unit of a State or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions; 4. Institutions of higher education or a consortium of institutions of higher education; or 5. Public or private non-profit organizations or associations acting in cooperation with officials of a political subdivision of a State.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["11.302","11.303"],"listings":[{"aln":"11.302","name":"Economic Development Support for Planning Organizations"},{"aln":"11.303","name":"Economic Development Technical Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/332052","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":1006,"slug":"austin-fy-2021-fy-2023-eda-planning-and-local-technical-assistance-grants-gov-332137","name":"Austin FY 2021 – FY 2023 EDA Planning and Local Technical Assistance","number":"EDA-AUS-TA-AURO-2021-2006848","level":"federal","state":null,"agency":"Department of Commerce","agency_code":"DOC","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2021-03-15","closes_at":null,"closes_text":"Applications are accepted on a continuing basis and processed as received. This Planning and Local Technical Assistance opportunity will remain in effect until superseded by a future announcement.","rolling":null,"amount_min":0,"amount_max":300000,"match_required":true,"match_pct":null,"summary":"UPDATED NOTICE - PLEASE READ: April 6, 2023 EDA is excited to announce the launch of its new grants management platform: the Economic Development Grants Experience (EDGE). EDGE was developed to streamline the application and grants management process by implementing a single platform with increased transparency, improved user experience, higher data quality, and more efficiency throughout the entire grant lifecycle. As of April 6th, 2023, applications can no longer be submitted on Grants.gov, and will ONLY be accepted through EDGE. To apply in EDGE, please go to: sfgrants.eda.gov. More information on how to apply is provided in the full NOFO. PARTNERSHIP PLANNING program instructions: Please note that applicants will be invited to submit applications through EDGE for the Partnership Planning program. For more information, please reach out to your EDA point of contact. Program Description: EDA makes planning and local technical assistance investments to support economic development, foster job creation, and attract private investment in economically distressed areas of the United States. Under the Planning program, EDA makes Partnership Planning, Short-Term Planning, and State Planning awards to eligible recipients to create and implement regional economic development plans designed to build capacity and guide the economic prosperity and resiliency of an area or region. More specifically, EDA makes Partnership Planning investments to designated planning organizations (i.e., District Organizations) serving EDA-designated Economic Development Districts and to Indian Tribes to facilitate the development, implementation, revision, or replacement of Comprehensive Economic Development Strategies (CEDS), which articulate and prioritize the strategic economic goals of recipients’ respective regions. EDA also makes Short-Term and State Planning awards for economic development planning activities that guide the eventual creation and retention of high-quality jobs, particularly for the unemployed and underemployed in the Nation’s most economically distressed regions. Under the Local Technical Assistance program, EDA makes awards to strengthen the capacity of local or State organizations, institutions of higher education, and other eligible entities to undertake and promote effective economic development programs through projects such as feasibility studies, impact analyses, disaster resiliency plans, and project planning. **Please note: While the published Notice of Funding Opportunity (available under \"Related Documents\") states that the ED900A form and the SF424B form are both required for a complete application, these forms are no longer required and have therefore been removed from the package template.","eligibility":"Pursuant to section 3 of the Public Works and Econom en removed from the package template.","eligibility":"Pursuant to section 3 of the Public Works and Economic Development Act of 1965 (42 U.S.C. § 3122) (PWEDA) and EDA’s regulation at 13 C.F.R. § 300.3, the following types of entities are eligible to receive funding assistance from EDA: 1. District Organizations (as defined in 13 C.F.R. § 300.3); 2. Indian Tribes or a consortium of Indian Tribes; 3. States, cities, or other political subdivisions of a State, including a special purpose unit of a State or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions; 4. Institutions of higher education or a consortium of institutions of higher education; or 5. Public or private non-profit organizations or associations acting in cooperation with officials of a political subdivision of a State.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["11.302","11.303"],"listings":[{"aln":"11.302","name":"Economic Development Support for Planning Organizations"},{"aln":"11.303","name":"Economic Development Technical Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/332126","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":691,"slug":"eda-fy25-disaster-supplemental-grants-gov-359225","name":"EDA FY25 Disaster Supplemental","number":"EDA-DISASTER-2025","level":"federal","state":null,"agency":"Economic Development Administration","agency_code":"DOC-EDA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2025-06-04","closes_at":null,"closes_text":"There are no submission deadlines. Applications will be accepted on an ongoing basis until the publication of a new Disaster Supplemental NOFO, cancellation of this Disaster Supplemental NOFO or all available funds have been expended.","rolling":null,"amount_min":0,"amount_max":50000000,"match_required":true,"match_pct":null,"summary":"Through this Disaster NOFO, EDA will award investments in regions experiencing severe economic distress or other economic harm resulting from hurricanes, wildfires, tornadoes, floods, and other natural disasters occurring in calendar years 2023 and 2024. EDA’s goal under this NOFO is to assist communities recovering from a disaster by realizing opportunities to recover and change the economic trajectory of the community for the better. In other words, EDA funding seeks to help communities recover and set them on a path to exceed their previous pre-disaster baseline. EDA seeks projects that are responsive to community needs post-disaster by engaging all aspects of the community, with special focus on private industry partners. This Disaster NOFO provides funding through three pathways: Readiness Path – Standalone non-construction projects designed to increase a community’s readiness to apply for or implement disaster recovery funding from private and public sources including, but not limited to, future EDA NOFOs and the Implementation or Industry Transformation Paths under this NOFO. Projects will fund strategy development, capacity building, and/or predevelopment costs necessary for future recovery projects. Implementation Path – Standalone construction or non-construction projects designed to address the economic challenges faced by a community recovering from a natural disaster and improve economic trajectories beyond pre-disaster economic conditions. Industry Transformation Path – Led by a coalition of regional stakeholders, a portfolio of large-scale, multicomponent construction and non-construction projects designed to fundamentally transform the economic trajectory of a region through the development or acceleration of an industry.","eligibility":"Eligible applicants under the FY25 Disaster program include a(n): District organization of an EDA-designated Economic Development District (EDD); Indian tribe or a consortium of Indian tribes; State, county, city, or other political subdivision of a state, including a special purpose unit of a state or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions, institution of higher education or a consortium of institutions of higher education; public or private nonprofit organization or association acting in cooperation with officials of a political subdivision of a state; an economic development organization; or a public-private partnership for public infrastructure. EDA is not authorized to provide grants or cooperative agreements to individuals or for-profit entities under this NOFO. Applications from individuals or for-profit entities will not be considered for funding.","applicant_types":["county","municipality","nonprofit","school","tribe"],"categories":["other"],"alns":["11.307"],"listings":[{"aln":"11.307","name":"Economic Adjustment Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/359225","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":982,"slug":"fy-2023-disaster-supplemental-grants-gov-347414","name":"FY 2023 Disaster Supplemental","number":"EDA-DISASTER-2023","level":"federal","state":null,"agency":"Economic Development Administration","agency_code":"DOC-EDA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2023-04-24","closes_at":null,"closes_text":"There are no submission deadlines. Applications will be accepted on an ongoing basis until the publication of a new Disaster Supplemental NOFO, cancellation of this Disaster Supplemental NOFO or all available funds have been expended.","rolling":null,"amount_min":0,"amount_max":30000000,"match_required":true,"match_pct":null,"summary":"Subject to the availability of funds, awards made under this NOFO will help communities and regions devise and implement long-term economic recovery strategies through a variety of non-construction and construction projects, as appropriate, to address economic challenges in areas where a Presidential declaration of a major disaster was issued under the Robert T. Stafford Disaster Relief and Emergency Assistance Act (42 U.S.C. § 5121 et seq.) (Stafford Act) “as a result of Hurricanes Ian and Fiona, and of wildfires, flooding, and other natural disasters occurring in calendar years 2021 and 2022….” EDA is excited to announce the launch of its new grants management platform: the Economic Development Grants Experience (EDGE). EDGE was developed to streamline the application and grants management process by implementing a single platform with increased transparency, improved user experience, higher data quality, and more efficiency throughout the entire grant lifecycle. Starting April 6, 2023, applications will no longer be accepted on Grants.gov, and will ONLY be accepted through EDGE (sfgrants.eda.gov). To apply for the FY 2023 Disaster Supplemental NOFO, please access the portal here. More information on how to apply is provided in the full NOFO.","eligibility":"District Organization; Indian Tribe or a consortium of Indian Tribes; State, county, city, or other political subdivision of a State, including a special purpose unit of a State or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions; Institution of higher education or a consortium of institutions of higher education; or Public or private non-profit organization or association acting in cooperation with officials of a political subdivision of a State. The project of an eligible applicant must be able to meet area eligibility requirements to be considered for funding under this Disaster Supplemental NOFO. Such eligibility is predicated upon the project being located in or primarily serving one or more communities impacted by Hurricanes Ian and Fiona, and of wildfires, flooding, and other natural disasters occurring in calendar years 2021 and 2022. More specifically, consistent with 13 C.F.R. parts 301 and 307, EDA will determine area eligibility pursuant to the applicable Federal disaster declaration under the Stafford Act, and the Federal Emergency Management Agency (FEMA) designation of areas as eligible for public assistance or individual assistance due to the declared disasters listed on FEMA’s website (www.fema.gov/disaster/). For construction projects (including design and engineering), the project must be located within an eligible county. For non-construction projects, the project’s scope of work must primarily benefit eligible counties, and stakeholders representing those eligible counties must be directly engaged in the project.","applicant_types":["county","higher_ed","municipality","nonprofit","tribe"],"categories":["other"],"alns":["11.307"],"listings":[{"aln":"11.307","name":"Economic Adjustment Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/347414","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":984,"slug":"fy-2025-eda-public-works-and-economic-adjustment-assistance-programs-grants-gov-346815","name":"FY 2025 EDA Public Works and Economic Adjustment Assistance Programs","number":"PWEAA2023","level":"federal","state":null,"agency":"Economic Development Administration","agency_code":"DOC-EDA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2023-03-14","closes_at":null,"closes_text":"There are no application submission deadlines. Applications will be accepted on an ongoing basis until the publication of a new PWEAA NOFO, cancellation of this PWEAA NOFO, or all available funds have been expended. EDA intends to review applications expeditiously upon receipt of the complete application.","rolling":null,"amount_min":100000,"amount_max":30000000,"match_required":true,"match_pct":null,"summary":"PLEASE FIND THE NOFO IN THE 'DOCUMENTS' SECTION OF THIS POST This opportunity has been updated as of May 11, 2026 ﻿Program Overview: EDA has authority to provide grants to meet the full range of communities’ and regions’ economic development needs from planning and technical assistance to construction of infrastructure. These grants are made through a series of Notices of Funding Opportunity (NOFOs) that can be found on EDA’s website at https://www.eda.gov/funding/funding-opportunities and are designed to support the economic development activities most useful to a community based on its needs and circumstances. EDA funds community or regionally generated ideas and assists communities to advance to the next level of economic development. This NOFO sets out EDA’s application submission and review procedures for two of EDA’s core economic development programs authorized under the Public Works and Economic Development Act of 1965, as amended (42 U.S.C. § 3121 et seq.) (PWEDA): (1) Public Works and Economic Development Facilities (Public Works) and (2) Economic Adjustment Assistance (EAA). EDA supports bottom-up strategies that build on regional assets to spur economic growth and resiliency. EDA encourages its grantees throughout the country to develop initiatives that present new ideas and creative approaches to advance economic prosperity in distressed communities. Through this NOFO EDA intends to advance general economic development in accordance with EDA’s investment priorities, which can be found on EDA's website here: Investment Priorities | U.S. Economic Development Administration","eligibility":"Pursuant to Section 3(4) of PWEDA (42 U.S.C. § 3122(4)(a)) and 13 C.F.R. § 300.3 (Eligible Recipient), eligible applicants for EDA financial assistance under the Public Works and EAA programs include a(n): (i) District Organization of an EDA-designated Economic Development District; (ii) Indian Tribe or a consortium of Indian Tribes; (iii) State, county, city, or other political subdivision of a State, including a special purpose unit of a State or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions; (iv) institution of higher education or a consortium of institutions of higher education; or (v) public or private non-profit organization or association acting in cooperation with officials of a political subdivision of a State. Individuals and for-profit entities are not eligible for funding under this NOFO.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["11.300","11.307"],"listings":[{"aln":"11.300","name":"Investments for Public Works and Economic Development Facilities"},{"aln":"11.307","name":"Economic Adjustment Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/346815","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":881,"slug":"gpd-grant-forecast-grants-gov-356629","name":"GPD Grant Forecast","number":"VA-GPD-FORECAST-FY2026-FY2028","level":"federal","state":null,"agency":"Homeless Providers Grant and Per Diem Program","agency_code":"VA-HPGPDP","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2024-10-03","closes_at":null,"closes_text":null,"rolling":null,"amount_min":null,"amount_max":null,"match_required":false,"match_pct":null,"summary":"THIS IS NOT A NOTICE OF FUNDING. THIS IS A GENERAL FORECAST ONLY. Grant and Per Diem (GPD) Program Introduction The GPD Program is VA’s largest transitional housing program for Veterans experiencing homelessness and is permanently authorized under Public Law 109-461. Since 1994, the GPD Program has awarded grants to community-based organizations to provide transitional housing with wraparound supportive services to assist vulnerable Veterans move into permanent housing. The grants are designed to meet Veterans at various stages as they move to stable housing. Community-based organizations receiving GPD grants offer focused transitional housing services through a variety of housing models targeted to different populations and needs of Veterans. The GPD program plays a vital role in the continuum of homeless services by providing supportive services to those Veterans who would otherwise be among the unsheltered homeless population. The result of GPD programs is that Veterans achieve residential stability, increase their skill levels and/or income, and obtain greater self-determination. Types of GPD Grants Transitional housing grants: Per Diem Only (PDO) grants provide funding in the form of per diem payments to reimburse grantees for the cost of care provided to Veterans in transitional supportive housing. Special Need grants target housing and services to specific populations of Veterans (e.g., women, Veterans with chronic mental illness, frail elderly Veterans, Veterans caring for minor dependents, terminally ill Veterans). Transition-In-Place (TIP) grants offer Veteran residents housing in which supportive services transition out of the residence over time, rather than the resident. Upon completion of the TIP services, the resident retains the unit as their permanent housing with no requirement to move. Other types of grants: Case Management grants support Veterans who were previously experiencing homelessness or who are at risk for homelessness so that they may obtain or retain permanent housing. Capital grants support the costs of acquiring, renovating, or constructing facilities and are only offered intermittently to improve existing facilities or to develop new transitional housing depending on VA's priorities and funding availability. Lists of current grantees are available on the GPD website. How to Apply for GPD Funding Not all grant types are available annually. When available, notices of funding can be found at the following locations: www.grants.gov and https://www.va.gov/homeless/gpd.asp. Application instructions are provided in each notice of funding. Each notice of funding will clarify specific eligibility criteria, application requirements, funding limitations, and other requirements. Applications are submitted through an online portal that is only available when there is an open notice of funding. Potential applicants who wish to see what was required for previous applications may review past notices of funding, available on the GPD provider website and www.grants.gov. Past notices of funding are not a guarantee of future requirements. Tentative Estimated GPD Award Schedule Specific dates are not able to be forecast. The follow tentative approximations are provided for general planning purposes. FY 2026 Case Management – GPD tentatively expects to offer a notice of funding around FY 2025 for case management awards starting approximately in FY 2026. FY 2027 PDO – GPD tentatively expects to offer a notice of funding around FY 2026 for PDO awards starting approximately in FY 2027. TIP – GPD tentatively expects to offer a notice of funding around FY 2026 for TIP awards starting approximately in FY 2027. FY 2028 GPD tentatively does not expect to offer a notice of funding for this timeframe. GPD may update this forecast closer to the time. THIS IS NOT A NOTICE OF FUNDING. THIS IS A GENERAL FORECAST ONLY.","eligibility":"THIS IS NOT A NOTICE OF FUNDING. THIS IS A GENERAL FORECAST ONLY.","
