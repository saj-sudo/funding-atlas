<head>

<style>
/* Funding Atlas: one stylesheet for the index and every state page. Inlined by scripts/build_site.py.
   Tokens on :root; dark mode by preference; print rules at the end. System fonts, no assets. */

:root {
  --bg: #faf9f6;
  --surface: #ffffff;
  --ink: #1c1b18;
  --muted: #5d5a53;
  --line: #e2dfd7;
  --soft: #f0eee8;
  --accent: #1d5bb8;
  --accent-ink: #ffffff;
  --accent-soft: #e6eefb;
  --likely: #1b6a3d;
  --likely-soft: #e3f2e8;
  --possible: #8a5500;
  --possible-soft: #fbf0d9;
  --closing: #b3261e;
  --closing-soft: #fde8e6;
  --open: #1b6a3d;
  --forecast: #6b4fbb;
  --shadow: 0 1px 2px rgba(28, 27, 24, .06), 0 8px 24px rgba(28, 27, 24, .08);
  --radius: 10px;
  --max: 1180px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15140f;
    --surface: #1e1d18;
    --ink: #ebe8df;
    --muted: #aaa598;
    --line: #35332c;
    --soft: #262520;
    --accent: #86aeff;
    --accent-ink: #0d1b33;
    --accent-soft: #1f2a40;
    --likely: #7fd09b;
    --likely-soft: #1b2e22;
    --possible: #f2c069;
    --possible-soft: #332a18;
    --closing: #ff8a80;
    --closing-soft: #3a1f1d;
    --open: #7fd09b;
    --forecast: #b9a6f2;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--accent); }
a:hover { text-decoration-thickness: 2px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { line-height: 1.2; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 1.1rem + 2vw, 2.4rem); font-weight: 750; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 650; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- skip link, top bar ---------- */
.skip { position: absolute; left: 16px; top: -60px; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 6px; z-index: 50; text-decoration: none; }
.skip:focus { top: 12px; }
.skip.inside { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip.inside:focus { position: static; width: auto; height: auto; overflow: visible; clip: auto; display: inline-block; margin: 0 0 10px; }
#results:focus { outline: none; }
.topbar { border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 20; }
.topbar .wrap { display: flex; align-items: center; gap: 14px; min-height: 56px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 750; text-decoration: none; color: var(--ink); letter-spacing: -.01em; }
.brand .mark { width: 26px; height: 26px; display: inline-grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.brand .mark i { display: block; background: var(--accent); border-radius: 2px; }
.brand .mark i:nth-child(2), .brand .mark i:nth-child(6), .brand .mark i:nth-child(7) { background: var(--likely); }
.brand .mark i:nth-child(4), .brand .mark i:nth-child(8) { background: var(--possible); opacity: .9; }
.topbar .spacer { flex: 1; }
.topbar label { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
.topbar select { padding: 6px 30px 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); max-width: 220px; }
.topbar .gen { font-size: .85rem; color: var(--muted); white-space: nowrap; }

/* ---------- hero ---------- */
.hero { padding: 28px 0 10px; }
.hero h1 { margin-bottom: 8px; }
.hero .lede { font-size: 1.05rem; max-width: 70ch; }
.coverage { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 14px; }
.coverage .cov { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: .9rem; }
.coverage .cov b { font-weight: 650; }
.coverage .cov.none { border-style: dashed; color: var(--muted); }

/* ---------- pulse tiles ---------- */
.pulse { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 20px 0 6px; }
.tile {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; display: grid; gap: 4px; box-shadow: none; transition: transform .12s ease, box-shadow .12s ease;
}
.tile:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.tile .k { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }
.tile .v { font-size: 2rem; font-weight: 750; line-height: 1.1; }
.tile .d { font-size: .85rem; color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.tile.new .v { color: var(--accent); }
.tile.closing .v { color: var(--closing); }
.tile.changed .v { color: var(--forecast); }
.tile:disabled { opacity: .6; cursor: default; transform: none; box-shadow: none; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 14px; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-weight: 650; color: var(--muted); margin-bottom: -1px; border-radius: 6px 6px 0 0; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { display: inline-block; min-width: 1.6em; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--soft); font-size: .8rem; font-weight: 650; color: var(--muted); }

/* ---------- toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; }
.search svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.search input { flex: 1; border: 0; background: none; padding: 10px 0; min-width: 0; }
.search input:focus { outline: none; }
.search:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.toolbar label.sort { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
.toolbar select { padding: 9px 30px 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 600; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { border-color: transparent; background: none; color: var(--accent); padding-left: 6px; padding-right: 6px; }
.btn .n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; font-size: .8rem; }
.count { font-weight: 650; margin-left: auto; white-space: nowrap; }

/* ---------- layout: facets + results ---------- */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.facets { position: sticky; top: 70px; max-height: calc(100vh - 86px); overflow: auto; padding-right: 4px; }
.facet { border-top: 1px solid var(--line); padding: 10px 0 12px; }
.facet:first-child { border-top: 0; padding-top: 0; }
.facet summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: 650; padding: 4px 0; }
.facet summary::-webkit-details-marker { display: none; }
.facet summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-right: 4px; }
.facet[open] summary::after { transform: rotate(-135deg); }
.facet ul { list-style: none; display: grid; gap: 2px; margin-top: 4px; }
.facet li label { display: flex; align-items: center; gap: 8px; padding: 4px 4px; border-radius: 6px; cursor: pointer; }
.facet li label:hover { background: var(--soft); }
.facet input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; flex: none; }
.facet .lbl { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.facet .cnt { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.facet li.zero label { color: var(--muted); opacity: .6; }
.facet li.zero label:hover { background: none; cursor: default; }
.facets .clear { margin-top: 10px; }
.filters-toggle { display: none; }

/* ---------- cards ---------- */
.results { display: grid; gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  display: grid; gap: 6px; position: relative; cursor: pointer; transition: box-shadow .12s ease, border-color .12s ease;
}
.card:hover { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--line), var(--muted) 30%); }
.card:focus-within { outline: 3px solid var(--accent); outline-offset: 1px; }
.card .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.card h3 { font-size: 1.05rem; }
.card h3 button { all: unset; cursor: pointer; color: var(--ink); text-wrap: pretty; }
.card h3 button:focus-visible { outline: none; }
.card .meta { color: var(--muted); font-size: .9rem; }
.card .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .92rem; margin-top: 2px; }
.card .facts span b { font-weight: 650; }
.card .facts .soon { color: var(--closing); font-weight: 650; }
.card .facts .k { color: var(--muted); }
.card .arrow { position: absolute; right: 14px; top: 14px; color: var(--muted); font-size: 1.1rem; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: .78rem; font-weight: 650; line-height: 1.5; letter-spacing: .01em; white-space: nowrap; }
.pill.tier-likely { background: var(--likely-soft); color: var(--likely); }
.pill.tier-possible { background: var(--possible-soft); color: var(--possible); }
.pill.st-open { color: var(--open); border: 1px solid currentColor; }
.pill.st-forecasted { color: var(--forecast); border: 1px solid currentColor; }
.pill.st-closed, .pill.st-paused, .pill.st-exhausted, .pill.st-unknown { color: var(--muted); border: 1px solid currentColor; }
.pill.new { background: var(--accent); color: var(--accent-ink); text-transform: uppercase; font-size: .7rem; letter-spacing: .06em; }
.pill.upd { background: var(--soft); color: var(--muted); text-transform: uppercase; font-size: .7rem; letter-spacing: .06em; }
.pill.lvl { background: var(--soft); color: var(--muted); }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; }
.chips li { font-size: .78rem; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }

.empty { padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---------- between rounds (closed or past-deadline state programs, collapsed by default) ---------- */
.between { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); }
.between h2 .n { display: inline-block; min-width: 1.6em; padding: 0 7px; margin-left: 8px; border-radius: 999px; background: var(--soft); font-size: .85rem; font-weight: 650; color: var(--muted); vertical-align: middle; }
.between .d { color: var(--muted); font-size: .92rem; max-width: 78ch; margin: 6px 0 12px; }
.between-list { display: grid; gap: 10px; margin-top: 14px; }
.card.between-card { border-style: dashed; }
.card .cycle { font-size: .9rem; background: var(--soft); padding: 8px 10px; border-radius: 8px; overflow-wrap: anywhere; }
.card .cycle .k { color: var(--muted); }
.empty b { color: var(--ink); }

/* ---------- changes feed ---------- */
.chipbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .9rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.feed { list-style: none; display: grid; gap: 18px; }
.feed .day h3 { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.feed .day ul { list-style: none; display: grid; gap: 2px; }
.feed li.ev { display: grid; grid-template-columns: 86px 1fr; gap: 10px; padding: 7px 6px; border-radius: 8px; align-items: baseline; }
.feed li.ev:hover { background: var(--soft); }
.feed .type { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.feed .type.added { color: var(--accent); }
.feed .type.changed { color: var(--possible); }
.feed .type.missing { color: var(--closing); }
.feed .what { color: var(--muted); font-size: .9rem; }
.feed .what b { color: var(--ink); font-weight: 600; }
.feed .name button { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.feed .name a { color: var(--accent); }
.feed .who { font-size: .85rem; color: var(--muted); }

/* ---------- detail dialog ---------- */
dialog.detail { border: 0; padding: 0; margin: 0; max-width: none; max-height: none; width: min(640px, 100vw); height: 100dvh; margin-left: auto; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
dialog.detail::backdrop { background: rgba(20, 18, 12, .45); }
dialog.detail .inner { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
dialog.detail header { display: flex; gap: 12px; align-items: flex-start; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
dialog.detail header h2 { font-size: 1.3rem; flex: 1; text-wrap: pretty; }
dialog.detail .close { flex: none; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 1.2rem; line-height: 1; display: grid; place-items: center; }
dialog.detail .body { overflow: auto; padding: 16px 20px 24px; display: grid; gap: 18px; align-content: start; }
dialog.detail .sect h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
dialog.detail .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; }
dialog.detail .facts div { display: grid; gap: 1px; }
dialog.detail .facts .k { font-size: .78rem; color: var(--muted); }
dialog.detail .facts .v { font-weight: 600; }
dialog.detail .facts .v.soon { color: var(--closing); }
dialog.detail .verbatim { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--soft); padding: 12px 14px; border-radius: 8px; font-size: .95rem; line-height: 1.55; max-height: 40vh; overflow: auto; }
dialog.detail .prose { line-height: 1.6; max-width: 65ch; overflow-wrap: anywhere; }
dialog.detail .list { list-style: none; display: grid; gap: 4px; }
dialog.detail .list li { display: flex; gap: 8px; flex-wrap: wrap; }
dialog.detail .list .aln { font-variant-numeric: tabular-nums; font-weight: 650; }
dialog.detail footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--surface); }
dialog.detail footer .src { flex: 1; min-width: 0; }
dialog.detail .copied { color: var(--likely); font-size: .85rem; }
dialog.detail .trail { font-size: .85rem; color: var(--muted); }

/* ---------- index: tile map ---------- */
.index-hero { padding: 36px 0 12px; }
.index-hero h1 { font-size: clamp(2rem, 1.4rem + 2.6vw, 3rem); max-width: 18ch; }
.index-hero .lede { font-size: 1.1rem; max-width: 62ch; margin-top: 12px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 22px 0 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; display: grid; gap: 2px; }
.stat .v { font-size: 1.8rem; font-weight: 750; line-height: 1.1; }
.stat .k { font-size: .85rem; color: var(--muted); }
.map-wrap { margin: 24px 0 8px; }
.map { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 5px; max-width: 760px; }
.map a.t { aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: clamp(.7rem, .55rem + .8vw, 1rem); color: var(--ink); background: var(--soft); border: 1px solid var(--line); transition: transform .1s ease, box-shadow .1s ease; }
.map a.t.src { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.map a.t:hover, .map a.t:focus-visible { transform: scale(1.08); box-shadow: var(--shadow); z-index: 2; }
.map a.t.src.open { box-shadow: inset 0 0 0 2px var(--accent-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: .9rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 1px solid var(--line); background: var(--soft); }
.legend i.src { background: var(--accent); border-color: var(--accent); }
.hover { margin-top: 12px; min-height: 2.6em; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.hover b { font-weight: 700; }
.goto { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.goto select { padding: 9px 30px 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 220px; }
.index-feed { margin-top: 36px; }
.index-feed h2 { margin-bottom: 12px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }

/* ---------- footer ---------- */
footer.site { margin-top: 48px; padding: 28px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: .92rem; }
footer.site .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
footer.site h2 { font-size: 1rem; color: var(--ink); margin-bottom: 8px; }
footer.site p + p { margin-top: 8px; }
footer.site ol { padding-left: 20px; display: grid; gap: 4px; }
footer.site b { color: var(--ink); }
.noscript { background: var(--possible-soft); color: var(--possible); padding: 12px 16px; border-radius: 8px; margin: 16px 0; }

/* ---------- phone ---------- */
@media (max-width: 899px) {
  .layout { grid-template-columns: 1fr; gap: 12px; }
  .facets { position: static; max-height: none; overflow: visible; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .facets[hidden] { display: none !important; }
  .filters-toggle { display: inline-flex; }
  .count { margin-left: 0; }
  .two { grid-template-columns: 1fr; }
  .topbar .gen { display: none; }
  .coverage .cov { border-radius: 10px; display: block; }
  dialog.detail { width: 100vw; }
  .feed li.ev { grid-template-columns: 1fr; gap: 2px; }
}
@media (max-width: 480px) {
  .tile .v { font-size: 1.6rem; }
  .card { padding: 12px 14px; }
  .card .arrow { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ---------- print ---------- */
@media print {
  :root { --bg: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #bbb; --soft: #f2f2f2; }
  .topbar, .pulse, .tabs, .toolbar, .facets, .filters-toggle, .skip, dialog, .chipbar, .arrow, .goto, .hover, #between-toggle { display: none !important; }
  .between-list[hidden] { display: grid !important; }
  .layout { grid-template-columns: 1fr; }
  .card { break-inside: avoid; box-shadow: none; }
  .card:focus-within { outline: none; }

rt, training, technical assistance, and information systems for criminal justice or civil proceedings, including for any one or more of the eleven program areas. Applicants should check the FY26 JAG allocations to determine if they are eligible to receive direct JAG funding from BJA prior to starting an application: https://bja.ojp.gov/program/jag/allocations.","eligibility":"Other units of local government","applicant_types":["county","municipality","special_district","tribe"],"categories":["public_safety"],"alns":["16.738"],"listings":[{"aln":"16.738","name":"Edward Byrne Memorial Justice Assistance Grant Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363712","tier":"likely","is_new":false,"is_updated":false,"days_to_close":4,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":170,"slug":"bja-fy26-dna-capacity-enhancement-for-backlog-reduction-cebr-competitive-grants--grants-gov-363924","name":"BJA FY26 DNA Capacity Enhancement for Backlog Reduction (CEBR)—Competitive Grants Program","number":"O-BJA-2026-172680","level":"federal","state":null,"agency":"Bureau of Justice Assistance","agency_code":"USDOJ-OJP-BJA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-09-23","closes_at":"2026-11-03","closes_text":null,"rolling":null,"amount_min":0,"amount_max":4900000,"match_required":false,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the BJA FY 2026 DNA Capacity Enhancement for Backlog Reduction (CEBR) — Competitive Grants Program. This opportunity will increase capacity of states and units of local government with existing crime laboratories to process DNA samples for entry into the Combined DNA Index System (CODIS). The purpose of the CEBR Competitive Program is to maximize the effective utilization of DNA technology to strengthen evidence-based crimina t":"Electronically submitted applications must be submitted no later than 11:59 PM, ET, on the listed application due date.","rolling":null,"amount_min":10000,"amount_max":50000,"match_required":false,"match_pct":null,"summary":"Goal: Encourage outdoor recreation and natural, historical, and cultural tourism that expands access to and awareness of the Chesapeake Bay watershed and fosters economic development of communities.ObjectivesNPS Chesapeake Gateways is offering this competitive grant opportunity to strengthen a community's ability to offer or enhance outdoor recreation and natural, historical, and cultural tourism that connects visitors and residents to the Chesapeake Bay watershed as detailed in the Chesapeake Bay Initiative Act of 1998.Through this grant opportunity, NPS Chesapeake Gateways will:Enhance outdoor recreation and natural, historical, and cultural tourism in the Chesapeake Bay watershed.Support projects that link outdoor and heritage tourism to economic impact.Celebrate gateway communities that welcome and invite locals and visitors to explore authentic Chesapeake Gateways Places and stories through outdoor recreation and natural, historical, and cultural experiences.Grant ThemeChesapeake Gateways is a network of places that provide opportunities to explore outdoor recreation and authentic natural, historical, and cultural experiences of the Chesapeake Bay watershed. Included in this network are diverse recreational, natural, cultural, historical, and recreational sites, trails, museums, parks, wildlife refuges, interpretive and orientation facilities, and associated programs. These places, and Chesapeake Gateways as a whole, serve as entry points and the key guide for experiencing the Chesapeake Bay watershed.","eligibility":"PLEASE NOTE: Projects that take place outside the watershed are not eligible for consideration. A link to all the counties in the watershed can be found in Appendix A. A full map can be found here.Chesapeake Gateways Network Requirement: The applicant must be a non-federal Chesapeake Gateways Network member (Place, Experience, Community, or Programmatic Partner). To become a Chesapeake Gateways Network member, prospective applicants need to submit a self-nomination through the Chesapeake Gateways Network portal: Join the Chesapeake Gateways Network - Chesapeake Bay Watershed (U.S. National Park Service). Foreign Entities or Projects: This program does not provide funding to foreign entities or for projects conducted outside the United States.Excluded Parties:NPS conducts a review of the SAM.gov Exclusions database for all applicant entities and their key project personnel prior to award. The NPS cannot award funds to entities or their key project personnel identified in the SAM.gov Exclusions database as ineligible, prohibited/restricted, or otherwise excluded from receiving Federal contracts, certain subcontracts, and certain Federal assistance and benefits, as their ineligibility condition applies to this Federal program.","applicant_types":["business","county","higher_ed","housing_authority","municipality","nonprofit","school","special_district","state","tribe"],"categories":["infrastructure"],"alns":["15.930"],"listings":[{"aln":"15.930","name":"Chesapeake Bay Gateways Network"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363728","tier":"likely","is_new":false,"is_updated":false,"days_to_close":5,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":357,"slug":"fy26-us-dot-drone-infrastructure-inspection-grants-diig-program-grants-gov-363242","name":"FY26 US DOT Drone Infrastructure Inspection Grants (DIIG) Program","number":"DOT-HASS-FY26-DIIG","level":"federal","state":null,"agency":"69A345 Office of the Under Secretary for Policy","agency_code":"DOT-DOT X-50","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-20","closes_at":"2026-11-15","closes_text":null,"rolling":null,"amount_min":500000,"amount_max":9000000,"match_required":true,"match_pct":null,"summary":"The Drone Infrastructure Inspection Grants (DIIG) Program will provide grants to eligible government entities to facilitate the use of small Unmanned Aircraft Systems (UAS), referred to herein as drones, in critical infrastructure inspection. The objective is to increase the widespread adoption of drones and relevant technologies in support of more efficient Inspection, Operation, Construction, Maintenance, and Repair (IOCMR) of critical infrastructure to improve worker safety related to critical infrastructure projects. The program is established by Section 912 of Public Law 118-63 and Public Law 119-75. Eligible uses of grant funds include purchasing, leasing, or enhancing drone systems; contracting for services when internal expertise is lacking in the government entities; and supporting program management for these systems and operations. The DIIG Program prioritizes projects that create and utilize innovative drone inspection technologies and systems, address inspection data management and data platform interoperability, and streamline inspection workflows and processes while accounting for the complexities inherent in multi-jurisdictional regions. Total available funds of $9,000,000 in the DIIG Program (Fiscal Year 2026) are to be awarded on a competitive basis. In selecting applications, the Department will prioritize projects carried out in a variety of communities and projects that address safety risks in the IOCMR of critical infrastructure. The Federal share of the total project cost may not exceed 50 percent. · A lead applicant may request an increase in the Federal share up to 75 percent. · A request for an increased Federal share must be submitted in writing as part of the application. · The request must demonstrate that additional Federal assistance is necessary to facilitate acceptance and full use of the grant, such as by alleviating economic hardship, meeting additional workforce needs, or other appropriate reasons determined by the Department. Applications from private companies, nonprofit organizations, institutions of higher education, and other non-governmental entities are not eligible unless such entities participate only as contractors, vendors, or other non-applicant partners to an eligible governmental entity.","eligibility":"An eligible applicant must be one of the following:•A State, the District of Columbia, the Commonwealth of Puerto Rico, a territory of the United States, or a political subdivision thereof.•A unit of local government.•A Tribal government.•A metropolitan planning organization.•A consortia of more than one of the entities listed above.","applicant_types":["county","municipality","state","tribe"],"categories":["infrastructure","other","public_safety","transportation","workforce"],"alns":["20.765"],"listings":[{"aln":"20.765","name":"Drone Infrastructure Inspection Grant (DIIG)"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363242","tier":"likely","is_new":false,"is_updated":false,"days_to_close":16,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":134,"slug":"fiscal-year-2026-wildlife-crossings-pilot-program-grants-gov-364009","name":"Fiscal Year 2026 Wildlife Crossings Pilot Program","number":"FHWA-WCPP-26-002","level":"federal","state":null,"agency":"DOT Federal Highway Administration","agency_code":"DOT-FHWA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-09-30","closes_at":"2026-11-16","closes_text":"No Explanation","rolling":null,"amount_min":0,"amount_max":80000000,"match_required":true,"match_pct":null,"summary":"The purpose of the WCPP is to provide funding to eligible entities for projects seeking to improve safety of the traveling public by reducing the number of wildlife-vehicle collisions (WVC) and, in doing so, improve habitat connectivity for terrestrial and aquatic species. This NOFO will award approximately $80 million in Fiscal Year (FY) 2026 funding via cost reimbursable grants. DOT may also award any remaining and available funds from previous fiscal years under this opportunity. The actual amount available to be awarded under this notice will be subject to the availability of funds. NOTE: The information under 'Award' on this page requires the specification of a minimum and maximum dollar value for anticipated awards due to Grants.gov system requirements. However, as stated in the NOFO, there are no minimum or maximum award sizes.","eligibility":"The purpose of the WCPP is to provide funding to eligible entities for projects seeking to improve safety of the traveling public by reducing the number of wildlife-vehicle collisions (WVC) and, in doing so, improve habitat connectivity for terrestrial and aquatic species. Eligible applicants under the WCPP are: • State Department of Transportation (State DOT); • Metropolitan planning organization (MPO); • Units of local government ; • A regional transportation authority; • A special purpose district or public authority with a transportation function; • Indian Tribes ; • A Federal Land Management Agency (FLMA); or • A group of any of the above entities. Projects eligible for funding include both construction and non-construction projects. However, DOT may prioritize awards to construction projects. WCPP requires a non-Federal cost share of 20 percent from all recipients unless an exception applies (see B.3, below). Applicants who do not provide the required non-Federal cost share will be classified as ineligible. FLMAs and Tribes can use other Federal funds for their match, such as those allowable under 23 United States Code (U.S.C.) 120(k). A minimum of 60 percent of funds each fiscal year must be awarded to rural areas (23 U.S.C. 171(g)).","applicant_types":["county","municipality","special_district","state","tribe"],"categories":["transportation"],"alns":["20.290"],"listings":[{"aln":"20.290","name":"Wildlife Crossings Pilot Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364009","tier":"likely","is_new":false,"is_updated":false,"days_to_close":17,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":103,"slug":"nij-fy-2026-evaluation-of-the-effectiveness-of-the-bureau-of-justice-assistance--grants-gov-364049","name":"NIJ FY 2026 Evaluation of the Effectiveness of the Bureau of Justice Assistance (BJA) Byrne State Crisis Intervention Program (SCIP)","number":"O-NIJ-2026-172798","level":"federal","state":null,"agency":"National Institute of Justice","agency_code":"USDOJ-OJP-NIJ","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-10-09","closes_at":"2026-11-16","closes_text":null,"rolling":null,"amount_min":0,"amount_max":5943493,"match_required":false,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the NIJ FY 2026 Evaluation of the Effectiveness of the Bureau of Justice Assistance (BJA) Byrne State Crisis Intervention Program (SCIP).1 This opportunity will support research and evaluation to assess the effectiveness of programs funded under FYs 2022-2026 BJA’s Byrne SCIP NOFOs. BJA’s Byrne SCIP provides funding for the creation or enhancement of state crisis intervention court proceedings and related programs or initiatives, including extreme risk protection order (ERPO) programs, as well as mental health courts, drug courts, and veterans treatment courts. Such programs or initiatives can include, but are not limited to: 1) Law enforcement crisis interventions; 2) Court-based programming; 3) Referrals to treatment for people in crisis; and 4) ERPO programs. Applicants may apply to assess multiple program areas where applicable. NIJ anticipates making at least one award per topic area for a total of 4 awards. Applicants should clearly state the program area(s) on the title page. This NOFO invites applications proposing a two-phased evaluation strategy to assess Byrne SCIP. The approach includes: • Phase I: Evaluability Assessments. • Phase II: An Evaluation of the Byrne SCIP’s Effectiveness. Applications to this NOFO should include both phases. Applications that do not meet this requirement would not be considered responsive to this funding opportunity.","eligibility":"Other Units of Local Government: For the purposes of this notice of funding opportunity, other units of local government include towns, boroughs, parishes, villages, or other general purpose political subdivisions of a state.","applicant_types":["business","county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["16.560"],"listings":[{"aln":"16.560","name":"National Institute of Justice Research, Evaluation, and Development Project Grants"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364049","tier":"likely","is_new":false,"is_updated":false,"days_to_close":17,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":113,"slug":"nij-fy-2026-research-and-evaluation-on-justice-system-responses-to-illegal-immig-grants-gov-364060","name":"NIJ FY 2026 Research and Evaluation on Justice System Responses to Illegal Immigration","number":"O-NIJ-2026-172800","level":"federal","state":null,"agency":"National Institute of Justice","agency_code":"USDOJ-OJP-NIJ","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-09","closes_at":"2026-11-16","closes_text":null,"rolling":null,"amount_min":0,"amount_max":3000000,"match_required":false,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the NIJ FY 2026 Research and Evaluation on Justice System Responses to Illegal Immigration. This opportunity supports proposals for rigorous, applied research and evaluations examining the adult criminal justice system (courts, law enforcement, jails, prisons, and community supervision) challenges and responses to illegal immigration and crimes committed by aliens while in the U.S. illegally at the state, local, and tribal levels. This includes, but is not limited to, location and apprehension, court operations, transportation and detention, investigating fraud and other crimes committed by illegal aliens, including creating an accurate profile of their rates of criminal activity, counter gang and criminal activity including drug and human trafficking operations. Criminal justice agencies often develop innovative solutions to local challenges that may provide insight to other jurisdictions. Applicants may propose studies examining single or multiple states and jurisdictions and models of cooperation between federal, state, local and tribal justice systems and other stakeholders. The goal of this NOFO is to identify innovative local strategies, evaluate their effectiveness, and inform practical, data-driven solutions that inform and strengthen the strategies that state, local, and tribal justice systems use to address illegal immigration.","eligibility":"Other Units of Local Government: For the purposes of this notice of funding opportunity, other units of local government include towns, boroughs, parishes, villages, or other general purpose political subdivisions of a state.","applicant_types":["business","county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["16.560"],"listings":[{"aln":"16.560","name":"National Institute of Justice Research, Evaluation, and Development Project Grants"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364060","tier":"likely","is_new":false,"is_updated":false,"days_to_close":17,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":123,"slug":"ojjdp-fy-2026-emergency-planning-for-juvenile-justice-residential-facilities-grants-gov-364035","name":"OJJDP FY 2026 Emergency Planning for Juvenile Justice Residential Facilities","number":"O-OJJDP-2026-172735","level":"federal","state":null,"agency":"Office of Juvenile Justice Delinquency Prevention","agency_code":"USDOJ-OJP-OJJDP","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-07","closes_at":"2026-11-16","closes_text":null,"rolling":null,"amount_min":0,"amount_max":250000,"match_required":false,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the OJJDP FY 2026 Emergency Planning for Juvenile Justice Residential Facilities program. This opportunity will support the development, improvement, and/or implementation of emergency planning activities for state, Tribal, county, and local juvenile justice residential facilities. Emergency planning activities should prepare facilities to prioritize the safety and well-being of youth and staff, keep families informed, continue operations, and reduce risk to the facility during and after an emergency. The goal of the program is to help facilities improve their ability to respond to and recover from these incidents. For the purposes of this program, emergency is defined as an incident—natural, technological, or nonnatural—that requires a response to protect life and property.","eligibility":null,"applicant_types":["county","municipality","special_district","state","tribe"],"categories":["public_safety"],"alns":["16.823"],"listings":[{"aln":"16.823","name":"Emergency Planning for Juvenile Justice Facilities"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364035","tier":"likely","is_new":false,"is_updated":false,"days_to_close":17,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":118,"slug":"ojjdp-fy-2026-expanding-youth-access-to-community-based-treatment-grants-gov-364040","name":"OJJDP FY 2026 Expanding Youth Access to Community-Based Treatment","number":"O-OJJDP-2026-172737","level":"federal","state":null,"agency":"Office of Juvenile Justice Delinquency Prevention","agency_code":"USDOJ-OJP-OJJDP","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-08","closes_at":"2026-11-16","closes_text":null,"rolling":null,"amount_min":0,"amount_max":650000,"match_required":false,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the OJJDP FY 2026 Expanding Youth Access to Community-Based Treatment program. This opportunity will fund community-based treatment programs serving youth with substance use disorders (SUD) and co-occurring mental health and substance use disorders (MHSUD). Selected community-based programs will develop or expand cross-system approaches to improve responses and outcomes for youth with SUDs and MHSUDs who are at risk of or have already been in the juvenile justice system by increasing access to community-based treatment, as appropriate, to address their substance use and mental health needs to prevent reoffending and recidivism.","eligibility":null,"applicant_types":["county","municipality","nonprofit","state","tribe"],"categories":["public_safety"],"alns":["16.838"],"listings":[{"aln":"16.838","name":"Comprehensive Opioid, Stimulant, and Substance Use Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364040","tier":"likely","is_new":false,"is_updated":false,"days_to_close":17,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":119,"slug":"ojjdp-fy-2026-family-treatment-court-program-grants-gov-364041","name":"OJJDP FY 2026 Family Treatment Court Program","number":"O-OJJDP-2026-172738","level":"federal","state":null,"agency":"Office of Juvenile Justice Delinquency Prevention","agency_code":"USDOJ-OJP-OJJDP","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-08","closes_at":"2026-11-16","closes_text":null,"rolling":null,"amount_min":0,"amount_max":850000,"match_required":true,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the OJJDP FY 2026 Family Treatment Court Program. This opportunity will support state and local courts, units of local government, and federally recognized Tribal governments to establish new, or enhance existing, family treatment courts to ensure the provision of substance use treatment and other services that improve child, parent, and family outcomes. Family treatment courts serve parents who require treatment for a substance use disorder and who encounter and are engaged with the child welfare system because of child abuse, neglect, or other parenting issues. Family treatment courts provide intensive judicial monitoring and interventions to treat parents’ substance use and/or co-occurring mental health disorders.","eligibility":null,"applicant_types":["county","municipality","state","tribe"],"categories":["public_safety"],"alns":["16.838"],"listings":[{"aln":"16.838","name":"Comprehensive Opioid, Stimulant, and Substance Use Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364041","tier":"likely","is_new":false,"is_updated":false,"days_to_close":17,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":106,"slug":"ojjdp-fy-2026-mentoring-for-youth-impacted-by-opioids-and-other-substance-use-grants-gov-364058","name":"OJJDP FY 2026 Mentoring for Youth Impacted by Opioids and Other Substance Use","number":"O-OJJDP-2026-172743","level":"federal","state":null,"agency":"Office of Juvenile Justice Delinquency Prevention","agency_code":"USDOJ-OJP-OJJDP","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-09","closes_at":"2026-11-16","closes_text":null,"rolling":null,"amount_min":0,"amount_max":2000000,"match_required":false,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the OJJDP FY 2026 Mentoring for Youth Impacted by Opioids and Other Substance Use program. This opportunity supports the implementation and delivery of high-quality mentoring services for youth who are currently using or dependent on substances, as well as youth at risk of substance use or who have close family members experiencing substance use or dependency. Mentoring services may include one-on-one, group, or peer mentoring—or a combination of these approaches or hybrid (traditional in-person combined with virtual mentoring).","eligibility":"Units of local government; National organizations; Organizations having statewide reach that provide mentoring services","applicant_types":["county","higher_ed","municipality","nonprofit","school","state","tribe"],"categories":["public_safety"],"alns":["16.726"],"listings":[{"aln":"16.726","name":"Juvenile Mentoring Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364058","tier":"likely","is_new":false,"is_updated":false,"days_to_close":17,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":107,"slug":"ojjdp-fy-2026-opioid-affected-youth-initiative-grants-gov-364057","name":"OJJDP FY 2026 Opioid Affected Youth Initiative","number":"O-OJJDP-2026-172748","level":"federal","state":null,"agency":"Office of Juvenile Justice Delinquency Prevention","agency_code":"USDOJ-OJP-OJJDP","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-09","closes_at":"2026-11-16","closes_text":null,"rolling":null,"amount_min":0,"amount_max":750000,"match_required":false,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the OJJDP FY 2026 Opioid Affected Youth Initiative. This NOFO supports states, localities, Tribal jurisdictions, and non-profit organizations in addressing violent crime and reducing overdose deaths through prevention, intervention, and treatment strategies to support children, youth, and families affected by opioid, stimulant, and other substance use disorders. Applicants are expected to collaborate with law enforcement, juvenile and criminal justice agencies, schools, mental health and child welfare providers, community health agencies, and community-based organizations to address the needs of children, youth, and families who are at risk for or already in the child welfare or justice systems.","eligibility":"Other units of local government","applicant_types":["county","municipality","nonprofit","state","tribe"],"categories":["public_safety"],"alns":["16.842"],"listings":[{"aln":"16.842","name":"Opioid Affected Youth Initiative"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364057","tier":"likely","is_new":false,"is_updated":false,"days_to_close":17,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":105,"slug":"ojjdp-fy-2026-strategies-to-support-children-exposed-to-violence-grants-gov-364056","name":"OJJDP FY 2026 Strategies to Support Children Exposed to Violence","number":"O-OJJDP-2026-172752","level":"federal","state":null,"agency":"Office of Juvenile Justice Delinquency Prevention","agency_code":"USDOJ-OJP-OJJDP","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-09","closes_at":"2026-11-16","closes_text":null,"rolling":null,"amount_min":0,"amount_max":815000,"match_required":false,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the OJJDP FY 2026 Strategies to Support Children Exposed to Violence. This opportunity will support the implementation of violent crime reduction strategies focused on violent juvenile offenders and improving communities' ability to help children exposed to violence in their homes, schools, and communities. Through this program the incidence and impact of violence will be reduced by strengthening local efforts to address victimization of children exposed to violence and mitigate the risk of adverse long-term effects and negative outcomes associated with children's exposure to violence.","eligibility":"Units of local government","applicant_types":["county","higher_ed","municipality","nonprofit","school","special_district","state","tribe"],"categories":["public_safety"],"alns":["16.818"],"listings":[{"aln":"16.818","name":"Children Exposed to Violence"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364056","tier":"likely","is_new":false,"is_updated":false,"days_to_close":17,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":143,"slug":"easement-restoration-and-stewardship-grants-gov-363920","name":"Easement Restoration and Stewardship","number":"USDA-NHQ-ACEP-26-NOFO0001456","level":"federal","state":null,"agency":"Natural Resources Conservation Service","agency_code":"USDA-NRCS","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-09-25","closes_at":"2026-11-19","closes_text":"Applications must be received by 11:59 pm Eastern Time.","rolling":null,"amount_min":250000,"amount_max":5000000,"match_required":false,"match_pct":null,"summary":"The opportunities associated with this NOFO are for lands protected through the Wetland Reserve Easements (WRE) component of the Agricultural Conservation Easement Program (ACEP) and the Floodplain Easement (FPE) component of the Emergency Watershed Protection Program (EWPP). The types of work available through this opportunity fall into three primary categories: 1) restoration of wetland and floodplain easements; 2) stewardship of wetland and floodplain easements, and 3) onsite and offsite assessment of easement conditions. Component 1) Wetland and Floodplain Easement Restoration. Awardees will work with NRCS personnel, partners and landowners to develop and implement sound easement restoration plans. These plans may include structural practices, such as levees and water control structures, and/or vegetative establishment practices, such as tree planting. Awardees are expected to complete the following easement restoration activities: (A) Coordination- Accept input on restoration planning from NRCS employees, NRCS partners and easement owners. (B) Investigation- Completion of technical surveys such as topographic, hydrological or habitat inventories. (C) Restoration Design- Combine data collected through coordination and technical surveys to develop functional, yet cost-effective restoration plans. (D) Implementation- Application of the easement restoration design using NRCS provided practice standards and specifications. NRCS wetland and floodplain easements have varying levels of restoration planning completed by NRCS employees or partners. Awardees will receive all relevant planning information for easements included in this agreement. Awardee must be prepared to complete some or all the listed restoration activities. Component 2) Wetland and Floodplain Easement Stewardship. Awardees are responsible for completing easement stewardship activities on restored wetland and floodplain easements. Easement stewardship includes repair, maintenance, management, and enhancement of properties. (A) Repair and Enhancement- Awardee will develop repair or enhancement plans. Repair plans will be prepared when installed conservation practices fail or are damaged. Repairs may include structural and/or vegetative restoration practices, such as a dike damaged by flooding or replanting trees damaged or killed by drought. Enhancement plans are developed to improve specific aspects of a restored easement. (B) Maintenance and Management- Awardee will develop easement maintenance and management plans. These plans identify specific activities that will prolong life and improve the function of installed restoration practices. For example, maintenance plans describe how and when an earthen dike should be mowed to prevent the establishment of woody vegetation. Component 3) Easement Assessments. The Awardee will complete onsite and offsite easement assessments. Assessments will document the habitat condition of easements and determine their compliance with deed terms and conditions. Awardees will use the data collected to determine the ecological condition of easements and, if necessary, develop repair, enhancement and/or maintenance plans to improve the condition of the assessed easements.","eligibility":null,"applicant_types":["business","county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other","parks","water"],"alns":["10.072","10.928","10.931"],"listings":[{"aln":"10.072","name":"Wetlands Reserve Program"},{"aln":"10.928","name":"Emergency Watershed Protection Program - Floodplain Easements – Disaster Relief Appropriations Act"},{"aln":"10.931","name":"Agricultural Conservation Easement Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/363920","tier":"likely","is_new":false,"is_updated":false,"days_to_close":20,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":122,"slug":"bja-fy-2026-justice-reinvestment-initiative-strengthening-state-and-local-operat-grants-gov-364037","name":"BJA FY 2026 Justice Reinvestment Initiative: Strengthening State and Local Operations to Reduce Crime and Recidivism","number":"O-BJA-2026-172770","level":"federal","state":null,"agency":"Bureau of Justice Assistance","agency_code":"USDOJ-OJP-BJA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-07","closes_at":"2026-11-20","closes_text":null,"rolling":null,"amount_min":0,"amount_max":4000000,"match_required":false,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the BJA FY 2026 Justice Reinvestment Initiative: Strengthening State and Local Operations to Reduce Crime and Recidivism. This opportunity will support state, local, and tribal government efforts to reduce wasteful spending and inefficient uses of funds across justice system operations and redirect that funding to target crime and other public safety and/or justice system challenges. Applicants should propose projects that address one or more urgent local justice system challenge. Applicants should use existing data and information to identify the specific challenges they will focus on and how they will refocus resources on the strategies and populations most likely to reduce crime. Jurisdictions may consider addressing challenges across the judicial system, including those related to law enforcement, prosecution, sentencing, jails and prisons, probation, and parole.","eligibility":"Other units of local government: For the purposes of this notice of funding opportunity, other units of local government include towns, boroughs, parishes, villages, or other general purpose political subdivisions of a state.","applicant_types":["county","municipality","special_district","state","tribe"],"categories":["public_safety"],"alns":["16.827"],"listings":[{"aln":"16.827","name":"Justice Reinvestment Initiative"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"http ice","agency_code":"DOI-FWS","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-09-29","closes_at":"2026-11-30","closes_text":"Electronically submitted applications must be submitted no later than 11:59 PM., ET, on the listed application due date.","rolling":null,"amount_min":0,"amount_max":150000,"match_required":true,"match_pct":null,"summary":"The John H. Prescott Marine Mammal Rescue and Response Grant Program (Prescott program) provides financial assistance to eligible marine mammal stranding participants and stranding network collaborators to provide (A) the recovery, care, or treatment of sick, injured, or entangled marine mammals; (B) responses to marine mammal stranding events that require emergency assistance; (C) the collection of data and samples from living or dead stranded marine mammals for scientific research or assessments regarding marine mammal health; (D) facility operating costs that are directly related to activities described in (A), (B), or (C); and (E) development of stranding network capacity, including training for emergency response, where facilities do not exist or are sparse. Successful applications will be those aimed at helping support these actions. The U.S. Fish and Wildlife Service’s (FWS) Prescott Grant Program will provide support for response to the stranding of wild populations of species under the Department of the Interior’s management authority per section 3(12) of the Marine Mammal Protection Act (MMPA). Under this Funding Opportunity, FWS will recommend projects for funding based on how well and to what extent they support the species-specific priority activities, which are listed below under Species-Specific Funding Priorities. For the purposes of this program, priority is to be given to applications focusing on marine mammal strandings.","eligibility":"Eligible applicants must be a U.S. eligible marine mammal stranding participant or stranding network collaborator that is not an employee of the Department of the Interior or Department of Commerce. The term \"eligible marine mammal stranding participant\" means a person who is authorized by the FWS under MMPA section 104(c) for response to injured or distressed marine mammals or for scientific research regarding marine mammal health, or under MMPA section 112(c) to take marine mammals as described in MMPA section 109(h) in response to a stranding. Eligible entities also include Federal, state, or local government employees operating in the course of their official duties as indicated under MMPA section 109(h). Applicants may reach out to the FWS for technical assistance to clarify and/or document applicability of the exemption under MMPA section 109(h). For marine mammals that are listed under the Endangered Species Act (ESA), eligibility includes authorization under ESA section 10(a)(1)(A) (except for polar bears as long as authorization has been provided under the MMPA), or exemptions to take prohibitions under 50 CFR 17.21 or 50 CFR 17.31. Applicants may be eligible without the MMPA or ESA authorizations detailed above depending on the nature of the project (see 1. f. below).Specifically, applicants must satisfy either #1 or #2 below1.A participant in a marine mammal stranding network (which is not an entity of a state, local, or eligible federal government employee) and in good standing. To be in good standing means:The applicant is authorized by the FWS under MMPA section 104(c) for response to injured or distressed marine mammals or for scientific research regarding marine mammal health, or under MMPA section 112(c) to take marine mammals as described in MMPA section 109(h) in response to stranded marine mammals (live or dead animal response). For marine mammals, other than polar bears, that are listed under the ESA, the applicant also has authorization under ESA section 10(a)(1)(A) or is otherwise exempt through 50 CFR 17.21 or 50 CFR 17.31.All the Principal Investigators associated with the Prescott Grant Program application who hold or have held authorizations under the MMPA and, if listed, the ESA have fulfilled all applicable requirements, including but not limited to, reports and publications and have fulfilled the terms of any enforcement actions. Noncompliance with MMPA/ESA permit or MMPA cooperative agreement actions will be considered on a case-by-case basis in terms of meeting this requirement.All stranding participants have complied with the terms and conditions of any permit or cooperative agreement issued under the MMPA and, if listed, ESA.The responsible stranding participant cooperates with the FWS regarding the timely submission of data and materials collected, when requested.The stranding participant is not under current enforcement investigation for activities involving the take of marine mammals contrary to MMPA and ESA regulations and do not have a notice of violation pending resolution.If no take will occur from the actions (e.g., strictly training, education, outreach), and therefore authorization is not required under the MMPA and/or ESA (if listed), the applicant must clearly state why take will not occur.Or,2. The entity is a state, local, or eligible federal government employee (but not an employee of the Department of the Interior or Department of Commerce) participating pursuant to MMPA section 109(h) (16 U.S.C. 1379(h)) and, if listed, exempt by 50 CFR 17.21 or 17.31.Unsatisfactory performance under prior or current Federal awards may result in your application not being considered for funding for this fiscal year in this program. FWS evaluates the risk posed by applicants as required in 2 CFR 200.205.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["parks"],"alns":["15.683"],"listings":[{"aln":"15.683","name":"Prescott Marine Mammal Rescue Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363992","tier":"likely","is_new":false,"is_updated":false,"days_to_close":31,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4468,"slug":"nij-fy-2026-research-and-evaluation-on-drones-as-first-responders-grants-gov-364139","name":"NIJ FY 2026 Research and Evaluation on Drones as First Responders","number":"O-NIJ-2026-172805","level":"federal","state":null,"agency":"National Institute of Justice","agency_code":"USDOJ-OJP-NIJ","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-22","closes_at":"2026-11-30","closes_text":null,"rolling":null,"amount_min":0,"amount_max":3500000,"match_required":false,"match_pct":null,"summary":"This is a notice of funding opportunity (NOFO) for the NIJ FY 2026 Research and Evaluation on Drones as First Responders. This opportunity seeks proposals for rigorous evaluations of implementations of drone technology to combat violent crime, immigration enforcement, and other law enforcement activities. The goal of this NOFO is to provide actionable information about police implementation of small drones through a collaboration between law enforcement agencies and researchers. NIJ welcomes research and evaluation of drones as first responders (DFR) capabilities, including evaluation of existing capabilities or pilot programs at police departments already using DFR, as well as implementation of new pilot programs or demonstrations. NIJ expects research entities and law enforcement agencies to collaborate on implementing DFR and evaluating operational performance. Law enforcement agencies participating in evaluations will have the option to retain any DFR technology purchased through the NOFO at the study’s conclusion.","eligibility":"Other Units of Local Government","applicant_types":["business","county","higher_ed","housing_authority","municipality","nonprofit","school","special_district","state","tribe"],"categories":["other"],"alns":["16.560"],"listings":[{"aln":"16.560","name":"National Institute of Justice Research, Evaluation, and Development Project Grants"}],"first_seen":"2026-10-23T14:26:14Z","last_changed":"2026-10-23T14:26:14Z","source_url":"https://www.grants.gov/search-results-detail/364139","tier":"likely","is_new":true,"is_updated":false,"days_to_close":31,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":215,"slug":"accelerating-scale-up-and-pre-piloting-of-emerging-chemical-technologies-aspect-grants-gov-363815","name":"Accelerating Scale-up and Pre-piloting of Emerging Chemical Technologies (ASPECT)","number":"DE-FOA-0003647","level":"federal","state":null,"agency":"Golden Field Office","agency_code":"DOE-GFO","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-09-04","closes_at":"2026-12-01","closes_text":null,"rolling":null,"amount_min":2000000,"amount_max":20000000,"match_required":true,"match_pct":null,"summary":"Modification 000002: Updated Appendix A and the definition of “Construction and demolition waste”, also denoted as “C&D Waste”, to align with the programmatic authorizing statute for the Alternative Fuels and Feedstocks Office listed in NOFO Part 1, Section III.G. Statutory Authority. • “Construction and demolition waste,” for the purposes of this NOFO and consistent with the statutory authorities1, refers to waste organic materials from buildings, roads and bridges, and other sectors, but not included in municipal solid waste. It includes wood waste materials, including waste pallets, crates, dunnage, manufacturing and construction wood wastes (other than pressure-treated, chemically-treated, or painted wood wastes), and landscape or right-of-way tree trimmings. Updated Section III.D. Key Requirements and Section III.F. Applications Specifically Not of Interest to specify that target chemicals should have global annual markets or potential markets of at least 1 million metric tons. • Previously this metric was given as U.S. production of at least 1 million metric tons. Modification 000001: Moved the application content requirement for Letter(s) of Commitment (LOCs) from Stage 2 to Stage 1. • Added a clause in Section III.D indicating that LOCs are to be submitted with Stage 1 applications. • Updated the summary table in Section IV.D.2 to reflect the above (added Stage 1 LOC requirement) • Updated the summary table in Section IV.E.1 to reflect the above (added “(as needed, in addition to Stage 1 submittals)”). DOE CMEI is dedicated to securing America’s energy future by reinforcing domestic critical mineral supply chains, driving next-generation energy technology and manufacturing research, and promoting affordable, consumer-friendly solutions. CMEI’s AFFO is issuing this ASPECT NOFO, DE-FOA-0003647, to support research, development, and pre-pilot testing of innovative technologies that produce chemicals from alternative and waste feedstocks, mobilizing America’s abundant alternative feedstocks resources. The goal of this Notice of Funding Opportunity (NOFO) is to advance promising chemical technologies that utilize alternative feedstocks through multiple levels of maturity and, in some cases, to pre-pilot scale. To accomplish this, the NOFO is divided into two topic areas, each divided into two subtopic areas designed to provide different on-ramps for technologies at different stages of development. Topic Area 1 supports the progression of technologies in the R&D phase. Subtopic Area 1a supports advancing early-stage research to bench scale. Subtopic Area 1b is intended to move projects closer to pre-pilot scale, to a point where critical unit operations must be further developed and demonstrated. Topic Area 2 provides an on-ramp for technologies ready to move from R&D to full pre-pilot scale and operations. Projects applying to Topic Area 2 should aim to advance their technology to design, construct, and operate pre-pilot scale facilities. Both subtopic areas have the same goal—to move technologies into integrated pre-pilot systems and operate them—but allow for two different points of entry. Subtopic Area 2a targets preliminary pre-pilot scale testing of critical unit operations before engineering and design can commence for the entire system while Subtopic Area 2b projects will involve technologies that are ready for design and construction of an integrated pre-pilot facility. Please see the full NOFO document at eere-exchange.energy.gov. Questions regarding the NOFO must be submitted to ASPECT@doe.gov. The required Concept Paper due date for this NOFO is 10/09/2026 at 5PM ET. The Full Application due date for this NOFO is 12/01/2026 at 5PM ET. As stated in the Notice of Intent (search DE-FOA-0003646 in eXCHANGE), a Teaming Partner List has been compiled to encourage collaboration and facilitate the formation of new project teams. Visit: TPL-0000073 Teaming Partner List for DE-FOA-0003646 NOI to Publish DE-FOA-0003647 The eXCHANGE system is currently designed to enforce hard deadlines for Concept Paper and Full Application submissions. The APPLY and SUBMIT buttons automatically disable at the defined submission deadlines. The intention of this design is to consistently enforce a standard deadline for all applicants. Applicants that experience issues with submissions PRIOR to the NOFO Deadline: In the event that an Applicant experiences technical difficulties with a submission, the Applicant should contact the eXCHANGE helpdesk for assistance (exchangehelp@hq.doe.gov). The eXCHANGE helpdesk and/or the EERE eXCHANGE System Administrators (eXCHANGE@ee.doe.gov) will assist the Applicant in resolving all issues. Applicants that experience issues with submissions that result in a late submission: In the event that an Applicant experiences technical difficulties with a submission that results in a late submission, the Applicant should contact the eXCHANGE helpdesk for assistance (exchangehelp@hq.doe.gov). The eXCHANGE helpdesk and/or the EERE eXCHANGE System Administrators (eXCHANGE@ee.doe.gov) will assist the Applicant in resolving all issues (including finalizing the submission on behalf of, and with the Applicant's concurrence). DOE will only accept late applications when the Applicant has a) encountered technical difficulties beyond their control; b) has contacted the eXCHANGE helpdesk for assistance; and c) has submitted the application through eXCHANGE within 24 hours of the NOFO's posted deadline.","eligibility":"As one of the main goals of this NOFO is to move technologies quickly to market, participation of the following entities is limited as follows: Institutions of higher education are eligible to participate as a recipient or subrecipient for Topic Area 1 but are only eligible to participate as a subrecipient for Topic Area 2. Provided there is no conflict of interest, DOE FFRDCs3 are eligible to apply for funding as subrecipients but are not eligible to apply as recipients. Non-DOE FFRDCs are eligible to participate as subrecipients but are not eligible to apply as recipients. Federal agencies and instrumentalities (other than DOE) are eligible to participate as subrecipients but are not eligible to apply as recipients. The National Energy Technology Laboratory (NETL) is eligible to apply as a subrecipient, not as prime recipient.","applicant_types":["business","county","higher_ed","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe"],"categories":["energy"],"alns":["81.087"],"listings":[{"aln":"81.087","name":"Renewable Energy Research and Development"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363815","tier":"likely","is_new":false,"is_updated":false,"days_to_close":32,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null  opportunity (NOFO) for the BJA FY 2026 Postconviction Testing of DNA Evidence program. This opportunity will assist states and units of local government in defraying the costs associated with postconviction case review, evidence location, and DNA testing in violent felony cases (as defined by state law) where the results of such testing might show actual innocence.","eligibility":"Other Units of Local Government: For the purposes of this notice of funding opportunity, other units of local government include towns, boroughs, parishes, villages, or other general purpose political subdivisions of a state.","applicant_types":["county","higher_ed","municipality","special_district","state"],"categories":["public_safety"],"alns":["16.820"],"listings":[{"aln":"16.820","name":"Postconviction Testing of DNA Evidence"}],"first_seen":"2026-10-28T16:13:19Z","last_changed":"2026-10-28T16:13:19Z","source_url":"https://www.grants.gov/search-results-detail/364163","tier":"likely","is_new":true,"is_updated":false,"days_to_close":39,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":354,"slug":"great-lakes-restoration-initiative-community-forest-and-open-space-conservation--grants-gov-361418","name":"Great Lakes Restoration Initiative: Community Forest and Open Space Conservation Program","number":"USDA-FS-2026-GLRI-CFP","level":"federal","state":null,"agency":"Forest Service","agency_code":"USDA-FS","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-07-22","closes_at":"2026-12-08","closes_text":"11:59PM Eastern Time","rolling":null,"amount_min":null,"amount_max":1000000,"match_required":true,"match_pct":null,"summary":"Federally recognized Indian Tribes, local government entities, and nonprofit organizations that are qualified to acquire and manage land may apply for up to $1,000,000 for the fee simple acquisition of private forest land in portions of the Lake Superior Basin of Michigan and Wisconsin. Projects submitted for funding consideration must be forested properties at least five acres in size that are threatened by conversion to non-forest uses and that provide community benefits including economic, environmental, educational, and recreational benefits. An additional focus of this opportunity is to protect, enhance and increase resilience of habitats necessary for sustaining native aquatic and terrestrial species important to the Lake Superior ecosystem. Competitive proposals will be those that demonstrate exceptional public benefits, meaningful community engagement, and strategic contributions to terrestrial habitat connectivity within the defined Terrestrial Habitat Connectivity Pilot Area. For additional information and requirements, please refer to the Notice of Funding Opportunity document linked in both the \"Related Documents\" tab and the \"Instructions\" link located in the \"Package\" tab.","eligibility":null,"applicant_types":["county","municipality","nonprofit","tribe"],"categories":["infrastructure","other","parks","water"],"alns":["10.689"],"listings":[{"aln":"10.689","name":"Community Forest and Open Space Conservation Program (CFP)"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/361418","tier":"likely","is_new":false,"is_updated":false,"days_to_close":39,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":6816,"slug":"fy-2027-crash-causal-factors-program-grants-gov-364171","name":"FY 2027 Crash Causal Factors Program","number":"FM-CCFP-27-001","level":"federal","state":null,"agency":"DOT-Federal Motor Carrier Safety Administration","agency_code":"DOT-FMCSA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-10-29","closes_at":"2026-12-28","closes_text":"No Explanation","rolling":null,"amount_min":25000,"amount_max":500000,"match_required":false,"match_pct":null,"summary":"The CCFP Cooperative Agreement Program will provide supplemental funding to eligible State and local law enforcement agencies to support the collection of advanced crash data to inform the Heavy-Duty Truck Study. FMCSA anticipates Congress, State and local law enforcement, industry stakeholders, and advocacy groups to support this action, as the results of the Heavy-Duty Truck Study will provide an unprecedented amount of detailed crash data to inform safety management decisions and drive the development of crash countermeasures. The CCFP will carry out a series of peer-reviewed studies that focus on specific vehicle types and crash severities, starting with the Heavy-Duty Truck Study, which is focusing on fatal crashes involving Class 7/8 trucks.","eligibility":null,"applicant_types":["county","municipality","special_district","state"],"categories":["transportation"],"alns":["20.246"],"listings":[{"aln":"20.246","name":"Crash Causal Factors Grant Program"}],"first_seen":"2026-10-29T16:10:32Z","last_changed":"2026-10-29T16:10:32Z","source_url":"https://www.grants.gov/search-results-detail/364171","tier":"likely","is_new":true,"is_updated":false,"days_to_close":59,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":922,"slug":"fiscal-year-2024-flood-mitigation-assistance-swift-current-grants-gov-354620","name":"Fiscal Year 2024 Flood Mitigation Assistance Swift Current","number":"DHS-24-MT-144-000-99","level":"federal","state":null,"agency":"Department of Homeland Security - FEMA","agency_code":"DHS-DHS","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2024-05-30","closes_at":"2026-12-30","closes_text":null,"rolling":null,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"FY 2024 FMA Swift Current aims to better align the delivery of FMA flood mitigation funding to the disaster survivor experience. The FMA grant program
