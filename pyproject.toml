[project]
name = "funding-atlas"
version = "0.1.0"
description = "Jurisdiction-indexed registry of public funding programs with change detection."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import order, B: common bugs, UP: modern syntax.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]   # line length is advisory; SQL strings and URLs run long on purpose
