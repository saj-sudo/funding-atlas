[project]
name = "funding-atlas"
version = "0.1.0"
description = "Jurisdiction-indexed registry of public funding programs with change detection."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
