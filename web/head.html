<!-- The head every page shares (2026-11-26); filled into each template's {{HEAD}} slot by scripts/build_site.py. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<link rel="icon" href="{{ICON}}">
<link rel="canonical" href="{{URL}}">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Funding Atlas">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{SHARE_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Funding Atlas: open public funding for local governments, by state.">
<meta name="twitter:card" content="summary_large_image">
<script>try { var t = localStorage.getItem('fa-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="alternate" type="application/atom+xml" title="{{FEED_TITLE}}" href="{{FEED}}">
<link rel="preload" as="font" type="font/woff2" crossorigin href="{{ROOT}}fonts/public-sans-latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="{{ROOT}}fonts/source-serif-4-latin.woff2">
<link rel="stylesheet" href="{{ROOT}}app.css?v={{ASSETS}}">
