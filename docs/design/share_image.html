<!doctype html>
<!-- The share image (13.23): rendered once to web/share.png at 1200 by 630, deviceScaleFactor 1, with the pre-installed
     Playwright (page.screenshot of this file). It carries no counts, because counts change every day and a link
     preview would go stale. The tiles are the index map's layout (scripts/build_site.py STATES), all one tone: they
     say "by state", not how much of each state is read. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Funding Atlas share image</title>
<style>
@font-face { font-family: "Public Sans"; font-weight: 400 700; src: url("../../web/fonts/public-sans-latin.woff2") format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-weight: 600 700; src: url("../../web/fonts/source-serif-4-latin.woff2") format("woff2"); }
:root { --bg: #f7f8fa; --ink: #14213d; --muted: #56607a; --accent: #1f3f8f; --accent-soft: #e7ecf8; --likely: #17663a; --possible: #8a5a00; --line: #dde1ea; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: "Public Sans", sans-serif; display: grid; grid-template-columns: 600px 1fr; gap: 40px; padding: 64px 64px 56px 72px; border-top: 14px solid var(--accent); }
.left { display: grid; align-content: space-between; }
.brand { display: flex; align-items: center; gap: 18px; font: 600 38px/1 "Source Serif 4", serif; }
.mark { width: 52px; height: 52px; color: var(--ink); }   /* mark C1 (2026-11-28), the drawing in scripts/build_site.py */
h1 { font: 700 60px/1.08 "Source Serif 4", serif; letter-spacing: -.01em; text-wrap: balance; }
p { font-size: 26px; line-height: 1.4; color: var(--muted); }
.url { font-size: 22px; font-weight: 600; color: var(--accent); }
.map { align-self: center; display: grid; grid-template-columns: repeat(11, 36px); grid-template-rows: repeat(8, 36px); gap: 5px; }
.map i { background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 7px; }
</style>
</head>
<body>
<div class="left">

  <div style="display:grid;gap:22px">
    <h1>Open public funding for local governments, by state.</h1>
    <p>Federal and state programs open to towns, cities and counties, read daily from the agencies that run them.</p>
  </div>
  <div class="url">saj-sudo.github.io/funding-atlas</div>
</div>
