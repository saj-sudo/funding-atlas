ness","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["parks"],"alns":["15.662"],"listings":[{"aln":"15.662","name":"Great Lakes Restoration"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/362498","tier":"likely","is_new":false,"is_updated":false,"days_to_close":62,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":491,"slug":"controlling-and-preventing-stis-in-us-health-departments-cap-stis-grants-gov-362349","name":"Controlling and Preventing STIs in US Health Departments (CAP-STIs)","number":"CDC-RFA-PS-27-0008","level":"federal","state":null,"agency":"Centers for Disease Control - NCHHSTP","agency_code":"HHS-CDC-NCHHSTP","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-05-11","closes_at":"2027-01-11","closes_text":null,"rolling":null,"amount_min":0,"amount_max":0,"match_required":false,"match_pct":null,"summary":"CDC is funding programs that track, prevent, and control sexually transmitted infections (STI) in state, district, territorial, and city or county health departments. The purpose of this NOFO is to track, prevent, and control three common STIs: syphilis, gonorrhea, and chlamydia. The NOFO supports the goals of the Sexually Transmitted Infections National Strategic Plan 2021-2025: Prevent new STIs. Improve the health of people by reducing adverse outcomes of STIs. Implement STI prevention technology and innovations more quickly. Reduce the impact of STIs in areas or populations disproportionately impacted by STIs. Achieve integrated, coordinated efforts that address the STI epidemic. Local surveillance data will determine the priority populations for this NOFO. Each program should focus on populations that are disproportionately impacted by STI transmission. To be successful with this NOFO, you will need to collaborate with partners to address interconnected comorbidities and sexual health.","eligibility":"All fifty (50) states, the District of Columbia, the US Virgin Islands and Puerto Rico are eligible to apply. To ensure implementation of STI control and prevention nationwide, CDC intends to fund all fifty states, the District of Columbia, the US Virgin Islands and Puerto Rico, non-competitively, according to a funding formula based on the respective jurisdiction\"s population & morbidity of three reportable STIs (chlamydia, gonorrhea and primary & secondary syphilis).Section 318(c) of the Public Health Services Act, 42 USC 247c(c), provides that the Secretary of HHS may provide funding to \"States and, in consultation with the State health authority, to political subdivisions of States...\" to conduct STI prevention & control projects. This language allows CDC to fund cities in addition to their respective states. Under the previous STI prevention & control funding opportunity PS19-1901 (& prior to that, PS14-1402), CDC funded the following cities based upon population, STI morbidity & organizational capacity: New York City, Philadelphia, Baltimore, Chicago, Los Angeles & San Francisco.To maximize the efficiency of program delivery, CDC may again fund a limited number of cities under this award. Funding for cities will be awarded competitively, based on the same criteria shown above for the state formula: population, STI morbidity, as well as organizational capacity. Directly funded cities must have a demonstrated capacity to report chlamydia, gonorrhea and syphilis surveillance data to CDC; an agreement with their parent state to apply separately for NOFO funding & to coordinate/collaborate appropriately following any funding; & data showing that the surrounding metropolitan statistical area (MSA) reported 2024 data showing:> or = to 500 cases of syphilis aged 15-44 reported in 2024 > or = 7500 cases of gonorrhea aged 15-44 reported in 2024 > or = to 15,000 cases of chlamydia aged 15-44 reported in 2024 > or = to 4 million residents estimated in 2024 Cities that apply for funding must submit their 2024 surveillance summary demonstrating the number of required cases & residents, a joint statement of collaboration/coordination with their respective state, or a letter indicating the city has notified the state of its application for funding of this award. In the event that cities do not compete successfully for the funding, all funds will be provided to the state, which will be responsible for distributing funds to its constituent cities as appropriate.","applicant_types":["county","municipality","special_district","state"],"categories":["health"],"alns":["93.977"],"listings":[{"aln":"93.977","name":"Sexually Transmitted Diseases (STD) Prevention and Control Grants"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/362349","tier":"likely","is_new":false,"is_updated":false,"days_to_close":73,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":249,"slug":"fiscal-year-fy-2027-americorps-state-and-national-competitive-grants-grants-gov-363696","name":"Fiscal Year (FY) 2027 AmeriCorps State and National Competitive Grants","number":"AC-08-28-26","level":"federal","state":null,"agency":"AmeriCorps","agency_code":"AC","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-08-28","closes_at":"2027-01-13","closes_text":null,"rolling":null,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"AmeriCorps improves lives, strengthens communities, and fosters civic engagement through service and volunteering. AmeriCorps brings people together to tackle some of the country’s most pressing challenges through national service and volunteerism. AmeriCorps members serve with organizations dedicated to the improvement of communities and those serving. AmeriCorps grants are awarded to eligible organizations that engage AmeriCorps members in evidence-based or evidence-informed interventions to strengthen communities. An AmeriCorps member is a person who does community service through AmeriCorps. Members may receive a living allowance and other benefits. After successful completion of their service, members earn a Segal AmeriCorps Education Award they can use to pay for higher education expenses or apply to qualified student loans.","eligibility":"State Service Commission and/or States and US Territories","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["health","housing","infrastructure","other","public_safety","water","workforce"],"alns":["94.006"],"listings":[{"aln":"94.006","name":"AmeriCorps State and National 94.006"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/363696","tier":"likely","is_new":false,"is_updated":false,"days_to_close":75,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":302,"slug":"noi-prospect-program-providing-opportunities-for-specialized-education-in-critic-grants-gov-363510","name":"NOI: PROSPECT Program: Providing Opportunities for Specialized Education in Critical Technologies","number":"DE-FOA-0003662","level":"federal","state":null,"agency":"Golden Field Office","agency_code":"DOE-GFO","connector":"grants_gov","funding_type":"other","funding_source":"direct","status":"open","opens_at":"2026-08-07","closes_at":"2027-01-15","closes_text":null,"rolling":null,"amount_min":1,"amount_max":1,"match_required":false,"match_pct":null,"summary":"The U.S Department of Energy (DOE)’s Office of Critical Minerals and Energy Innovation (CMEI) intends to establish, on behalf of the Analysis and Strategy Office (ASO), the PROSPECT Program—Providing Opportunities for Specialized Education in Critical Technologies—and anticipates investing up to $100 million, subject to the availability of appropriated funds, to strengthen the nation's educational capacity in critical minerals and materials.¿ The activities under this anticipated PROSPECT Program support collaborative approaches that strengthen educational pathways across the entire critical minerals and materials value chain—from mineral resource development and extraction through processing, manufacturing, recycling, and related supply chain activities. Specifically, the planned PROSPECT Program would build on existing investments in critical minerals and materials research, development, demonstration, and deployment by ensuring that the United States has the highly skilled workforce needed to support continued innovation and growth across the domestic supply chain.¿ Through collaboration among academia, industry, national laboratories, and other partners, the program is expected to help develop a durable talent pipeline that strengthens U.S. economic competitiveness, energy security, and national security. This Notice of Intent (NOI) is issued so that interested parties are aware of CMEI’s intention to establish this PROSPECT Program in the near term. All the information contained in this NOI is subject to change. CMEI will not respond to questions concerning this NOI. Complete information, including the full Notice of Intent, can be found on the DOE CMEI Funding Opportunities website: https://eere-exchange.energy.gov/.","eligibility":null,"applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["energy"],"alns":["81.117"],"listings":[{"aln":"81.117","name":"Energy Efficiency and Renewable Energy Information Dissemination, Outreach, Training and Technical Analysis/Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363510","tier":"likely","is_new":false,"is_updated":false,"days_to_close":77,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":6618,"slug":"landscape-scale-restoration-grant-program-for-non-federal-lands-grants-gov-364144","name":"Landscape Scale Restoration Grant Program for Non-Federal Lands","number":"USDA-FS-2026-LSR","level":"federal","state":null,"agency":"Forest Service","agency_code":"USDA-FS","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-28","closes_at":"2027-01-26","closes_text":"Applications due in grants.gov 11:59 p.m. Eastern January 26, 2027. Note: By December 17, 2026 all applicants except federally recognized Tribes and Tribal organizations must submit the project narrative and budget to the relevant State Forester(s) for sponsorship consideration.","rolling":null,"amount_min":100000,"amount_max":600000,"match_required":true,"match_pct":null,"summary":"The Forest Service is offering this one LSR non-federal lands Notice of Funding Opportunity (NOFO) which replaces the three regional (Southern/IITF, Western, and Northeast/Midwestern) NOFOs. The purpose of the Landscape Scale Restoration (LSR) Program is to encourage collaborative, science-based restoration of priority forest landscapes. This competitive grant program supports collaborative high impact projects that lead to measurable outcomes on priority forest landscapes, leverage public and private resources, and further priorities identified in a State Forest Action Plan or equivalent science-based restoration strategy. Proposals should reduce wildfire risk, improve fish and wildlife habitats, maintain or improve water quality and watershed function, and/or mitigate invasive plants, insects, and disease. Eligible Lands: LSR projects must be conducted on rural non-industrial private forest land, and/or rural state or local government forest land. See NOFO for more definitions. For the purposes of this program, “rural” is defined as all areas outside Census places greater than 50,000 people according to the latest United States Census. Please use the LSR Project Planning Tool (Project Eligibility) to confirm if your proposed project location is eligible within this definition. Individual Award Funding: Minimum: $100,000 per project. $50,000 per project for the Virgin Islands, Guam, American Samoa, the Northern Mariana Islands, the Freely Associated States of the Republic of Palau (Palau), the Federated States of Micronesia, and the Republic of the Marshall Islands. Maximum: $300,000 for single-state projects; $600,000 for multi-state projects. Cost Share Required: Grant recipients must match (cost share) the Federal grant funds 1:1 with non-Federal sources. State Forester Sponsorship: All applications except those submitted by federally recognized Tribes and Tribal organizations require the relevant State Forester(s) to sponsor the project. Each State Forester may sponsor/participate in up to a total of 10 applications, including up to 5 single-state applications and up to 5 multi-state applications. For Tribes and Tribal organizations: Federally Recognized Tribes are limited to 2 applications for this NOFO. There is a separate national LSR NOFO for federally recognized Tribes and Tribal organizations: USDA-FS-2026-LSR-TRIBAL. Federally recognized Tribes and Tribal organizations may apply to either or both NOFOs but cannot receive more than one award for the same scope of work. For additional information and requirements, please refer to the NOFO document, which is posted in both the \"Related Documents\" tab and in the \"Instructions\" link located in the \"Package\" tab.","eligibility":"There is a separate national LSR Notice of Funding Opportunity (NOFO) for federally recognized Tribes and Tribal organizations: USDA-FS-2026-LSR-TRIBAL. Federally recognized Tribes and Tribal organizations may apply to either or both NOFOs but cannot receive more than one award for the same scope of work.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["parks","water"],"alns":["10.742"],"listings":[{"aln":"10.742","name":"Landscape-Scale Restoration"}],"first_seen":"2026-10-28T16:13:19Z","last_changed":"2026-10-28T16:13:19Z","source_url":"https://www.grants.gov/search-results-detail/364144","tier":"likely","is_new":true,"is_updated":false,"days_to_close":88,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":192,"slug":"fy2026-2027-community-compass-technical-assistance-and-capacity-building-program-grants-gov-363878","name":"FY2026/2027 Community Compass Technical Assistance and Capacity Building Program Notice of Funding Opportunity","number":"PDR-2600-DC-0006","level":"federal","state":null,"agency":"Department of Housing and Urban Development","agency_code":"HUD","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-09-16","closes_at":"2027-02-03","closes_text":null,"rolling":null,"amount_min":250000,"amount_max":35000000,"match_required":false,"match_pct":null,"summary":"The Community Compass Technical Assistance (CCTA) program awards competitive grants to eligible applicants. With these grants, you will provide technical assistance (TA) to the people and organizations HUD serves. Under this Notice of Funding Opportunity (NOFO), HUD will award up to $86,000,000 in 2026 funding for TA. We invite applications from organizations with deep experience and a commitment to excellence. If awarded, you will deliver results in communities across the country and support the Administration's priorities. As a recipient, you will: Develop tools and products that train and educate, Work directly with communities to improve their systems and processes, Assess your audience so you can design curriculums that fit their needs, Partner with HUD on urgent, high-priority projects, Serve as a thought partner with HUD by helping identify needs, share ideas, and create innovative work. CCTA recipients must meet high expectations. To win an award, you must meet every requirement in this NOFO and show a record of excellent performance. Specifically, you must: Know HUD's programs and topics and have experience carrying them out, Provide staff experienced in designing and delivering training, Keep enough staff available to shift quickly to high-priority tasks, Have the capacity, systems, and staffing to manage a federal award. Recipients that do not meet CCTA's high performance standards will not succeed. HUD may monitor your performance and may end an award under 2 CFR 200.340. Our expectations are high, but you will not deliver results alone. If awarded, you will: Work with HUD program office leadership on each engagement, Receive training and support from HUD's Office of Technical Assistance (OTA), Coordinate your work with other award recipients.","eligibility":"Hispanic-Serving Institutions (HSIs); Historically Black Colleges and Universities (HBCUs); Tribally Controlled Colleges and Universities (TCCUs); and Alaska Native and Native Hawaiian Serving Institutions (ANNH) are eligible to compete for, or receive, awards made under this announcement. Individuals, foreign entities, and sole proprietorship organizations are not eligible to compete for, or receive, awards made under this announcement. Individuals, foreign entities, and sole proprietorship organizations are not eligible to compete for, or receive, awards made under this announcement.","applicant_types":["business","county","higher_ed","housing_authority","municipality","nonprofit","special_district","state"],"categories":["housing","infrastructure"],"alns":["14.259"],"listings":[{"aln":"14.259","name":"Community Compass Technical Assistance and Capacity Building"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363878","tier":"likely","is_new":false,"is_updated":false,"days_to_close":96,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":6823,"slug":"grid-supply-chain-alternatives-to-lead-energy-dominance-scaled-grants-gov-364174","name":"Grid Supply Chain Alternatives to Lead Energy Dominance (SCALED)","number":"DE-FOA-0003641","level":"federal","state":null,"agency":"National Energy Technology Laboratory","agency_code":"DOE-NETL","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-10-30","closes_at":"2027-02-08","closes_text":null,"rolling":null,"amount_min":1,"amount_max":237000000,"match_required":true,"match_pct":null,"summary":"Grid Supply Chain Alternatives to Lead Energy Dominance (SCALED) This initiative will deploy a multi-faceted approach to bolster domestic capabilities to withstand supply chain shocks, ensure a reliable energy infrastructure, and position the U.S. as a global leader in foundational grid technologies.","eligibility":null,"applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["energy"],"alns":["81.122"],"listings":[{"aln":"81.122","name":"Electricity Research, Development and Analysis"}],"first_seen":"2026-10-30T15:58:42Z","last_changed":"2026-10-30T15:58:42Z","source_url":"https://www.grants.gov/search-results-detail/364174","tier":"likely","is_new":true,"is_updated":false,"days_to_close":101,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":999,"slug":"public-health-crisis-response-cooperative-agreement-grants-gov-337086","name":"Public Health Crisis Response Cooperative Agreement","number":"CDC-RFA-TP22-2201","level":"federal","state":null,"agency":"Centers for Disease Control - OPHPR","agency_code":"HHS-CDC-OPHPR","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2022-01-13","closes_at":"2027-02-11","closes_text":"Electronically submitted applications must be submitted no later than 11:59 pm ET on the listed application due date.","rolling":null,"amount_min":50000,"amount_max":5000000,"match_required":false,"match_pct":null,"summary":"CDC seeks to enhance the nation’s ability to rapidly mobilize, surge, and respond to public health emergencies (PHEs) as identified by CDC by establishing a roster of approved but unfunded (ABU) applicants that may receive rapid funding to respond to PHEs of such magnitude, complexity, or significance that they would have an overwhelming impact upon, and exceed resources available to, the jurisdictions. Applicants will undergo an objective merit review process, and entities that successfully meet the requirements for approval will be placed on the ABU list. CDC will use this ABU list for emergencies that require federal support to effectively respond to, manage, and address identified public health threats. CDC will make funding related to this NOFO available once it has determined a public health emergency exists or is considered imminent and will be contingent upon the availability and stipulations of appropriations. CDC will provide additional guidance and information to those on the ABU list when this NOFO is funded. Since this NOFO is designed to collect applications prior to a PHE, applicants are encouraged to submit work plans and budgets that demonstrate their ability to respond to a PHE. COVID-19 public health response plans, such as plans funded under CDC-RFA-TP18-1802 in 2020 are acceptable for this purpose. If this NOFO is funded for a specific PHE, CDC will develop supplemental guidance that outlines additional work plan and budget requirements tailored to the emergency. This NOFO is not a capacity-building funding mechanism, and it is not intended to create or establish new public health (PH) emergency management programs. It may be used to re- establish capacity lost or diminished because of the public health crisis. It is designed to support the surge needs of existing programs responding to a significant PHE. CDC will provide supplemental guidance to entities on the ABU list when this NOFO is activated regarding specific activities intended to address the emergency. CDC has strong relationships with governmental PH departments, community-based organizations, and other domestic partners and supports them for planning, capacity-building, preparedness, and response to PHEs. This NOFO complements these ongoing capacity-building preparedness and response programs by providing a mechanism for CDC to rapidly mobilize and fund PH organizations for specific response needs. Applicants must describe how this funding will not duplicate or supplant other federal funding. Upon occurrence of a PHE, CDC can rapidly fund specific applicants to accelerate public health crisis response activities such as coordinating emergency operations, hiring surge staff, and conducting needs assessments to determine the resources necessary to address the public health crisis. The NOFO also provides funding for specialized public health emergency response activities tailored to the specific public health crisis.","eligibility":"This NOFO is intended for states, political subdivisions of states, and other public entities as specified in section 317(a) of the Public Health Service Act (42 USC § 247(b)). It targets public health organizations that serve state, tribal, local, and territorial populations and are constitutionally empowered to protect the health and welfare of their respective communities, focused on executing emergency preparedness and response services. To demonstrate existing capacity for public health emergency management, applicants must submit their response organizational charts and work plans. If these documents are not submitted, the application will be considered non-responsive and will receive no further review. Local government organizations or their bona fide agents must:Serve a county population of 2 million or more or serve a city population of 400,000 or more. Populations for county and city jurisdictions are based on the following 2021 U.S. Census resources:City and Town Population Totals: 2020-2021 (census.gov) U.S. Census – Annual Estimates of the Resident Population for Incorporated Places, Ranked by July 1, 2021, Population: April 1, 2020, to July 1, 2021County Population Totals: 2020-2021 (census.gov) U.S. Census – Annual Estimates for 2021Sources may be updated as census data change over timeLocal jurisdictions that meet population requirements are listed in Attachment A.Tribal governments or their bona fide agents must be federally recognized and:Serve a population of 50,000 or more.CDC will reopen this announcement periodically over the five-year NOFO period to accommodate population changes and ensure we maintain a current roster of eligible jurisdictions for emergency response. Sources for future postings of this NOFO will be based on the latest census data and may change over time.The anticipated dates for reposting are noted below. Applicants will have 60 days to submit an application.July 2024July 2025July 2026","applicant_types":["county","municipality","special_district","state","tribe"],"categories":["health"],"alns":["93.354"],"listings":[{"aln":"93.354","name":"Public Health Emergency Response: Cooperative Agreement for Emergency Response: Public Health Crisis Response"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/337086","tier":"likely","is_new":false,"is_updated":false,"days_to_close":104,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":438,"slug":"integrated-viral-hepatitis-surveillance-testing-treatment-and-prevention-program-grants-gov-362731","name":"Integrated Viral Hepatitis Surveillance, Testing, Treatment, and Prevention Programs for Health Departments (IVH-STTP)","number":"CDC-RFA-PS-27-0009","level":"federal","state":null,"agency":"Centers for Disease Control - NCHHSTP","agency_code":"HHS-CDC-NCHHSTP","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-06-09","closes_at":"2027-02-16","closes_text":null,"rolling":null,"amount_min":0,"amount_max":0,"match_required":false,"match_pct":null,"summary":"This NOFO supports integrated viral hepatitis surveillance and prevention programs in states, territories, and large cities in the United States. Key strategies include viral hepatitis outbreak response and surveillance for hepatitis A, acute and chronic hepatitis B, and acute, chronic, and perinatal hepatitis C. Surveillance activities include developing and utilizing disease registries, conducting data matching, generating data summaries, utilizing data to monitor program progress and inform program activities and to enhance case investigations for data-to-care opportunities, and strengthening health department infrastructure to expand surveillance capacity. Prevention activities include supporting viral hepatitis elimination planning, partnerships, and coordination in high-impact and healthcare settings, increasing hepatitis B and hepatitis C testing, treatment, and service integration in high-impact settings, and developing perinatal hepatitis C programs. Expected outcomes include improved surveillance and reporting of viral hepatitis, improved strategic planning and partner collaboration in viral hepatitis elimination, and expanded access to viral hepatitis prevention, diagnosis, and treatment in high-impact settings. This multi-component NOFO includes two required components and two optional components: Component 1: Outbreak Response and Surveillance (Required) Component 2: Planning, Partnerships, and Promotion (Required) Component 3: Testing, Treatment, and Prevention (Optional) Component 4: Perinatal Hepatitis C Program (Optional) This NOFO is alignment with CDC priorities.","eligibility":"Eligible applicants include: The 51 state health departments or their bona fide agents, including the District of Columbia. Local health agencies or their bona fide agents. If the city does not have a public health department, then the county covering the jurisdiction may apply (i.e., Los Angeles, CA covered by Los Angeles County and Phoenix, AZ covered by Maricopa County). All U.S. territories Bona fide agents must submit documentation that demonstrates their arrangement with the eligible applicant.","applicant_types":["county","municipality","special_district","state"],"categories":["health"],"alns":["93.270"],"listings":[{"aln":"93.270","name":"Viral Hepatitis Prevention and Control"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/362731","tier":"likely","is_new":false,"is_updated":false,"days_to_close":109,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":369,"slug":"eviction-protection-grant-program-grants-gov-363148","name":"Eviction Protection Grant Program","number":"PDR-2600-DC-0079","level":"federal","state":null,"agency":"Department of Housing and Urban Development","agency_code":"HUD","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-10","closes_at":"2027-02-17","closes_text":null,"rolling":null,"amount_min":500000,"amount_max":2000000,"match_required":false,"match_pct":null,"summary":"The Eviction Protection Grant Program (EPGP) will provide competitive awards to approximately 16 eligible nonprofit organizations and government entities to provide no cost legal assistance (including assistance related to pretrial activities, trial activities, post-trial activities and alternative dispute resolution) to low-income tenants at risk of or subject to eviction.","eligibility":"Within the categories of eligible entities, you must be a nonprofit organization or government entity. Examples of entities that may be eligible, if requirements are met, include: 1) legal aid or legal clinic provider, 2) private nonprofit or state institution of higher education, 3) housing counseling or other social service organization that provides legal assistance, and 4) local, state, or tribal agency or court. Individuals, foreign entities, and sole proprietorship organizations, for-profit private institutions of higher education, Public Housing Agencies (PHAs), and Tribally Designated Housing Entities (TDHEs) are not eligible to compete for, or receive, awards made under this announcement.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["housing"],"alns":["14.537"],"listings":[{"aln":"14.537","name":"Eviction Protection Grant Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363148","tier":"likely","is_new":false,"is_updated":false,"days_to_close":110,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4463,"slug":"fiscal-year-2026-flood-mitigation-assistance-grants-gov-364124","name":"Fiscal Year 2026 Flood Mitigation Assistance","number":"DHS-26-MT-029-000-98","level":"federal","state":null,"agency":"Department of Homeland Security - FEMA","agency_code":"DHS-DHS","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-22","closes_at":"2027-02-26","closes_text":null,"rolling":null,"amount_min":0,"amount_max":0,"match_required":true,"match_pct":null,"summary":"The Flood Mitigation Assistance (FMA) grant program provides federal funds to states, U.S. territories, federally recognized tribal governments, and local ality of care in rural healthcare organizations.","eligibility":"Successful applications must target rural healthcare organizations located in the Appalachian region. For the purposes of this notice of funding opportunity, a \"rural healthcare organization\" is a healthcare organization located in a rural county in the Appalachian region. \"Healthcare organizations\" include: critical access hospitals (CAHs), small rural hospitals, rural health clinics, tribal healthcare facilities, and other healthcare organizations.","applicant_types":["business","county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["health"],"alns":["93.619"],"listings":[{"aln":"93.619","name":"Rural Health Limited Geographic Areas: Delta, Appalachian Region, and Northern Border Region"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363697","tier":"likely","is_new":false,"is_updated":false,"days_to_close":148,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4132,"slug":"all-terrain-vehicle-and-snowmobile-now-called-motorized-trails-recreation-pa-grants-dcnr/1","name":"All-Terrain Vehicle and Snowmobile NOW called Motorized Trails & Recreation","number":null,"level":"state","state":"PA","agency":"Department of Conservation & Natural Resources","agency_code":"PA-DCNR","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2027-02-01","closes_at":"2027-03-31","closes_text":"Bi-Annual (2x per Year) Spring: Always opens first business day in February to last business day in March. Fall: Always opens first business day in Aug to last business day in Sept.","rolling":null,"amount_min":null,"amount_max":null,"match_required":null,"match_pct":null,"summary":"All-Terrain Vehicle and Snowmobile projects include the planning, acquisition of land, development, rehabilitation, maintenance, purchase of equipment for maintenance and construction, and development of educational programs related to ATV and/or snowmobile trails and facilities. ONLY ATV or snowmobile projects should be submitted in this category. Funding comes from the ATV Management Restricted Account and the Snowmobile Management Restricted Account as authorized by Act 97 of 2016. There is no match requirement for this funding; however, applications that provide match funding will be given additional consideration.","eligibility":"Eligibility: Planning; acquisition of land; development, rehabilitation or maintenance; the purchase of equipment for maintenance and construction; training and educational activities.\nApplicant type: Municipalities; Nonprofit organizations; For-profit organizations","applicant_types":["business","municipality","nonprofit"],"categories":["parks"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-23T14:16:32Z","source_url":"https://www.pa.gov/grants/search/grant-details/dcnr/1","tier":"likely","is_new":false,"is_updated":true,"days_to_close":152,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":338,"slug":"drug-free-communities-dfc-support-program-competing-continuation-year-6-grants-gov-363354","name":"Drug-Free Communities (DFC) Support Program – Competing Continuation (Year 6)","number":"CDC-RFA-CE22-22050601CONT27","level":"federal","state":null,"agency":"Centers for Disease Control - NCIPC","agency_code":"HHS-CDC-NCIPC","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-28","closes_at":"2027-03-31","closes_text":null,"rolling":null,"amount_min":0,"amount_max":125000,"match_required":true,"match_pct":null,"summary":"The Drug-Free Communities (DFC) Support Program was created by the Drug-Free Communities Act of 1997 (Public Law 105-20). The Executive Office of the President, Office of National Drug Control Policy (ONDCP), and the Department of Health and Human Services (HHS), Centers for Disease Control and Prevention (CDC), National Center for Injury Prevention and Control (NCIPC) are accepting applications for Fiscal Year (FY) 2026 Drug-Free Communities (DFC) Support Program Grants. The purpose of the DFC Support Program is to establish and strengthen collaborations to support the efforts of community coalitions working to prevent and reduce substance use among youth. By statute, the DFC Support Program has two goals: 1) Establish and strengthen the collaboration among communities, public and private non-profit agencies, as well as federal, state, local, and tribal governments to support the efforts of community coalitions working to prevent and reduce substance use among youth (individuals 18 years of age and younger). 2) Reduce substance use among youth and, over time, reduce substance use among adults by addressing the factors in a community that increases the risk of substance use and promoting the factors that minimize the risk of substance use. This funding opportunity will fund applicants who have concluded the first (Year 1 – 5) funding cycle or have experienced a lapse in funding.","eligibility":"Eligible applicants are community-based coalitions addressing youth substance use that have previously received a DFC grant (Year 1–5), have experienced a lapse in funding, or have concluded the first five-year funding cycle and are applying for a second five-year funding cycle.A DFC legal applicant (an organization applying on behalf of a coalition, the coalition, or the applicant coalition) must reside within the United States and/or the U.S. territories.Applicants must be a nonprofit (as defined by the IRS as a 501(c) organization); or an entity that the Administrator determines to be appropriate; or part of, or is associated with an established legally recognized domestic, public or private nonprofit organization.These entities can include state and local governments, federally recognized tribes, state-recognized tribes, urban Indian organizations (as defined in Pub. L. No. 94-437), public or private universities and colleges, professional associations, voluntary organizations, self-help groups, consumer and provider services-oriented constituency groups, community- and faith-based organizations, and tribal organizations. (Pub. L. No. 114-198 Sec 103).For the purposes of this NOFO and the DFC Support Program, a coalition is defined as a community-based formal arrangement for cooperation and collaboration among groups or sectors of a community in which each group retains its identity, but all agree to work together toward a common goal of building a safe, healthy, and drug-free community.","applicant_types":["county","higher_ed","municipality","nonprofit","school","special_district","tribe"],"categories":["health"],"alns":["93.276"],"listings":[{"aln":"93.276","name":"Drug-Free Communities Support Program Grants"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363354","tier":"likely","is_new":false,"is_updated":false,"days_to_close":152,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":333,"slug":"drug-free-communities-dfc-support-program-new-year-1-grants-gov-363353","name":"Drug-Free Communities (DFC) Support Program – NEW (Year 1)","number":"CDC-RFA-CE-27-0058","level":"federal","state":null,"agency":"Centers for Disease Control - NCIPC","agency_code":"HHS-CDC-NCIPC","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-28","closes_at":"2027-03-31","closes_text":null,"rolling":null,"amount_min":0,"amount_max":125000,"match_required":true,"match_pct":null,"summary":"The Drug-Free Communities (DFC) Support Program was created by the Drug-Free Communities Act of 1997 (Public Law 105-20). The Executive Office of the President, Office of National Drug Control Policy (ONDCP), and the Department of Health and Human Services (HHS), Centers for Disease Control and Prevention (CDC), National Center for Injury Prevention and Control (NCIPC) are accepting applications for Fiscal Year (FY) 2027 Drug-Free Communities (DFC) Support Program grants. The purpose of the DFC Support Program is to establish and strengthen collaboration to support the efforts of community coalitions working to prevent youth substance use. By statute, the DFC Support Program has two goals: 1) Establish and strengthen collaboration among communities, public and private non-profit agencies, as well as federal, state, local, and tribal governments to support the efforts of community coalitions working to prevent and reduce substance abuse among youth (individuals 18 years of age and younger). 2) Reduce substance abuse among youth and, over time, reduce substance abuse among adults by addressing the factors in a community that increase the risk of substance abuse and promoting the factors that minimize the risk of substance abuse.","eligibility":"Nonprofits having a 501(c)(3) status with the IRS, other than institutions of higher education. A DFC legal applicant (an organization applying on behalf of a coalition, the coalition, or the applicant coalition) must reside within the United States and/or the U.S. territories.Additional Information on Eligibility: Eligible applicants are community-based coalitions addressing youth substance use that have not yet previously received a DFC grant. Applicants must be a nonprofit (as defined by the IRS as a 501(c) organization); or an entity that the Administrator determines to be appropriate; or part of, or is associated with an established legally recognized domestic, public or private nonprofit organization. For example, state and local governments, federally recognized tribes, state-recognized tribes, urban Indian organizations (as defined in Pub. L. No. 94-437), public or private universities and colleges, professional associations, voluntary organizations, self-help groups, consumer and provider services-oriented constituency groups, community- and faith-based organizations, and tribal organizations. (Pub. L. No. 114-198 Sec 103). For the purposes of this NOFO and the DFC Support Program, a coalition is defined as a community-based formal arrangement for cooperation and collaboration among groups or sectors of a community in which each group retains its identity, but all agree to work together toward a common goal of building a safe, healthy, and drug-free community.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["health"],"alns":["93.276"],"listings":[{"aln":"93.276","name":"Drug-Free Communities Support Program Grants"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363353","tier":"likely","is_new":false,"is_updated":false,"days_to_close":152,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4188,"slug":"motorized-trails-recreation-pa-grants-dcnr/5","name":"Motorized Trails & Recreation","number":null,"level":"state","state":"PA","agency":"Department of Conservation & Natural Resources","agency_code":"PA-DCNR","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2027-02-01","closes_at":"2027-03-31","closes_text":"Bi-Annual (2x per Year) Spring: Always opens first business day in February to last business day in March. Fall: Always opens first business day in Aug to last business day in Sept.","rolling":null,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"Motorized Trails & Recreation projects support ATVing, Snowmobiling, Off-Highway Motorcycling, and Four-Wheel Driving activities, but project eligibility and match requirements vary. "summary":"CMEI intends to issue, on behalf of AFFO, a NOFO titled, “Leveraging Domestic Infrastructure and Resources to Unleash Alternative Chemicals, Fuels, and Feedstocks”. This NOFO will seek applications for financial assistance awards that would support AFFO’s vision to push the frontiers of science and engineering, advance energy addition, and unleash American energy innovation. The purpose of the potential NOFO is to solicit innovative technologies that harness existing domestic biomass and pipeline resources to expand energy production and distribution. The NOFO will advance multiple alternative fuels and feedstock technology areas to maximize the benefits of these existing resources: the production of liquid intermediate products made from biomass, that are chemically, thermally, and physically stable, and that could be sold as commodities for various end applications, including for further upgrading to renewable fuels and chemicals; production of commodity chemicals and fuels at market prices from alternative feedstocks, leveraging existing refinery assets; and establishing pilot sites for blended hydrogen-natural gas that closely simulate actual gas distribution networks, to improve reliability, scalability, suitability, performance, and durability. This NOI is for informational purposes only; we are not requesting comments or applications at this time. All information provided here is subject to change. This notice serves to inform interested parties that the DOE may issue a notice of funding opportunity (NOFO). Please be aware that any future NOFO could differ significantly from what is described here, or one may not be issued at all. We will provide a designated channel for questions once a NOFO is officially released. Complete information, including the full Notice of Intent, can be found on the DOE Funding Opportunities website: https://exchange.energy.gov/.","eligibility":null,"applicant_types":["business","county","higher_ed","household","housing_ t; Higher Educational Institution; Other Educational Institution; Non-profit with 501(c)3 IRS Status; Non-profit with PA Bureau of Charitable Organizations Status.","applicant_types":["business","county","municipality","nonprofit","school"],"categories":["parks"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-23T14:16:32Z","source_url":"https://www.pa.gov/grants/search/grant-details/dcnr/3","tier":"likely","is_new":false,"is_updated":true,"days_to_close":182,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4183,"slug":"community-and-watershed-forestry-pa-grants-dcnr/2","name":"Community and Watershed Forestry","number":null,"level":"state","state":"PA","agency":"Department of Conservation & Natural Resources","agency_code":"PA-DCNR","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2027-01-11","closes_at":"2027-04-30","closes_text":"Annual: Opens: (2nd Monday of January) Closes: Last business day of April)","rolling":null,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"The DCNR Community and Watershed Forestry Program provides financial assistance to identify locations in need of riparian forest buffers, lawn conversion, and community tree planting and to design, implement, and establish those practices. Eligible applicants requesting Urban and Community Forestry funding should apply here.","eligibility":"Eligibility: Landowner outreach, design, site preparation, and planting of buffers, meadows, upland forest, community tree planting; plant materials and tree shelters; and post-planting establishment on plantings installed within the past 5 years. Projects can propose conventional or multifunctional riparian forest buffers, lawn conversion, or Urban and Community Forestry outreach and implementation.\nApplicant type: County or Municipal Government; Higher Educational Institution; Other Educational Institution; Non-profit with 501(c)3 IRS Status; Non-profit with PA Bureau of Charitable Organizations Status.","applicant_types":["business","county","municipality","nonprofit","school"],"categories":["parks"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-23T14:16:32Z","source_url":"https://www.pa.gov/grants/search/grant-details/dcnr/2","tier":"likely","is_new":false,"is_updated":true,"days_to_close":182,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":260,"slug":"f26as00105-national-fish-passage-program-grants-gov-363699","name":"F26AS00105 National Fish Passage Program","number":"F26AS00105","level":"federal","state":null,"agency":"Fish and Wildlife Service","agency_code":"DOI-FWS","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-08-24","closes_at":"2027-04-30","closes_text":"Electronically submitted applications must be submitted no later than 11:59 PM, ET, on the listed application due date.","rolling":null,"amount_min":1,"amount_max":1000000,"match_required":false,"match_pct":null,"summary":"The National Fish Passage Program (NFPP) provides technical and financial assistance to partners to remove instream barriers and restore aquatic connectivity, improve community safety, and support local economies. Fish passage projects benefit communities by reducing flood risk, improving recreational opportunities, and improving roads while supporting native fish populations and aquatic ecosystems. NFPP project examples include obsolete and dangerous infrastructure removals, culvert replacements, floodplain restoration, and the installation of fishways. It is estimated that for every $1 million invested by the program, $1.5 million in value is added to the economy.The program is delivered through U.S. Fish and Wildlife Service (Service) field offices nationwide. Local Service staff work with partners to identify and implement projects. Projects are based on sound science, advance the Service mission, and promote aquatic connectivity. Contact a regional NFPP Coordinator in your area for information about program priorities and the application process.The Commerce, Justice, Science; Energy and Water Development; and Interior and Environment Appropriations Act, 2026, allocated $15 million for the National Fish Passage Program, of which $5 million is designated for implementing the Fisheries Restoration and Irrigation Mitigation Act (FRIMA) (Public Law 106-502) of 2000.","eligibility":"The program seeks and develops projects collaboratively with partners, including but not limited to: State and local agencies, Tribes, non-governmental organizations, other Federal agencies, and private landowners. Additional requirements and geographic restrictions apply to FRIMA funded projects. See website for more information.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["water"],"alns":["15.685"],"listings":[{"aln":"15.685","name":"National Fish Passage"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363699","tier":"likely","is_new":false,"is_updated":false,"days_to_close":182,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4187,"slug":"land-acquisition-and-conservation-pa-grants-dcnr/4","name":"Land Acquisition and Conservation","number":null,"level":"state","state":"PA","agency":"Department of Conservation & Natural Resources","agency_code":"PA-DCNR","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2027-01-11","closes_at":"2027-04-30","closes_text":"Annual: Opens: (2nd Monday of January) Closes: Last business day of April)","rolling":null,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":50.0,"summary":"These projects involve the purchase and/or donation of land for park and recreation areas, greenways, critical habitat areas and/or open space.","eligibility":"Eligibility: Purchase of land for Critical habitat and open space, community recreation areas, trail corridors and greenways and purchase of conservation easements.\nApplicant type: County or Municipal Government; Higher Educational Institution; Other Educational Institution; Prequalified Land Trust with 501(c)3 IRS status and registered with PA Bureau of Charitable Organization Status.","applicant_types":["business","county","municipality","nonprofit","school"],"categories":["parks"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-23T14:16:32Z","source_url":"https://www.pa.gov/grants/search/grant-details/dcnr/4","tier":"likely","is_new":false,"is_updated":true,"days_to_close":182,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4181,"slug":"non-motorized-trails-pa-grants-dcnr/6","name":"Non-Motorized Trails","number":null,"level":"state","state":"PA","agency":"Department of Conservation & Natural Resources","agency_code":"PA-DCNR","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2027-01-11","closes_at":"2027-04-30","closes_text":"Annual: Opens: (2nd Monday of January) Closes: Last business day of April)","rolling":null,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":50.0,"summary":"Trail projects include the acquisition, planning, development, rehabilitation, or maintenance of designated routes on land or water for non-motorized recreation activities, as well as the purchase or lease of equipment to be used exclusively for the maintenance or construction of non-motorized land and water trails and non-motorized trail-related facilities.","eligibility":"Eligibility: Acquisition, Planning, Development, Rehabilitation, or Maintenance and Educational Programs, Equipment Purchase or Lease\nApplicant type: Federal agencies; State agencies; County and municipal governments; Municipal agencies; Non-profit organizations; For-profit organizations","applicant_types":["business","county","municipality","nonprofit","state"],"categories":["parks"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-23T14:16:32Z","source_url":"https://www.pa.gov/grants/search/grant-details/dcnr/6","tier":"likely","is_new":false,"is_updated":true,"days_to_close":182,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4182,"slug":"park-rehabilitation-and-development-pa-grants-dcnr/7","name":"Park Rehabilitation and Development","number":null,"level":"state","state":"PA","agency":"Department of Conservation & Natural Resources","agency_code":"PA-DCNR","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2027-01-11","closes_at":"2027-04-30","closes_text":"Annual: Opens: (2nd Monday of January) Closes: Last business day of April)","rolling":null,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":50.0,"summary":"These projects involve the rehabilitation and development of public parks, recreation facilities, greenways and river conservation projects. Eligible applicants requesting funding under the Small Community Program should apply here.","eligibility":"Eligibility: Site development drawings, specifications, surveys, professional service fees, design work, construction contracts and materials to perform the approved scope of work.\nApplicant type: County or Municipal Government; Higher Educational Institution; Other Educational Institution; Non-profit with 501(c)3 IRS Status; Non-profit with PA Bureau of Charitable Organizations Status","applicant_types":["county","municipality","nonprofit","school"],"categories":["parks"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-23T14:16:32Z","source_url":"https://www.pa.gov/grants/search/grant-details/dcnr/7","tier":"likely","is_new":false,"is_updated":true,"days_to_close":182,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":270,"slug":"modernizing-violent-death-and-suicide-surveillance-using-the-national-violent-de-grants-gov-363683","name":"Modernizing Violent Death and Suicide Surveillance Using the National Violent Death Reporting System (NVDRS)","number":"CDC-RFA-CE-27-0006","level":"federal","state":null,"agency":"Centers for Disease Control - NCIPC","agency_code":"HHS-CDC-NCIPC","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-08-20","closes_at":"2027-05-04","closes_text":null,"rolling":null,"amount_min":0,"amount_max":966085,"match_required":false,"match_pct":null,"summary":"The National Violent Death Reporting System (NVDRS) is CDC's state-based surveillance system for violent deaths and suicides. NVDRS combines information from death certificates, coroner or medical examiner reports, including toxicology reports, and law enforcement reports to provide comprehensive, incident-level data on the circumstances surrounding violent deaths. Through this Notice of Funding Opportunity, CDC will support eligible state, territorial, and local government entities, or their bona fide agents, in operating and modernizing NVDRS. Recipients will conduct statewide or territory-wide surveillance by collecting, linking, managing, analyzing, and submitting high-quality data on violent deaths and suicides. A central focus of this NOFO is timely and complete data reporting through two coordinated reporting processes: quarterly provisional data pulls and annual data closeout. Beginning in Year 1, recipients will prepare data for CDC's quarterly provisional data pulls to support earlier access to preliminary, actionable information. Recipients will progressively update case records as additional source documents and information become available. Annual data closeout is the primary process for producing the complete, finalized, and validated NVDRS dataset for each data year. Recipients must ensure that all eligible cases are fully abstracted, updated, validated, and completed using all required and available data sources by the annual closeout deadline. The finalized annual dataset supports national reporting, analysis, dissemination, and public health action. This NOFO also emphasizes modernization of data systems and workflows to increase efficiency, reduce reporting burden, improve data quality and timeliness, and enhance data usability. All recipients will complete a modernization readiness assessment within six months of award and implement at least one modernization pilot during the period of performance. Pilot activities may include automated data import and extraction, electronic data exchange and interoperability, workflow automation, data-quality tools, and enhanced data analysis and visualization. With CDC approval, recipients may also participate in optional activities that link NVDRS data with other relevant data systems to improve surveillance and expand public health insights. The intended outcome is a sustainable, modernized national surveillance system that produces timely provisional data and complete, reliable, high-quality annual data to inform violence and suicide prevention and support public health action.","eligibility":"Eligible applicants are U.S. state governments, including the District of Columbia; U.S. territorial governments; and political subdivisions of states, including county, city or township, and special district governments.Bona fide agents may apply on behalf of an eligible state, territorial, or local government organization. A bona fide agent must submit documentation demonstrating its formal arrangement with and authority to apply on behalf of the eligible governmental entity.Only one application will be funded from each eligible state or territory. Applicants must demonstrate the ability to implement statewide or territory-wide surveillance and access the data sources required for the National Violent Death Reporting System, including death certificates, coroner or medical examiner reports, including toxicology reports, and law enforcement reports.","applicant_types":["county","municipality","special_district","state"],"categories":["health"],"alns":["93.136"],"listings":[{"aln":"93.136","name":"Injury Prevention and Control Research and State and Community Based Programs"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363683","tier":"likely","is_new":false,"is_updated":false,"days_to_close":186,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4266,"slug":"901-municipal-waste-hhw-grant-pa-grants-dep/15","name":"901 Municipal Waste HHW Grant","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2024-07-01","closes_at":"2027-06-30","closes_text":"Continuous","rolling":true,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"The Section 901 HHW Education grants are available to all Pennsylvania counties for the cost of educational programs on household hazardous waste or pollution prevention and other technical assistance to small business for pollution prevention. The grant to a county cannot exceed 80% of the approved project costs. A county may request up to $75,000 every two years for costs associated with HHW educational programs. HHW educational costs incurred on January 1, 2016 or beyond will be eligible for grant funding. Applications may be submitted at any time during the year. Prior to applying, the applicant must meet with the appropriate DEP Regional Planning and Recycling Coordinator to discuss the proposed project and the grant requirements.","eligibility":"Eligibility: Counties are eligible for up to 80 percent reimbursement.\nApplicant type: Pennsylvania Counties\nPopulation served: County government recycling programs","applicant_types":["county","municipality"],"categories":["water"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/15","tier":"likely","is_new":false,"is_updated":false,"days_to_close":243,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4265,"slug":"901-municipal-waste-planning-grant-pa-grants-dep/16","name":"901 Municipal Waste Planning Grant","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2024-07-01","closes_at":"2027-06-30","closes_text":"Continuous","rolling":true,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"The Section 901 Planning Grants are available to all Pennsylvania counties for the cost of preparing municipal waste management plans; the cost of carrying out related studies, surveys, investigations, inquiries, research and analyses, including those related to siting; Environmental mediation; and feasibility studies and project development for municipal waste processing, disposal or composting facilities, except for facilities for the combustion of municipal waste that are not proposed to be operated for the recovery of energy. A county may not request or receive more than $75,000 per calendar year for planning nor exceed more than 80% of approved project costs. Applications may be submitted at any time during the year. Prior to applying, the applicant must meet with the appropriate DEP Regional Planning and Recycling Coordinator to discuss the proposed project and the grant requirements.","eligibility":"Eligibility: Counties are eligible for up to 80 percent reimbursement.\nApplicant type: Pennsylvania Counties\nPopulation served: County government recycling programs","applicant_types":["county","municipality"],"categories":["water"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/16","tier":"likely","is_new":false,"is_updated":false,"days_to_close":243,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4269,"slug":"901-planning-grants-for-household-battery-management-pa-grants-dep/41","name":"901 Planning Grants for Household Battery Management","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2025-01-24","closes_at":"2027-06-30","closes_text":"Continuous","rolling":true,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"The Act 101, Section 901 Household Battery Management Education grants are available to all Pennsylvania counties for the cost of educational programs on household battery management. The grant to a county cannot exceed 80% of the approved project costs. A county may request up to $75,000 every two years for costs associated with household battery management education. Household battery management education costs incurred on January 1, 2025, or beyond will be eligible for grant funding. Applications may be submitted at any time during the year. Prior to applying, the applicant must meet with the appropriate DEP Regional Planning and Recycling Coordinator to discuss the proposed project and grant requirements.","eligibility":"Eligibility: Counties are eligible for up to 80 percent reimbursement.\nApplicant type: Pennsylvania Counties\nPopulation served: County government recycling programs","applicant_types":["county","municipality"],"categories":["water"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/41","tier":"likely","is_new":false,"is_updated":false,"days_to_close":243,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4211,"slug":"peer-and-circuit-rider-pa-grants-dcnr/8","name":"Peer and Circuit Rider","number":null,"level":"state","state":"PA","agency":"Department of Conservation & Natural Resources","agency_code":"PA-DCNR","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-07-01","closes_at":"2027-06-30","closes_text":"Open Year Round","rolling":null,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"These grant programs fund projects that help municipalities, counties, multi-municipal partnerships, and council of governments to increase local capacity for recreation, parks and conservation. The Peer program funds projects that, through a collaborative process, focus on a specific need identified by the grantee and its partners. The Circuit Rider program aides in the hiring of a full-time park, recreation or conservation professional whose services are shared by the members of a formal partnership, commission or authority.","eligibility":"Eligibility: Contract with a qualified professional to complete special-purpose plans such as: Intergovernmental cooperation, Capacity-building opportunities, Strategic plans and site-specific planning, Facility, revenue, and operations plans, Walkability/Safe Routes to Parks assessments\nApplicant type: County or Municipal Governments; Eligible municipal agencies","applicant_types":["county","municipality"],"categories":["parks"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-23T14:16:32Z","source_url":"https://www.pa.gov/grants/search/grant-details/dcnr/8","tier":"likely","is_new":false,"is_updated":true,"days_to_close":243,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4270,"slug":"sports-marketing-and-tourism-grant-program-smat-pa-grants-dced/83","name":"Sports Marketing and Tourism Grant Program (SMAT)","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-06-29","closes_at":"2027-12-31","closes_text":"Other","rolling":null,"amount_min":null,"amount_max":null,"match_required":null,"match_pct":null,"summary":"Section 1721-A.2 of Subarticle C of the Fiscal Code (Act of April 9, 1929, P.L. 343, No 176) establishes the Sports Marketing and Tourism Account (the “Account”) within the Pennsylvania Gaming Economic Development and Tourism Fund as a restricted account. The purpose of the account is to attract high-quality, amateur, and professional sporting and e-sports events to this Commonwealth with the goal of advancing and promoting year-round tourism, economic impact, and quality of life through sport.","eligibility":"Eligibility: Eligible applicants include a municipality, a local authority, a nonprofit organization, or a legal entity that meets all of the following criteria:<br />1. The applicant participates or plans to participate in a competitive selection process;<br />2. The site selection process is conducted by a Site Selection Organization not located in Pennsylvania; and<br />3. The applicant is seeking to secure a single year or multiyear commitment from a site selection organization to conduct high quality, amateur and professional sporting or esports events at one or more locations in this Commonwealth.<br /><br />High quality, amateur and professional sporting or esports events include but are not limited to the following activities related to those listed out in the program guidelines.<br /><br />Site Selection Organizations – for a list of included entities, refer to the program guidelines.<br /><br />Eligible expenses under the program include the following:<br />• The costs relating to the preparations necessary for conducting the event.<br />• The costs of conducting the event at the venue, including costs of an improvement or renovation to an existing facility at the venue. The financial assistance under this section shall be limited to 20% of the total cost of an improvement or renovation to an existing facility, except if the facility is publicly owned. • Promotion, marketing and programming costs associated with the event. • Paid advertising and media buys within this Commonwealth related to the event.<br />• Production and technical expenses related to the event.<br />• Site fees and costs, such as labor, rentals, insurance, security, and maintenance.<br />• Machinery and equipment purchases associated with the conduct of the event.<br />• Public infrastructure upgrades or public safety improvements that will directly or indirectly benefit the conduct of the event.<br />• Costs related to land acquisition directly related to the conduct of the event. The financial assistance under this section shall be limited to 20% of the total acquisition cost unless the venue at which the event will be conducted is publicly owned.<br />• On-site hospitality during the conduct of the event.\nApplicant type: Municipality; Local authority; Nonprofit organization; Legal entity","applicant_types":["municipality","nonprofit"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/83","tier":"likely","is_new":false,"is_updated":false,"days_to_close":427,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4280,"slug":"main-street-matter
