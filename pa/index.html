regional economic development plans designed to build capacity and guide the economic prosperity and resiliency of an area or region. More specifically, EDA makes Partnership Planning investments to designated planning organizations (i.e., District Organizations) serving EDA-designated Economic Development Districts and to Indian Tribes to facilitate the development, implementation, revision, or replacement of Comprehensive Economic Development Strategies (CEDS), which articulate and prioritize the strategic economic goals of recipients’ respective regions. EDA also makes Short-Term and State Planning awards for economic development planning activities that guide the eventual creation and retention of high-quality jobs, particularly for the unemployed and underemployed in the Nation’s most economically distressed regions. Under the Local Technical Assistance program, EDA makes awards to strengthen the capacity of local or State organizations, institutions of higher education, and other eligible entities to undertake and promote effective economic development programs through projects such as feasibility studies, impact analyses, disaster resiliency plans, and project planning. **Please note: While the published Notice of Funding Opportunity (available under \"Related Documents\") states that the ED900A form and the SF424B form are both required for a complete application, these forms are no longer required and have therefore been removed from the package template.","eligibility":"Pursuant to section 3 of the Public Works and Economic Development Act of 1965 (42 U.S.C. § 3122) (PWEDA) and EDA’s regulation at 13 C.F.R. § 300.3, the following types of entities are eligible to receive funding assistance from EDA: 1. District Organizations (as defined in 13 C.F.R. § 300.3); 2. Indian Tribes or a consortium of Indian Tribes; 3. States, cities, or other political subdivisions of a State, including a special purpose unit of a State or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions; 4. Institutions of higher education or a consortium of institutions of higher education; or 5. Public or private non-profit organizations or associations acting in cooperation with officials of a political subdivision of a State.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["11.302","11.303"],"listings":[{"aln":"11.302","name":"Economic Development Support for Planning Organizations"},{"aln":"11.303","name":"Economic Development Technical Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/332127","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":121,"slug":"social-impact-partnerships-to-pay-for-results-act-demonstration-projects-grants-gov-364003","name":"Social Impact Partnerships to Pay for Results Act Demonstration Projects","number":"UST-SIPPRA-2027-003","level":"federal","state":null,"agency":"SIPPRA","agency_code":"USDOT-DO-SIPPRA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-10-07","closes_at":null,"closes_text":null,"rolling":null,"amount_min":0,"amount_max":0,"match_required":false,"match_pct":null,"summary":"The U.S. Department of the Treasury (Treasury) invite applications from State and local governments for awards under the Social Impact Partnerships to Pay for Results Act (SIPPRA). SIPPRA was signed into law on February 9, 2018 and is intended to improve the effectiveness of certain social services. The purposes of SIPPRA are 1) to improve the lives of families and individuals in need; 2) to redirect funds away from programs that, based on objective data, are ineffective, and into programs that achieve demonstrable, measurable results; 3) to ensure federal funds are used effectively on social services to produce positive outcomes for both service recipients and taxpayers; 4) to establish the use of social impact partnerships to address some of the Nation’s most pressing problems; 5) to facilitate the creation of public-private partnerships that bundle philanthropic or other private resources with existing public spending to scale up effective social interventions already being implemented; 6) to bring pay for performance to the social sector, allowing the United States to improve the impact and effectiveness of vital social services programs while redirecting inefficient or duplicative spending; and 7) to incorporate outcomes measurement and randomized controlled trials or other rigorous methodologies for assessing program impact.","eligibility":null,"applicant_types":["county","higher_ed","housing_authority","municipality","school","special_district","state","tribe"],"categories":["other"],"alns":["21.017"],"listings":[{"aln":"21.017","name":"Social Impact Partnerships to Pay for Results Act (SIPPRA)"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364003","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":1015,"slug":"usda-usdoi-joint-fire-science-program-jfsp-grants-gov-325472","name":"USDA/USDOI Joint Fire Science Program (JFSP)","number":"L20AS00080","level":"federal","state":null,"agency":"Bureau of Land Management","agency_code":"DOI-BLM","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2020-03-16","closes_at":null,"closes_text":null,"rolling":null,"amount_min":null,"amount_max":null,"match_required":false,"match_pct":null,"summary":"GRANT OPPORTUNITY FORECAST USDA/USDOI Joint Fire Science Program (JFSP) Funding Opportunity Announcement (FOA): July – September 2020 Potential Topics March 2020 Background The interagency Joint Fire Science Program (JFSP) intends to request proposals through one or more formal Funding Opportunity Announcements (FOA) beginning approximately July 2020 and remaining open 60 days. The intent of this announcement is to provide an early alert to investigators interested in the topics listed below so that they can begin considering responsive ideas with potential partners and collaborators. Investigators should recognize that final decisions regarding topic selection will not be made until Spring of 2020 and that final topic selection may differ from that posted here. One or more topics could be dropped or added, and the specific focus of individual topics may be altered. Investigators should recognize this uncertainty and not invest substantial time or resources working on proposals until the FOAs and their associated topics are formally posted. Investigators should not contact the JFSP Office or Governing Board members seeking further information on these topics. No further information will be released until the FOAs are formally posted. Primary FOA A. Relative impacts of prescribed and wildland fire Although the documented benefits of prescribed fire are numerous including habitat improvement and hazardous fuel reduction, there are drawbacks as well, such as reductions in air quality, which may impact human health. Prescribed fire is often implemented with the assumption that it will mitigate the effects of uncontrolled wildfire, because prescribed fire has been shown to reduce the intensity of subsequent wildfire under certain conditions. This is desirable because the impacts of wildfire are usually of a higher magnitude, larger in size and intensity, and pose a risk to public safety. To fully evaluate the trade-offs between prescribed fire programs and current wildfire impacts, an assessment framework is vital. Currently, there is little information on the spatial scale, frequency and spatial pattern at which prescribed fire begins to have an impact on subsequent wildfire extent, intensity and severity. As a result, JFSP is interested in proposals that improve our understanding of the relationship between prescribed fire programs and subsequent wildfire characteristics and this information is needed across a variety of vegetation types and regions. B. Types and distribution of ignitions and their relation to fire size and impacts One approach to reducing the negative impacts of wildfire to social and ecological values is to reduce the occurrence of human-caused wildfire ignitions with targeted wildfire prevention strategies. Planning and implementing effective fire prevention strategies requires detailed knowledge of the temporal and spatial distribution of different wildfire ignition sources (e.g., arson, accidental, lightning) and factors that influence whether different ignition sources lead to development of large wildfires. As a result, JFSP is interested in proposals that evaluate driving factors for the spatial and temporal distribution of ignitions and the effectiveness of different fire prevention actions as they relate to different human-caused ignitions. C. Science in support of fuel treatment performance metrics While it is relatively easy to document changes in fuels conditions following treatments at finer spatial scales, there is currently no objective framework to link fuel conditions to desired outcomes (e.g., reducing fire intensity and severity, improving fire suppression efficacy, reducing resource loss) at the landscape level. Such information is critical for developing cost-effective strategies to address the threats of wildfire. One possible strategy is to consider the evaluation of fuels treatment programs using a risk framework, where the probability and intensity of wildfire is considered in conjunction with valued resources. The development of a risk framework should assist agencies in measuring the extent and duration of risk reduction that could be achieved from a given fuel treatment. As a result, JFSP is interested in proposals that improve our understanding of the impacts of fuels treatments on fire suppression efficiency and protection of valued resources including the development of fuel treatment performance metrics at landscape scales. GRIN FOA - Graduate Research Innovation (GRIN) Award In partnership with the Association for Fire Ecology, the Joint Fire Science Program (JFSP) will likely continue the Graduate Research Innovation (GRIN) program for current master and doctoral students in the field of wildland fire and related physical, biological, and social sciences. The purpose of these awards is to enhance student exposure to the management and policy relevance of their research. As a result, these awards will enable graduate students to conduct research that will supplement and enhance the quality, scope, or applicability of their thesis or dissertation to develop information and products useful to managers and decision-makers. Proposals must describe new, unfunded work that extends ongoing or planned research that is the subject of a thesis or dissertation that has been approved by the graduate student’s advisory committee. Proposals must be directly related to the mission and goals of JFSP to be considered, and they must address management- or policy-related questions related to one or more of the following general topic areas: fuels management and fire behavior, emissions and air quality, fire effects and post-fire recovery, relative impacts of prescribed fire versus wildfire, or human dimensions of fire. Note: The specific topics eligible for GRIN proposals identified in the FOA may differ from those listed above.","eligibility":"The following types of entities are eligible to apply for award under this announcement. Failure to meet eligibility requirements will result in precluding the BLM from making an award. Types are: - State, local government, Indian Tribe; - Institution of Higher Education (IHE); - Nonprofit Organizations","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["other"],"alns":["15.232"],"listings":[{"aln":"15.232","name":"Joint Fire Science Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/325472","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":296,"slug":"alliance-for-innovation-on-maternal-health-aim-technical-assistance-center-grants-gov-363532","name":"Alliance for Innovation on Maternal Health (AIM) Technical Assistance Center","number":"HRSA-27-027","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-08-11","closes_at":"2026-11-13","closes_text":null,"rolling":null,"amount_min":0,"amount_max":3000000,"match_required":false,"match_pct":null,"summary":"The purpose of the Alliance for Innovation on Maternal Health (AIM) program is to provide technical assistance to support all 50 states, the District of Columbia (D.C.), jurisdictions, U.S. territories, tribal communities, and birthing facilities that are participating in the AIM program. AIM is a quality improvement initiative to support best practices that make birth safer, improve maternal health outcomes, and save lives.","eligibility":"Eligible applicants include any domestic public or private entity. Domestic faith based and community-based organizations, tribes, and tribal organizations are also eligible to apply","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["health"],"alns":["93.688"],"listings":[{"aln":"93.688","name":"Innovation for Maternal Health"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363532","tier":"possible","is_new":false,"is_updated":false,"days_to_close":14,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":91,"slug":"cooperative-agreement-for-affiliated-partner-with-great-lakes-northern-forest-co-grants-gov-364077","name":"Cooperative Agreement for affiliated Partner with Great Lakes-Northern Forest Cooperative Ecosystem Studies Unit","number":"G27AS00049","level":"federal","state":null,"agency":"Geological Survey","agency_code":"DOI-USGS1","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-10-14","closes_at":"2026-11-14","closes_text":"Electronically submitted applications must be submitted no later than 11:59 PM, ET, on the listed application due date","rolling":null,"amount_min":1,"amount_max":485000,"match_required":false,"match_pct":null,"summary":"The U.S. Geological Survey (USGS) is offering a funding opportunity to a CESU partner for research that supports cisco restoration priorities in Lakes Huron and Erie by hiring a structured decision-making expert and convening a structured decision-making workshop to help fisheries managers develop a restoration plan and by hiring a scientist to conduct experiments to determine what environmental conditions can lead to the highest quality cisco that can be produced in hatcheries for reintroduction.","eligibility":"This financial assistance opportunity is being issued under a Cooperative Ecosystem Studies Units (CESU) Program. CESU's are partnerships that provide research, technical assistance, and education. Eligible recipients must be a participating partner of the Great Lakes-Northern Forest Cooperative Ecosystem Studies Unit.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["other"],"alns":["15.808"],"listings":[{"aln":"15.808","name":"U.S. Geological Survey Research and Data Collection"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364077","tier":"possible","is_new":false,"is_updated":false,"days_to_close":15,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":339,"slug":"teaching-health-center-graduate-medical-education-thcgme-program-grants-gov-363324","name":"Teaching Health Center Graduate Medical Education (THCGME) Program","number":"HRSA-27-084","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-27","closes_at":"2026-11-16","closes_text":null,"rolling":null,"amount_min":160000,"amount_max":960000,"match_required":false,"match_pct":null,"summary":"The purpose of the THCGME Program is to prepare residents to provide high-quality care, particularly in rural and medically underserved communities, while developing the competencies they need to serve a wide range of populations and communities. The THCGME does this by providing funding to support the training of residents in HRSA-supported primary care residency training programs in community-based ambulatory patient care centers.","eligibility":"An eligible entity is a community-based ambulatory patient care center that operates an accredited primary care residency program, individually or through a graduate medical education (GME) consortium. Eligible primary care residency program specialties include the following: Family Medicine, Internal Medicine, Pediatrics, Internal Medicine-Pediatrics, Obstetrics/Gynecology, Psychiatry, Geriatrics, General Dentistry, and Pediatric Dentistry. The THCGME Program provides an interim payment rate of $160,000 per resident full-time equivalent (FTE) to increase the number of primary care medical and dental residency position in community-based setting.Through this opportunity, payments will be made to support new resident FTE positions for new programs at eligible community-based ambulatory patient care centers. New Teaching Health Centers (THCs) are those applicants seeking funding for residency programs that have never received payment under the HRSA THCGME Program for the applicable residency program in any previous fiscal year. Under this model, a new THC program could apply to receive an award for its initial class of FTEs under the establishment awards type, and in the future apply for a maintenance award to sustain that number of FTEs and for an expansion award to increase that number of FTEs. As described in 340H(h)(2)(B), all resident FTEs for whom THCGME support is requested must be above the program's resident FTE baseline and must not put the program above the number approved by or awaiting approval by, the relevant accrediting body.Eligible entities include: Federally qualified health centers, as defined in section 1905(l)(2)(B) of the Social Security Act [42 U.S.C. 1396d(l)(2)(B)]; Community mental health centers, as defined in section 1861(ff)(3)(B) of the Social Security Act [42 U.S.C. 1395x(ff)(3)(B)]; Rural health clinics, as defined in section 1861(aa)(2) of the Social Security Act [42 U.S.C. 1395x(aa)(2)]; Health centers operated by the Indian Health Service, an Indian tribe or tribal organization, or an urban Indian organization (as defined in section 4 of the Indian Health Care Improvement Act [25 U.S.C. 1603]); An entity receiving funds under Title X of the PHS Act; A community-based GME consortium that operates an accredited primary care residency program.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["health"],"alns":["93.530"],"listings":[{"aln":"93.530","name":"Teaching Health Center Graduate Medical Education Payment"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363324","tier":"possible","is_new":false,"is_updated":false,"days_to_close":17,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":171,"slug":"john-h-prescott-marine-mammal-rescue-assistance-grant-grants-gov-363929","name":"John H. Prescott Marine Mammal Rescue Assistance Grant","number":"NOAA-NMFS-PRPO-2026-31863","level":"federal","state":null,"agency":"DOC NOAA - ERA Production","agency_code":"DOC-DOCNOAAERA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-09-23","closes_at":"2026-12-01","closes_text":null,"rolling":null,"amount_min":1,"amount_max":150000,"match_required":true,"match_pct":null,"summary":"NOAA/National Marine Fisheries Service’s (NMFS) Marine Mammal Health and Stranding Response Program (MMHSRP) is authorized under the Marine Mammal Protection Act (MMPA) to facilitate collecting and disseminating reference data on stranded marine mammals (cetaceans and pinnipeds, excluding walrus) and the health trends of marine mammal populations in the wild. The John H. Prescott Marine Mammal Rescue Assistance Grant Program is administered by NMFS to provide federal assistance to eligible members of the U.S. National Marine Mammal Stranding Network, the U.S. National Entanglement Response Network, and their collaborators to provide for: (A) the recovery, care, or treatment of sick, injured, or entangled marine mammals; (B) responses to marine mammal stranding events that require emergency assistance; (C) the collection of data and samples from living or dead stranded marine mammals for scientific research or assessments regarding marine mammal health; (D) facility operating costs that are directly related to activities described in (A), (B), or (C); and (E) development of stranding network capacity, including training for emergency response, where facilities do not exist or are sparse. This document describes how to submit proposals for funding under this competition and how NMFS will review and determine which proposals are selected for funding.","eligibility":"All applicants must submit a Prescott Letter of Eligibility with the application in order to be considered for an award. The Prescott Letter of Eligibility states that you and/or your organization are either a Stranding or Entanglement Response Network participant in good standing, or collaborating with a Stranding or Entanglement Response Network member. New Applicants: The Letter of Eligibility must state that youare a new applicant who has never had a Prescott application reviewed during the technical reviewprocess of a previous Prescott competition.","applicant_types":["business","county","higher_ed","individual","municipality","nonprofit","special_district","state","tribe"],"categories":["other","parks"],"alns":["11.061"],"listings":[{"aln":"11.061","name":"Prescott Grant Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/363929","tier":"possible","is_new":false,"is_updated":false,"days_to_close":32,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":392,"slug":"nea-arts-and-artifacts-domestic-indemnity-program-1-fy2027-12-26-grants-gov-362982","name":"NEA Arts and Artifacts Domestic Indemnity Program 1, FY2027 (12/26)","number":"2027FCAHDOM01","level":"federal","state":null,"agency":"National Endowment for the Arts","agency_code":"NEA","connector":"g 2026-12-15","closes_text":null,"rolling":null,"amount_min":1232123,"amount_max":4964843,"match_required":true,"match_pct":null,"summary":"This forecast has been modified to update the Estimated Total Funding and the states where a funding opportunity is available. The Administration for Children and Families (ACF), Office of Head Start (OHS), announces a competitive notice of funding opportunity to provide high-quality, comprehensive services to pregnant women, low-income infants and toddlers and their families through the expansion of Early Head Start services or through Early Head Start-Child Care (EHS-CC) Partnerships. This funding opportunity advances ACF's mission to promote the economic and social well-being of children, families, and communities, and reflects OHS's commitment to expanding access to high-quality, comprehensive early childhood services that strengthen family stability and community prosperity. Approximately $9.6 million in federal funding will be awarded in multiple communities in AR, GA, and NC. These service areas are subject to change until a Notice of Funding Opportunity is published. Applicants may also email the OHS Operations Center at OHSgrants@koniag-gs.com for additional information.","eligibility":"Eligible applicants are any public or private non-profit agencies, including community-based and faith-based organizations, or for-profit agencies pursuant to section 645A(d) of the Head Start Act, 42 U.S.C. 9840A(d).Eligibility is limited to public or private non-profit organizations, including faith-based organizations or for-profit organizations that can provide Early Head Start services to children and families.Entities operating Head Start programs are eligible to operate Early Head Start programs. Individuals, sole proprietorships, and foreign entities are not eligible to apply. Faith-based and community organizations that meet the eligibility requirements are eligible for awards under this funding opportunity.","applicant_types":["b  is published. Applicants may also email the OHS Operations Center at OHSgrants@koniag-gs.com for additional information.","eligibility":"It is important to note that the eligibility requirements are different for Head Start Preschool and Early Head Start. More information will be provided in the notice of funding opportunity. Individuals, sole proprietorships, and foreign entities are not eligible to apply Faith-based and community organizations that meet the eligibility requirements are eligible for awards under this funding opportunity.","applicant_types":["business","county","higher_ed","housing_authority","municipality","nonprofit","school","state","tribe"],"categories":["other"],"alns":["93.600"],"listings":[{"aln":"93.600","name":"Head Start"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363791","tier":"possible","is_new":false,"is_updated":false,"days_to_close":46,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":3950,"slug":"public-humanities-projects-grants-gov-364098","name":"Public Humanities Projects","number":"20261209-GE-GI-BP-BR-GGX","level":"federal","state":null,"agency":"National Endowment for the Humanities","agency_code":"NEH","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-10-16","closes_at":"2026-12-16","closes_text":null,"rolling":null,"amount_min":1,"amount_max":2000000,"match_required":false,"match_pct":null,"summary":"The National Endowment for the Humanities (NEH) Division of Lifelong Learning is accepting applications for the Public Humanities Projects program. The purpose of this program is to support projects that bring the ideas and insights of the humanities to life in three areas: (1) exhibitions, (2) historic site interpretations, and (3) public lectures and discussions. For 2027, NEH welcomes applications that promote deeper public understanding of the following topics: Western civilization and America’s place in it; great works of literature, history, philosophy, and theology and their relevance to contemporary questions; the 250th anniversary of the American Revolution; civic education; civil discourse; cultural literacy, and the practice of close reading. Public Lectures and Discussion Forums must address one of these interest areas.","eligibility":null,"applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["45.041"],"listings":[{"aln":"45.041","name":"National Endowment for the Humanities: Public Humanities Projects"}],"first_seen":"2026-10-17T13:00:54Z","last_changed":"2026-10-17T13:00:54Z","source_url":"https://www.grants.gov/search-results-detail/364098","tier":"possible","is_new":false,"is_updated":false,"days_to_close":47,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":316,"slug":"fiscal-year-fy-2027-service-area-competition-sac-grants-gov-363419","name":"Fiscal Year (FY) 2027 Service Area Competition (SAC)","number":"HRSA-27-006","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-31","closes_at":"2026-12-30","closes_text":null,"rolling":null,"amount_min":1215700,"amount_max":19182000,"match_required":false,"match_pct":null,"summary":"The FY 2027 Health Center Program Service Area Competition (SAC) funding improves the health of medically underserved communities and populations by providing grants to support the delivery of comprehensive, high-quality preventive and primary health care services in the United States and its territories. For each SAC Notice of Funding Opportunity (NOFO), service areas available for competition are announced in the Service Area Announcement Table (SAAT). Throughout the year, we may announce additional service areas in a Service Area Competition-Additional Area (SAC-AA) if an awarded health center cannot continue to provide services in the funded service area.","eligibility":null,"applicant_types":["county","housing_authority","municipality","nonprofit","special_district","state","tribe"],"categories":["health"],"alns":["93.224"],"listings":[{"aln":"93.224","name":"Health Center Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363419","tier":"possible","is_new":false,"is_updated":false,"days_to_close":61,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":317,"slug":"fiscal-year-fy-service-area-competition-sac-grants-gov-363420","name":"Fiscal Year (FY) Service Area Competition (SAC)","number":"HRSA-27-007","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-31","closes_at":"2026-12-30","closes_text":null,"rolling":null,"amount_min":398400,"amount_max":22024900,"match_required":false,"match_pct":null,"summary":"The FY 2027 Health Center Program Service Area Competition (SAC) funding improves the health of medically underserved communities and populations by providing grants to support the delivery of comprehensive, high-quality preventive and primary health care services in the United States and its territories. For each SAC Notice of Funding Opportunity (NOFO), service areas available for competition are announced in the Service Area Announcement Table (SAAT). Throughout the year, we may announce additional service areas in a Service Area Competition-Additional Area (SAC-AA) if an awarded health center cannot continue to provide services in the funded service area.","eligibility":null,"applicant_types":["county","housing_authority","municipality","nonprofit","special_district","state","tribe"],"categories":["health"],"alns":["93.224"],"listings":[{"aln":"93.224","name":"Health Center Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363420","tier":"possible","is_new":false,"is_updated":false,"days_to_close":61,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":250,"slug":"sefsc-bluefin-tuna-research-program-grants-gov-363729","name":"SEFSC Bluefin Tuna Research Program","number":"NOAA-NMFS-SE-2027-33642","level":"federal","state":null,"agency":"DOC NOAA - ERA Production","agency_code":"DOC-DOCNOAAERA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-08-27","closes_at":"2026-12-31","closes_text":null,"rolling":null,"amount_min":25000,"amount_max":300000,"match_required":false,"match_pct":null,"summary":"The objective of the program is to provide a basis for advancing science-based fisheries management for Atlantic bluefin tuna. Such advancement will depend upon improvements in understanding of the fisheries, total abundance, and biology of bluefin tuna, especially regarding the effects of mixing and movement between the eastern and western Atlantic populations. Contracting Parties to the International Commission for the Conservation of Atlantic Tunas (ICCAT), of which the US is one, and other partners have embarked upon a multi-year research program on bluefin tuna as a step toward improving ICCAT's science-based management of Bluefin fisheries. Research sponsored under this funding opportunity represents a contribution to this partnership. Proposals that demonstrate collaborations with the ICCAT Atlantic Bluefin Tuna Research Program and other ICCAT partners are strongly encouraged.","eligibility":"Eligible applicants may be institutions of higher education, nonprofits, commercial organizations, individuals, and state, local, and Indian Tribal governments. Federal agencies or institutions are not eligible. Foreign governments, organizations under the jurisdiction of foreign governments, and international organizations are excluded for purposes of this solicitation since the objective of the BTRP is to optimize research and development benefits from U.S. marine fishery resources.","applicant_types":["business","county","higher_ed","individual","municipality","nonprofit","special_district","state","tribe"],"categories":["other","water"],"alns":["11.058"],"listings":[{"aln":"11.058","name":"Bluefin Tuna Research Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/363729","tier":"possible","is_new":false,"is_updated":false,"days_to_close":62,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":141,"slug":"national-parks-business-plan-internship-grants-gov-363985","name":"National Parks Business Plan Internship","number":"P26AS00055","level":"federal","state":null,"agency":"National Park Service","agency_code":"DOI-NPS","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-09-28","closes_at":"2027-01-04","closes_text":"Electronically submitted applications must be submitted no later than 11:59 PM, ET, on the listed application due date.","rolling":null,"amount_min":0,"amount_max":1700000,"match_required":false,"match_pct":null,"summary":"The National Parks Business Plan Internship (BPI) goal is to jointly administer a graduate-level internship program focused on improving the business management and operational health of our national parks and NPS programs. The internship program should: Provide students with in-depth training on NPS business management and operations, exposure to park and/or program level operations, and the opportunity to conduct substantive analysis and evaluation which lead to recommendations that improve strategic planning and management decision-making. Encourage highly qualified graduate students from professional disciplines underrepresented in the NPS workforce (Master of Business Administration, Master of Public Policy, Master of Environmental Management, and similar degree programs) to explore federal careers with conservation and land management agencies. Cultivate a lifelong stewardship ethic for public lands in graduate students from top universities. Eligible recipients are State, local and tribal governments, other public entities, educational institutions, and private nonprofit organizations.","eligibility":"In accordance with 54 USC §101702(a) [Formerly 16 U.S.C. 1g], the eligible applicants are State, local and tribal governments, other public entities, educational institutions, and private nonprofit organizations for the public purpose of carrying out National Park Service programs pursuant to 31 U.S.C. 6305.Foreign Entities or Projects: This program does not provide funding to foreign entities or for projects conducted outside the United States.Excluded Parties: NPS conducts a review of the SAM.gov Exclusions database for all applicant entities and their key project personnel prior to award. The NPS cannot award funds to entities or their key project personnel identified in the SAM.gov Exclusions database as ineligible, prohibited/restricted, or otherwise excluded from receiving Federal contracts, certain subcontracts, and certain Federal assistance and benefits, as their ineligibility condition applies to this Federal program.","applicant_types":["county","higher_ed","municipality","nonprofit","school","special_district","state","tribe"],"categories":["other"],"alns":["15.954"],"listings":[{"aln":"15.954","name":"National Park Service Conservation, Protection, Outreach, and Education"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363985","tier":"possible","is_new":false,"is_updated":false,"days_to_close":66,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":230,"slug":"fiscal-year-fy-2027-service-area-competition-sac-grants-gov-363777","name":"Fiscal Year (FY) 2027 Service Area Competition (SAC)","number":"HRSA-27-009","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-09-01","closes_at":"2027-01-08","closes_text":null,"rolling":null,"amount_min":650000,"amount_max":1500231,"match_required":false,"match_pct":null,"summary":"The FY 2027 Health Center Program Service Area Competition (SAC) funding improves the health of medically underserved communities and populations by providing grants to support the delivery of comprehensive, high-quality preventive and primary health care services in the United States and its territories. For each SAC Notice of Funding Opportunity (NOFO), service areas available for competition are announced in the Service Area Announcement Table (SAAT). Throughout the year, we may announce additional service areas in a Service Area Competition-Additional Area (SAC-AA) if an awarded health center cannot continue to provide services in the funded service area.","eligibility":"\"Domestic\" means the 50 states, the District of Columbia, the Commonwealth of Puerto Rico, the Northern Mariana Islands, American Samoa, Guam, the U.S. Virgin Islands, the Federated States of Micronesia, the Republic of the Marshall Islands, and the Republic of Palau.","applicant_types":["county","housing_authority","municipality","nonprofit","special_district","state","tribe"],"categories":["health"],"alns":["93.224"],"listings":[{"aln":"93.224","name":"Health Center Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363777","tier":"possible","is_new":false,"is_updated":false,"days_to_close":70,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":315,"slug":"fiscal-year-fy-2027-service-area-competition-sac-grants-gov-363421","name":"Fiscal Year (FY) 2027 Service Area Competition (SAC)","number":"HRSA-27-008","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-31","closes_at":"2027-01-08","closes_text":null,"rolling":null,"amount_min":567000,"amount_max":15335500,"match_required":false,"match_pct":null,"summary":"The FY 2027 Health Center Program Service Area Competition (SAC) funding improves the health of medically underserved communities and populations by providing grants to support the delivery of comprehensive, high-quality preventive and primary health care services in the United States and its territories. For each SAC Notice of Funding Opportunity (NOFO), service areas available for competition are announced in the Service Area Announcement Table (SAAT). Throughout the year, we may announce additional service areas in a Service Area Competition-Additional Area (SAC-AA) if an awarded health center cannot continue to provide services in the funded service area.","eligibility":null,"applicant_types":["county","housing_authority","municipality","nonprofit","special_district","state","tribe"],"categories":["health"],"alns":["93.224"],"listings":[{"aln":"93.224","name":"Health Center Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363421","tier":"possible","is_new":false,"is_updated":false,"days_to_close":70,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":541,"slug":"title-x-family-planning-services-grants-grants-gov-361754","name":"Title X Family Planning Services Grants","number":"PA-FPH-27-001","level":"federal","state":null,"agency":"Office of the Assistant Secretary for Health","agency_code":"HHS-OPHS","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-04-03","closes_at":"2027-01-11","closes_text":"Applications must be submitted electronically no later than 6:00 pm Eastern Time.","rolling":null,"amount_min":200000,"amount_max":22000000,"match_required":false,"match_pct":null,"summary":"The Office of Population Affairs (OPA) announces the anticipated availability of funds for Fiscal Year (FY) 2027 grants under the authority of Title X of the Public Health Service Act, Section 1001 (42 U.S.C. §300).This notice solicits applications for projects to provide Title X services throughout the 50 United States, District of Columbia, Guam, the Commonwealth of Puerto Rico, the Northern Mariana Islands, the U.S. Virgin Islands, American Samoa, the U.S. Outlaying Islands (Midway, Wake, et al.), the Republic of the Marshall Islands, the Federated State of Micronesia, and the Republic of Palau (hereafter, States). OPA intends to make available approximately up to $257 million for up to 90 grant awards for a period of up to five (5) years. The actual amount available will not be determined until enactment of the FY 2027 federal budget.OPA\"s Title X Family Planning Program funds \"voluntary family planning projects [that] offer a broad range of acceptable and effective family planning methods and services (including natural family planning methods, infertility services, and services for adolescents).\" (Title X of the Public Health Service Act, 42 U.S.C. 300 et seq., available at https://opa.hhs.gov/sites/default/files/2020-07/title-x-statute-attachment-a_0.pdf). The Title X Program is implemented through competitively awarded grants to a diverse network of public and private nonprofit entities. The program helps millions of low-income and uninsured Americans develop health literacy and access family planning and related health services, empowering individuals and families to make informed decisions and navigate chronic health conditions and pregnancy with confidence. By offering counseling and education to improve individuals\" optimal health outcomes, Title X promotes the level of health literacy necessary to support informed consent across the reproductive lifespan. For example, endometriosis often goes undiagnosed for years because symptoms such as severe menstrual pain or irregular bleeding are frequently normalized or minimized. Body literacy counseling helps patients recognize that these experiences are not \"normal\" features of womanhood, but potential indicators of an underlying condition, prompting earlier discussion with providers, timely diagnosis, appropriate treatment, and improved long-term reproductive and overall health outcomes.Likewise, foundational knowledge of reproductive physiology enables patients and couples to recognize early signs of dysfunction, seek timely evaluation, and participate meaningfully in care decisions. Persistent gaps in reproductive knowledge highlight the need for such education. For example, a survey conducted for OPA in 2020 found that only 50% of women and 38% of men know that a woman\"s ovaries do not keep producing new eggs until menopause (https://opa.hhs.gov/sites/default/files/2021-01/fertility-knowledge-survey-findings-exec-summary-2020.pdf). By supporting body literacy education alongside evidence-based evaluation and treatment of chronic disease, Title X services can help patients move beyond symptom-focused care toward informed, preventive, and restorative approaches to reproductive health.These efforts align with HHS\"s focus on addressing the root causes of chronic illnesses by targeting conditions that affect reproductive health and fertility. By promoting strategies that support education and counseling on reproductive health goals, reduce chronic disease, and assist individuals seeking to achieve healthy pregnancies, the Title X Program strengthens American families, individuals, and communities.This notice solicits applications from public and private nonprofit entities to establish and operate voluntary Title X projects. These projects include a broad range of effective and acceptable services, including pregnancy testing and counseling, basic infertility services, sexually transmitted infection (STI) services (such as HIV prevention education, counseling, testing, and referral), health literacy, reproductive goals counseling to increase optimal health outcomes, and other preconception health services. Title X services also help address and provide referrals for health conditions that affect fertility, including endometriosis, polycystic ovary syndrome (PCOS), and uterine fibroids in women, as well as low sperm count, low sperm motility, low testosterone, and erectile dysfunction in men. OPA seeks a broad competition for Title X grant awards and are interested in innovative strategies to address chronic disease; reduce overmedicalization by strengthening approaches focused on underlying behavioral and lifestyle factors of health and evidence-based practices such as fertility-awareness based methods; promote health and body literacy; advance reproductive goals counseling for all clients; and support family formation.All activities funded under this announcement must be in compliance with the requirements of the Title X statute, legislative mandates, and regulations. Copies of the Title X statute, regulations, and legislative mandates may be downloaded from the OPA website at https://opa.hhs.gov/grant-programs/title- x-service-grants/title-x-statutes-regulations-and-legislative-mandates.","eligibility":"Any public or private nonprofit entity is eligible to apply.","applicant_types":["county","higher_ed","housing_authority","municipality","nonprofit","school","special_district","state","tribe"],"categories":["health"],"alns":["93.217"],"listings":[{"aln":"93.217","name":"Family Planning Services"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/361754","tier":"possible","is_new":false,"is_updated":false,"days_to_close":73,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":129,"slug":"national-digital-newspaper-program-grants-gov-364030","name":"National Digital Newspaper Program","number":"20270113-PJ","level":"federal","state":null,"agency":"National Endowment for the Humanities","agency_code":"NEH","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-10-06","closes_at":"2027-01-13","closes_text":null,"rolling":null,"amount_min":1,"amount_max":325000,"match_required":false,"match_pct":null,"summary":"The National Endowment for the Humanities (NEH) Division of Collections and Infrastructure is accepting applications for the National Digital Newspaper Program (NDNP). The purpose of this program is to create a national digital resource of historically significant newspapers published between 1690 and 1963, from all 56 states and U.S. jurisdictions. The Library of Congress (LOC) maintains this freely accessible, searchable online database.","eligibility":"See C. Eligibility in the Notice of Funding Opportunity for more information.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["45.042"],"listings":[{"aln":"45.042","name":"National Endowment for the Humanities: National Digital Newspaper Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/364030","tier":"possible","is_new":false,"is_updated":false,"days_to_close":75,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":366,"slug l devices and other conservation engineering changes to minimize bycatch and reduce post-release mortality of non-target species in our nation’s fisheries. Bycatch reduction is a priority for the National Marine Fisheries Service (NMFS), as outlined in the NMFS National Bycatch Reduction Strategy (https://www.fisheries.noaa.gov/national/bycatch/national-bycatchreduction-strategy). Fisheries bycatch can contribute to overfishing, population declines for threatened and endangered species, and can result in commercial fishery closures. This Program seeks to support the development and testing of fishing gears and approaches that can be applied in commercial and recreational fisheries to reduce bycatch and post-release mortality and address the MSA requirements to minimize bycatch and habitat impacts.","eligibility":"Eligible applicants are individuals, institutions of higher education, other nonprofits, for-profit organizations, and state, local, U.S. territorial, Alaska Native, and Indian tribal governments. Federal agencies or instrumentalities are not eligible to receive Federal assistance under this notice. If an eligible applicant has questions regarding this funding opportunity, they should contact: Justin Pearce Office of Sustainable Fisheries 1315 East-West Highway Silver Spring, MD 20910 301-427-8521 NMFS.HQ.BREP@noaa.gov","applicant_types":["business","county","higher_ed","individual","municipality","nonprofit","special_district","state","tribe"],"categories":["other","parks"],"alns":["11.452"],"listings":[{"aln":"11.452","name":"Bycatch Reduction Engineering Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/363692","tier":"possible","is_new":false,"is_updated":false,"days_to_close":84,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":312,"slug":"fiscal-year-fy-2027-state-and-regional-primary-care-association-pca-cooperative--grants-gov-363450","name":"Fiscal Year (FY) 2027 State and Regional Primary Care Association (PCA) Cooperative Agreements","number":"HRSA-27-014","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-08-03","closes_at":"2027-01-25","closes_text":null,"rolling":null,"amount_min":790000,"amount_max":4900000,"match_required":false,"match_pct":null,"summary":"The purpose of the Fiscal Year (FY) 2027 State and Regional Primary Care Association (PCA) program is to develop and deliver technical assistance (TA) that supports existing and potential Health Center Program award recipients and look-alikes (LALs), hereafter referred to as health centers, both directly and collaboratively with other HRSA-funded TA programs. PCAs will improve the health of medically vulnerable individuals and communities by: Increasing access to high-quality preventive and primary health care services. Improving chronic disease prevention and management to enhance the overall health of communities. Recruiting, retaining, and training a health center workforce. Preparing for, responding to, and recovering from emergent health events. Implementing payer strategies, including value-based care delivery, to ensure high functioning, financially sustainable health centers. Accelerating data-informed improvements to improve operations and clinical quality.","eligibility":"Applications can be from the 50 states, the District of Columbia, the Commonwealth of Puerto Rico, the Northern Mariana Islands, American Samoa, Guam, the U.S. Virgin Islands, the Federated States of Micronesia, the Republic of the Marshall Islands, or the Republic of Palau.New organizations and organizations currently receiving funding as PCAs under Section 330(l) may submit applications. Individuals are not eligible applicants under this NOFO.","applicant_typ ails/pca/1","tier":"possible","is_new":false,"is_updated":false,"days_to_close":95,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":322,"slug":"ryan-white-hiv-aids-program-part-d-women-infants-children-and-youth-grant-supple-grants-gov-363415","name":"Ryan White HIV/AIDS Program Part D - Women, Infants, Children and Youth Grant Supplemental Funding","number":"HRSA-27-068","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-07-31","closes_at":"2027-02-02","closes_text":null,"rolling":null,"amount_min":0,"amount_max":200000,"match_required":false,"match_pct":null,"summary":"The purpose of this supplemental funding is to strengthen organizational infrastructure and increase capacity to develop, enhance, or expand access to high quality family-centered HIV care services. The activities fall under two categories: HIV Care Innovation and Infrastructure Development.","eligibility":"This competition is open to current RWHAP Part D grant recipients and new, eligible applicant organizations proposing to provide RWHAP Part D family-centered care in outpatient or ambulatory care settings to low income women, infants, children, and youth with HIV in the entire service area as identified in the FY 2027 NOFO.As identified in section 2671 of the Public Health Service (PHS) Act, eligible applicants include public and nonprofit private entities (including a health facility operated by or pursuant to a contract with the Indian Health Service) that provide family-centered care involving outpatient or ambulatory care for WICY with HIV.","applicant_types":["business","county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["health"],"alns":["93.153"],"listings":[{"aln":"93.153","name":"Coordinated Services and Access to Research for Women, Infants, Children, and Youth"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363415","tier":"possible","is_new":false,"is_updated":false,"days_to_close":95,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":195,"slug":"cancer-prevention-and-control-programs-for-state-territorial-and-tribal-organiza-grants-gov-363855","name":"Cancer Prevention and Control Programs for State, Territorial, and Tribal Organizations","number":"CDC-RFA-DP-27-0023","level":"federal","state":null,"agency":"Centers for Disease Control - NCCDPHP","agency_code":"HHS-CDC-NCCDPHP","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-09-14","closes_at":"2027-02-05","closes_text":null,"rolling":null,"amount_min":0,"amount_max":0,"match_required":true,"match_pct":null,"summary":"Since 1990, CDC's Division of Cancer Prevention and Control (DCPC) has been working with national organizations, state, territory, freely associated state, and tribal health agencies, and other key groups to develop, implement, and promote effective strategies for preventing and controlling cancer. DCPC's overall mission is to work toward having all people free of cancer while improving health outcomes through prevention, screening, and ongoing care for cancer survivors. DCPC supports comprehensive cancer control, a philosophical approach that brings together partners and other organizations to collectively address a community's cancer burden in a much more impactful way than any one organization could accomplish alone. This NOFO will fund eligible applicants to facilitate collaborative planning and implementation of evidence-based cancer surveillance, prevention, and control strategies in communities that improve the provision of clinical preventive services, and cancer survivorship. Ultimately, a successful implementation of the work described in this NOFO will demonstrate that by the three programs working together through partnerships, coordination of resources and efforts, consistent communication, and community involvement, we will come that much closer to the division's mission of \"All People Free of Cancer.\" This program takes a comprehensive, coordinated approach to achieve these goals. It supports breast and cervical cancer screening and diagnostic services, cancer control plan implementation by coalitions, and surveillance programs to monitor and report cancer burden. These goals will be accomplished by funding three national programs: Program 1: National Breast and Cervical Cancer Early Detection Program (NBCCEDP) supports clinical services for women with low incomes who do not have adequate insurance and implementation of evidence-based interventions in the clinics that serve them. Component A: Supports breast and cervical cancer screening and diagnostic follow-up for women with low incomes who do not have adequate insurance. Component B: (Optional) Supports implementation of evidence-based interventions (EBIs) shown to increase breast and cervical cancer screening. Program 2: National Comprehensive Cancer Control Program (NCCCP) supports cancer coalition efforts that use their individual and collective resources to plan and implement evidence-based strategies as described in jurisdiction-wide cancer plans. Program 3: National Program of Cancer Registries (NPCR) supports the implementation of a population-based central cancer registry program.","eligibility":"The eligibility above pertains only to Program 2. Program 1: The National Breast and Cervical Cancer Early Detection Program (NBCCEDP) Limited Eligibility: Funds will be awarded to state health departments and the District of Columbia; US Territories and Freely Associated States, Federally Recognized American Indian Tribes, Tribal Organizations, Alaska Native Organizations, and Urban Indian Organizations, or their Bona Fide Agents. Eligibility for this program is limited by statute. See https://www.govinfo.gov/content/pkg/STATUTE-104/pdf/STATUTE-104-Pg409.pdf Program 3: The National Program of Cancer Registries (NPCR) Limited Eligibility: Eligibility for this program is limited by statute to State governments (includes the District of Columbia). US territories and freely associated states. Bona fide agents applying on behalf of state or territorial entities, including government organizations. See Cancer Registries Amendment Act Bona fide agents must submit documentation that demonstrates their arrangement with the eligible applicant. Please note the following definitions: State (includes the District of Columbia), Territorial governments in the Commonwealth of Puerto Rico, the Virgin Islands, the Commonwealth of the Northern Marianna Islands, American Samoa, Guam, the Federated States of Micronesia, the Republic of the Marshall Islands, and the Republic of Palau. American Indian or Alaska Native tribal governments (federally recognized or state-recognized), American Indian or Alaska native tribal designated organizations. or their Bona Fide Agents.","applicant_types":["county","higher_ed","municipality","nonprofit","state","tribe"],"categories":["health"],"alns":["93.898"],"listings":[{"aln":"93.898","name":"Cancer Prevention and Control Programs for State, Territorial and Tribal Organizations"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363855","tier":"possible","is_new":false,"is_updated":false,"days_to_close":98,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4454,"slug":"alzheimer-s-disease-programs-initiative-adpi-states-and-community-grants-grants-gov-364113","name":"Alzheimer's Disease Programs Initiative (ADPI) - States and Community Grants","number":"HHS-2027-ACL-AOA-ADPI-0008","level":"federal","state":null,"agency":"Administration for Community Living","agency_code":"HHS-ACL","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-10-19","closes_at":"2027-03-03","closes_text":null,"rolling":null,"amount_min":850000,"amount_max":1000000,"match_required":true,"match_pct":null,"summary":"Cooperative agreements under the Alzheimer's Disease Programs Initiative (ADPI): State and Community Grants Notice of Funding Opportunity (NOFO), are intended to support and promote the development and expansion of dementia-capable home and community-based service (HCBS) systems in States and Communities. There are two application options contained in this single NOFO: Grants to States (Option A) and Grants to Communities (Option B). No entity is eligible to apply for both State and Community options and no entity is eligible to hold more than one ADPI State or Community grant at a time. The dementia-capable systems resulting from program activities under either option are expected to provide quality, strengths-based services and supports that help people living with dementia and their caregivers remain independent and safe in their communities. OPTION A: Grants to States Applicants for Option A (36 month cooperative agreements) are the governmental entities within states and territories designated as the state agency for dementia-capability and that have working relationships with their state agencies that enable creating and sustaining a dementia- capable HCBS System. Option A has two required objectives, the first of which is the creation, expansion and sustainability of a dementia-capable state HCBS system that includes Single Entry Point/No Wrong Door (SEP/NWD) access for people living with dementia (PLWD) and their family caregivers. The second objective is to ensure access to a comprehensive, sustainable set of quality state HCBS that are dementia-capable and provide innovative services to PLWD and their caregivers. States and territories eligible for Option A are those that do not have active ACL ADPI State dementia-capability grants. All states without active grants are eligible to apply, however those states that have not benefited from ADPI/ADI-SSS/ADSSP grants since before 2014 will be given priority consideration in the post-review decision-making process. OPTION B: Grants to Communities Cooperative agreements under Option B (36 month cooperative agreements) are available to private and/or public community-based organizations (CBO) that are able to: 1) demonstrate their operation within an existing dementia-capable HCBS system dedicated to the population that they serve; and 2) articulate opportunities and additional services in the targeted gap areas that would expand and strengthen the existing system within which they are currently operating. Option B cooperative agreements are designed to support existing community-based HCBS providers in expanding the systems within which they currently operate by addressing three specific service gaps in dementia-capable HCBS for people living with Alzheimer's disease and related dementias (ADRD) and their caregivers. Option B applicants must address each of the following three gap areas: 1) Provision of effective supportive services to persons living alone with ADRD in the community; 2) Improvement of the quality and effectiveness of programs and services dedicated to individuals aging with intellectual and developmental disabilities with ADRD or those at high risk of developing ADRD; and 3) Delivery of behavioral symptom management training and expert consultations for family caregivers. Community-based organizations are only eligible to hold one ADPI grant at a time. All existing community-based organizations that are dementia-capable home and community-based service providers, without active ADPI grants, are eligible to apply. Eligible HCBS providers that have not benefited from ADI-SSS and ADPI grant programs since before 2014 will be given priority consideration in the post-review decision-making process.","eligibility":null,"applicant_types":["county","higher_ed","housing_authority","municipality","nonprofit","school","special_district","state","tribe"],"categories":["other"],"alns":["93.470"],"listings":[{"aln":"93.470","name":"Alzheimer’s Disease Program Initiative (ADPI)"}],"first_seen":"2026-10-19T16:39:43Z","last_changed":"2026-10-19T16:39:43Z","source_url":"https://www.grants.gov/search-results-detail/364113","tier":"possible","is_new":false,"is_updated":false,"days_to_close":124,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":391,"slug":"nea-arts-and-artifacts-international-indemnity-program-2-fy2027-3-27-grants-gov-362983","name":"NEA Arts and Artifacts International Indemnity Program 2, FY2027 (3/27)","number":"2027FCAH02","level":"federal","state":null,"agency":"National Endowment for the Arts","agency_code":"NEA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-06-26","closes_at":"2027-03-08","closes_text":null,"rolling":null,"amount_min":10000,"amount_max":100000,"match_required":true,"match_pct":null,"summary":"See the application guidelines and instructions at arts.gov for more information.","eligibility":null,"applicant_types":["county","higher_ed","municipality","nonprofit","school","special_district","state","tribe"],"categories":["other"],"alns":["45.201"],"listings":[{"aln":"45.201","name":"Arts and Artifacts Indemnity"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/362983","tier":"possible","is_new":false,"is_updated":false,"days_to_close":129,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4470,"slug":"strengthening-the-direct-care-workforce-a-technical-assistance-and-capacity-buil-grants-gov-364153","name":"Strengthening the Direct Care Workforce: A Technical Assistance and Capacity Bu  the AIM Capacity program is to strengthen state, jurisdiction, and Tribal capacity to implement, expand, and sustain AIM PSBs and associated resources across the United States. AIM PSBs promote evidence-informed maternal safety practices to improve the quality and safety of maternity care and reduce preventable maternal mortality and severe maternal morbidity.","eligibility":"Applicants can apply if you are capable of carrying out data-driven maternal safety and quality improvement initiatives in the areas of obstetrics and gynecology or maternal health.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["health"],"alns":["93.688"],"listings":[{"aln":"93.688","name":"Innovation for Maternal Health"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363407","tier":"possible","is_new":false,"is_updated":false,"days_to_close":138,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":159,"slug":"deployed-warfighter-protection-fy27-grants-gov-363946","name":"Deployed Warfighter Protection FY27","number":"AFPMB-BAA-27-01","level":"federal","state":null,"agency":"ACC-APG-Detrick","agency_code":"DOD-AMC-ACCAPGD","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-09-24","closes_at":"2027-03-17","closes_text":null,"rolling":null,"amount_min":20000,"amount_max":1100000,"match_required":false,"match_pct":null,"summary":"The DWFP Program’s mission is to protect deployed military personnel from arthropod vectors of medically relevant disease pathogens, including (but not limited to) arthropod disease vectors of tick-borne pathogens and mosquito-borne arboviruses, as well as nuisance biting arthropods and emerging arthropod threats such as the New World Screwworm fly. The DWFP Program seeks to fund original and innovative research that supports the Advanced Technology Development of new insecticides, or improved formulations of existing insecticides for vector control, new technology or enhanced modalities of personal protection from biting arthropods, or improved efficacy and sustainability of equipment for application of pesticides.","eligibility":null,"applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["other"],"alns":["12.355"],"listings":[{"aln":"12.355","name":"Pest Management and Vector Control Research"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/363946","tier":"possible","is_new":false,"is_updated":false,"days_to_close":138,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":320,"slug":"maternal-and-child-health-encounters-networks-mchek-grants-gov-363412","name":"Maternal and Child Health Encounters Networks (MCHEK)","number":"HRSA-27-038","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-07-31","closes_at":"2027-03-18","closes_text":null,"rolling":null,"amount_min":1000000,"amount_max":1000000,"match_required":false,"match_pct":null,"summary":"The purpose of this program is to improve maternal and infant outcomes by preventing contact with harmful materials before, during, and after pregnancy. This program aims to improve maternal and infant health outcomes by preventing harmful exposures before, during, and after pregnancy. It supports a national expert-staffed call center that provides timely, evidence-based information and personalized counseling on medications, nutrition, foods, household products, and environmental exposures. By translating complex scientific evidence into clear, accessible guidance and leveraging emerging technologies, including artificial intelligence (AI), the program empowers women, families, and healthcare providers to make informed decisions that promote healthy pregnancies and improve maternal and infant outcomes.","eligibility":"Any domestic public or private entity, including an Indian tribe or tribal organization (as those terms are defined at 25 U.S.C. § 450b) is eligible to apply.","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["health"],"alns":["93.110"],"listings":[{"aln":"93.110","name":"Special Projects of Regional and National Significance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363412","tier":"possible","is_new":false,"is_updated":false,"days_to_close":139,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":4458,"slug":"no-wrong-door-system-modernization-connecting-people-to-services-grants-gov-364121","name":"No Wrong Door System Modernization: Connecting People to Services","number":"HHS-2027-ACL-CIP-NWGV-0005","level":"federal","state":null,"agency":"Administration for Community Living","agency_code":"HHS-ACL","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-10-19","closes_at":"2027-03-18","closes_text":null,"rolling":null,"amount_min":450000,"amount_max":450000,"match_required":false,"match_pct":null,"summary":"The purpose of this funding is to support states and territories in advancing and modernizing their No Wrong Door (NWD) systems through innovative approaches that improve access to services and supports that enable community living. This anticipated opportunity supports ACL's strategic priority to connect people to services by strengthening statewide systems that allow older adults, people with disabilities, family caregivers, and others to easily identify, access, and navigate the services and supports that best meet their needs. No Wrong Door systems play a critical role in providing person-centered access to information, counseling, eligibility support, and coordinated connections to public and private services. As the demand for services supports continues to grow, states have opportunities to strengthen these systems through innovation, strategic partnerships, and emerging technologies including artifical intelligence that improve access, coordination, and the consumer experience while maintaining person-centered practices. A key objective of this anticipated funding opportunity is to build evidence regarding effective approaches for improving access to services.","eligibility":"Foreign entities are not eligible to compete for, or receive, awards made under this announcement. Faith-based and community organizations that meet the eligibility requirements are eligible to receive awards under this funding opportunity announcement.","applicant_types":["county","higher_ed","housing_authority","municipality","nonprofit","school","special_district","state","tribe"],"categories":["health"],"alns":["93.048"],"listings":[{"aln":"93.048","name":"Special Programs for the Aging, Title IV, and Title II, Discretionary Projects"}],"first_seen":"2026-10-19T16:39:43Z","last_changed":"2026-10-19T16:39:43Z","source_url":"https://www.grants.gov/search-results-detail/364121","tier":"possible","is_new":false,"is_updated":false,"days_to_close":139,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":292,"slug":"rural-health-network-development-planning-program-grants-gov-363581","name":"Rural Health Network Development Planning Program","number":"HRSA-27-048","level":"federal","state":null,"agency":"Health Resources and Services Administration","agency_code":"HHS-HRSA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2026-08-13","closes_at":"2027-03-23","closes_text":null,"rolling":null,"amount_min":0,"amount_max":100000,"match_required":false,"match_pct":null,"summary":"The Rural Health Network Development Planning Program supports the planning and development of rural integrated health care networks with specific focus on collaboration of entities to establish or improve local capacity and care coordination in underserved communities. Specifically, the program uses the concept of developing networks as a strategy for linking rural health care network participants together to achieve greater collective capacity to overcome local challenges, expand access and improve the quality of care in the rural communities these organizations serve. The program helps network participants work together on three legislative aims: • Achieve efficiencies. • Expand access to, coordinate, and improve the quality of basic health care services and associated health outcomes. • Strengthen the rural health care system as a whole. The intent is that rural health networks will do the following: • Expand access to care. • Increase the use of health information technology. • Explore alternative health care delivery models. • Continue to achieve quality health care across the continuum of care.","eligibility":"All domestic public or private, non-profit or for-profit entities including domestic faith-based and community-based organizations, tribes and tribal organizations. The applicant organization may be located in a rural or urban area, but must have demonstrated experience serving, or capacity to serve, rural underserved populations.","applicant_types":["business","county","higher_ed","municipality","nonprofit","school","special_district","state","tribe"],"categories":["health"],"alns":["93.912"],"listings":[{"aln":"93
