ing to housing needs following natural or man-made disasters. The program aims to ensure that communities impacted by emergencies have access to safe, temporary housing and critical stabilization services, fostering recovery and long-term resilience.","eligibility":"Applicant type: All units of local government including counties, townships, towns, boroughs, cities, and authorities.","applicant_types":["county","municipality"],"categories":["housing"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/38","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3349,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4290,"slug":"municipal-assistance-program-shared-services-and-planning-map-ssp-pa-grants-dced/52","name":"Municipal Assistance Program - Shared Services and Planning (MAP-SSP)","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2024-01-01","closes_at":"2035-12-31","closes_text":"Bi-Annual","rolling":null,"amount_min":null,"amount_max":null,"match_required":null,"match_pct":null,"summary":"Provides funding to assist local governments to plan for and efficiently implement a variety of services and improvements, and soundly manage development with an emphasis on intergovernmental approaches. Funding is available for two groups of activities: shared services, and community planning.","eligibility":"Eligibility: Shared service activities require two or more participating municipalities. Some projects are open to COGs and other intergovernmental organizations where duly authorized by participating municipalities. <br /><br />DCED may fund up to 50% of the total cost of an approved application. The grantee is required to provide the remaining 50% or greater, normally as a cash match. At least 25% of the total cost must be funded from nonstate sources. DCED will consider exceptions to the 25% non-state minimum where applicants present the case of an exceptional fiscal or other hardship. Applications that will include in-kind match and/or professional services of a grantee’s staff should be discussed with the GCLGS prior to submission of the application. Match must pay for a project activity included in the approved MAP Budget Narrative specified in the grant contract Appendix A. Grantee cash or in-kind expenditures for work not specified in the grant contract Appendix A, whether or not related, will not be eligible as match.\nApplicant type: Counties; municipalities","applicant_types":["county","municipality"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/52","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3349,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4317,"slug":"pennsylvania-first-grant-pa-grants-dced/66","name":"Pennsylvania First - Grant","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2024-01-01","closes_at":"2035-12-31","closes_text":"Reoccurring","rolling":true,"amount_min":null,"amount_max":null,"match_required":null,"match_pct":null,"summary":"The Pennsylvania First Program was established as a comprehensive funding tool to facilitate increased investment and job creation in the commonwealth and to enable the commonwealth to compete more effectively in the global economy. Grants under this program are processed under the authority of Section 3 of the Act of May 10, 1939 (P.L. 111, No. 51), known as the Commerce Law, which authorizes the Department of Community and Economic Development to undertake ways and means of promoting and encouraging the prosperous development of Pennsylvania business, industry and commerce, of expanding markets and promoting and developing new markets for Pennsylvania products, to encourage the location and development of new business, industry and commerce within the Commonwealth, to aid in restoring employment in communities affected by unemployment, and to assist persons, firms, associations, political subdivisions, corporations, cooperative associations and other organizations in the execution of its duties and functions under the Act.","eligibility":"Eligibility: All costs financed through the Pennsylvania First Program must be necessary for the operation of an eligible business or businesses at a project site(s) in the commonwealth. Specifically, funds may be used for: 1. Job training for direct, full-time, commonwealth resident employees of the applicant/business. 2. Acquisition of land, buildings or rights-of-way. 3. Construction or rehabilitation of buildings. 4. Construction or rehabilitation of infrastructure necessary for the operation of an eligible business or businesses at a project site not to include tap-in fees. 5. Purchase or upgrade of machinery and equipment. 6. Working capital. 7. Project site preparation, including demolition and clearance. 8. Environmental assessments. 9. Remediation of hazardous material.10. Architectural and engineering fees not to exceed 10% of the total Pennsylvania First Program award. Private investment match is required. Private investment means any new capital investment to be made as part of a new location or expansion project at a Commonwealth site (the “project site”) by a business. Please see Section III of the Guidelines for a full list of Program Requirements\nApplicant type: Businesses; Corporations; Partnerships; Sole proprietorships; Limited liability companies; Other forprofit entities; Not-for-profit entities; Municipalities; Boroughs; Townships; Towns; Cities; Home rule municipalities; Municipal Authorities; Redevelopment Authorities; Industrial Development Authorities; Corporations; Local Development Districts","applicant_types":["business","municipality","nonprofit"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/66","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3349,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4318,"slug":"pennsylvania-first-loan-pa-grants-dced/67","name":"Pennsylvania First - Loan","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"loan","funding_source":"direct","status":"open","opens_at":"2024-01-01","closes_at":"2035-12-31","closes_text":"Reoccurring","rolling":true,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"The Pennsylvania First Program was established as a comprehensive funding tool to facilitate increased investment and job creation in the commonwealth and to enable the commonwealth to compete more effectively in the global economy. Grants under this program are processed under the authority of Section 3 of the Act of May 10, 1939 (P.L. 111, No. 51), known as the Commerce Law, which authorizes the Department of Community and Economic Development to undertake ways and means of promoting and encouraging the prosperous development of Pennsylvania business, industry and commerce, of expanding markets and promoting and developing new markets for Pennsylvania products, to encourage the location and development of new business, industry and commerce within the Commonwealth, to aid in restoring employment in communities affected by unemployment, and to assist persons, firms, associations, political subdivisions, corporations, cooperative associations and other organizations in the execution of its duties and functions under the Act.","eligibility":"Eligibility: All costs financed through the Pennsylvania First Program must be necessary for the operation of an eligible business or businesses at a project site(s) in the commonwealth. Specifically, funds may be used for: 1. Job training for direct, full-time, commonwealth resident employees of the applicant/business. 2. Acquisition of land, buildings or rights-of-way. 3. Construction or rehabilitation of buildings. 4. Construction or rehabilitation of infrastructure necessary for the operation of an eligible business or businesses at a project site not to include tap-in fees. 5. Purchase or upgrade of machinery and equipment. 6. Working capital. 7. Project site preparation, including demolition and clearance. 8. Environmental assessments. 9. Remediation of hazardous material.10. Architectural and engineering fees not to exceed 10% of the total Pennsylvania First Program award. Please see Section III of the Guidelines for a full list of Program Requirements.\nApplicant type: Businesses; Corporations; Partnerships; Sole proprietorships; Limited liability companies; Other forprofit entities; Not-for-profit entities; Municipalities; Boroughs; Townships; Towns; Cities; Home rule municipalities; Municipal Authorities; Redevelopment Authorities; Industrial Development Authorities; Corporations; Local Development Districts","applicant_types":["business","municipality","nonprofit"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/67","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3349,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4287,"slug":"pennsylvania-strategic-investments-to-enhance-sites-program-pa-sites-constructio-pa-grants-dced/72","name":"Pennsylvania Strategic Investments to Enhance Sites Program (PA SITES) Construction Grant","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2024-10-01","closes_at":"2035-12-31","closes_text":"Reoccurring","rolling":true,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"The Pennsylvania Strategic Investments to Enhance Sites Program (PA SITES) was established to provide grant and loan funding to eligible applicants to develop competitive sites for businesses to relocate or expand within the Commonwealth. The Construction Grants and Loans component provides grants and loans to serve as gap financing for strategic sites that need financial assistance to help reduce development risk for businesses. The grant and loan funding is intended to help finance strategic investments that will enhance sites across the Commonwealth to effectively compete for expanding and relocating businesses. The program will help reduce development risk for businesses by timeline reduction from the development of public infrastructure or reducing unknown development costs.","eligibility":"Eligibility: The development of industrial sites that provide for the relocation or expansion of businesses to or within this Commonwealth: 1. Previously Utilized Sites – A project is eligible for funding if it redevelops, reuses, or revitalizes a previously utilized site for future use by businesses or others which is consistent with an existing comprehensive municipal plan, and the site is zoned for such development at the time of application. This includes but is not limited to a former or underutilized industrial, commercial, military, mining, railroad or institutional site or building. An institutional site includes, among other things, a former school or hospital. 2. Undeveloped Sites – An undeveloped site is eligible for funding if development of the site is consistent with an existing comprehensive county plan and/or an existing comprehensive municipal plan, and the site is zoned for such development at the time of application. If neither a comprehensive county plan nor a comprehensive municipal plan exists, then the applicant (if the applicant is not a municipality) must demonstrate that it has notified the county and municipal governing bodies with jurisdiction over the site that is the subject of an application for a construction grant.\nApplicant type: Municipality Economic development organization Redevelopment authorities Municipal authorities Industrial development agencies For-Profit Organization","applicant_types":["business","municipality"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/72","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3349,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4288,"slug":"pennsylvania-strategic-investments-to-enhance-sites-program-pa-sites-constructio-pa-grants-dced/73","name":"Pennsylvania Strategic Investments to Enhance Sites Program (PA SITES) Construction Loan","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"loan","funding_source":"direct","status":"open","opens_at":"2024-10-01","closes_at":"2035-12-31","closes_text":"Reoccurring","rolling":true,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"The Pennsylvania Strategic Investments to Enhance Sites Program (PA SITES) was established to provide grant and loan funding to eligible applicants to develop competitive sites for businesses to relocate or expand within the Commonwealth. The Construction Grants and Loans component pro y"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/73","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3349,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4303,"slug":"pennsylvania-strategic-investments-to-enhance-sites-program-pa-sites-planning-gr-pa-grants-dced/74","name":"Pennsylvania Strategic Investments to Enhance Sites Program (PA SITES) Planning Grant","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2024-10-01","closes_at":"2035-12-31","closes_text":"Reoccurring","rolling":true,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"The Pennsylvania Strategic Investments to Enhance Sites Program (PA SITES) was established to provide grant and loan funding to eligible applicants to develop competitive sites for businesses to relocate or expand within the Commonwealth. The Planning Grants component provides grants to conduct a plan or feasibility study for a prospective site that may include the best future use of the parcel(s) for best economic growth opportunities for redevelopment or new development.","eligibility":"Eligibility: The development of industrial sites that provide for the relocation or expansion of businesses to or within<br />this Commonwealth:<br />1. Previously Utilized Sites – A project is eligible for funding if it redevelops, reuses, or revitalizes a<br />previously utilized site for future use by businesses or others which is consistent with an existing<br />comprehensive municipal plan, and the site is zoned for such development at the time of application.<br />This includes but is not limited to a former or underutilized industrial, commercial, military, mining,<br />railroad or institutional site or building. An institutional site includes, among other things, a former<br />school or hospital.<br />2. Undeveloped Sites – An undeveloped site is eligible for funding if development of the site is consistent<br />with an existing comprehensive county plan and/or an existing comprehensive municipal plan, and the<br />site is zoned for such development at the time of application. If neither a comprehensive county plan nor<br />a comprehensive municipal plan exists, then the applicant (if the applicant is not a municipality) must<br />demonstrate that it has notified the county and municipal governing bodies with jurisdiction over the site<br />that is the subject of an application for a construction grant.\nApplicant type: Municipality Economic development organization Redevelopment authorities Municipal authorities Industrial development agencies For-Profit Organization","applicant_types":["business","municipality"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/74","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3349,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4304,"slug":"pipeline-investment-program-pipe-pa-grants-dced/76","name":"Pipeline Investment Program (PIPE)","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2024-07-01","closes_at":"2035-12-31","closes_text":"Reoccurring","rolling":true,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"The Pipeline Investment Program (PIPE) provides grants to construct the last few miles of natural gas distribution lines to business parks, existing manufacturing and industrial enterprises, which will result in the creation of new economic base jobs in the commonwealth while providing access to natural gas for residents.","eligibility":"Eligibility: Natural Gas Extension – projects that extend natural gas pipelines to construct the last few miles of distribution lines to business parks and existing manufacturing and industrial enterprises. Large Residential Conversion Projects that will provide the natural gas infrastructure to convert existing residential areas, consisting of more than 100 parcels, to natural gas. Combined Heat and Power projects that extend natural gas to a combined heat and power system that will serve an eligible applicant. $100 non-refundable application fee An eligible applicant shall provide matching funds of not less than 50% of the total project cost.\nApplicant type: Economic Development Organizations; Businesses; Municipalities; Hospitals; School Districts","applicant_types":["business","municipality","school"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/76","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3349,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4308,"slug":"strategic-management-planning-program-smpp-pa-grants-dced/84","name":"Strategic Management Planning Program (SMPP)","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2024-01-01","closes_at":"2035-12-31","closes_text":"Reoccurring","rolling":true,"amount_min":null,"amount_max":200000,"match_required":true,"match_pct":null,"summary":"Provides matching grant funds to assist municipalities experiencing fiscal difficulties to develop comprehensive multi-year financial plans and establish short- and long-term financial objectives.","eligibility":"Eligibility: Grant funding under the Strategic Management Planning Program may be used for the following activities:<br />1. The development, adoption and implementation of Multi-Year Financial Management Plans.<br />2. Professional consultant services to assist a municipality in the development, adoption and implementation of a Multi-Year Financial Management Plan or related municipal financial and management initiatives and improvements.<br />3. The development of related studies, including an audit as required by Section H of these Guidelines, to improve the management practices and/or financial administration procedures of the local government. <br />4. The development of multi-municipal or regional intergovernmental cooperation initiatives and cost sharing strategies.<br />5. Implementation activities recommended within the adopted Strategic Management Planning Program.<br />6. Training and capacity building activities that meet basic requirements to assist in the implementation of plan recommendations.<br />7. Contracts with professional services consultants to develop and implement recommendations related to eligible activities contained in an adopted Strategic Management Planning Program.<br /><br />Grant awards will be limited to a maximum of $200,000. Funds will generally be used to finance up to 50 percent of the total project cost. The grantee is required to provide the remaining 50 percent, normally as a cash match. Proposals to substitute a portion of the required local cash match with the professional services of the grantee’s staff should be discussed with the GCLGS prior to the submission of the application. In-kind match should not exceed 10% of the required match unless strong justification is provided to and subsequently approved by the Governor's Center for Local Government Services. DCED may reduce the grantee’s required match in some cases. See Guidelines for more information.\nApplicant type: Local government; Counties; Cities; Boroughs; Town; Townships; Home Rule municipalities","applicant_types":["county","municipality"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/84","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3349,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4309,"slug":"tax-increment-financing-tif-guarantee-program-pa-grants-dced/85","name":"Tax Increment Financing (TIF) Guarantee Program","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":null,"funding_source":"direct","status":"open","opens_at":"2024-01-01","closes_at":"2035-12-31","closes_text":"Always Open","rolling":null,"amount_min":null,"amount_max":null,"match_required":null,"match_pct":null,"summary":"Promotes and stimulates the general economic welfare of various regions and communities in the Commonwealth and assists in the development, redevelopment and revitalization of Brownfield and Greenfield sites in accordance with the TIF Act. The program provides credit enhancement for TIF projects to improve market access and lower capital costs through the use of guarantees to issuers of bonds or other indebtedness.","eligibility":"Eligibility: All municipalities and their authorities, including boroughs, townships, towns, counties and home rules that issue TIF bonds to fund local economic development projects.\nApplicant type: Municipal Authorities; Industrial and Commercial Development Authorities; Redevelopment Authorities; Boroughs; Townships; Towns; Counties; Home Rule Municipalities","applicant_types":["county","municipality"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/85","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3349,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4324,"slug":"hazardous-sites-cleanup-act-host-municipality-technical-evaluation-grant-pa-grants-dep/44","name":"Hazardous Sites Cleanup Act Host Municipality Technical Evaluation Grant","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"1988-10-18","closes_at":"2999-07-01","closes_text":"Annual","rolling":null,"amount_min":null,"amount_max":null,"match_required":null,"match_pct":null,"summary":"The Hazardous Sites Cleanup Act (HSCA) authorizes the Department of Environmental Protection to issue Host Municipality Technical Evaluation Grants. Grants are available for municipalities in which DEP's Hazardous Sites Cleanup Program has deemed a site and is proposing a remedial response. The grant provides funds for the municipality to conduct an independent technical evaluation of the proposed remedial response. DEP will notify a municipality at least six months in advance of the proposed remedial response becoming available for review.","eligibility":"Eligibility: $50,000 grant limit per remedial response. Please see program guidance and requiremetns at: https://greenport.pa.gov/elibrary//GetDocument?docId=1419250&DocName=HSCA%20HOST%20MUNICIPALITY%20TECHNICAL%20EVALUATION%20GRANTS.PDF%20%20%20%3cspan%20style%3D%22color:blue%3b%22%3e%3c/span%3e%2011/8/2020\nApplicant type: Municipalities in which the the Hazardous Sites Cleanup Program has deemed a site and is proposing a remedial response.\nPopulation served: Municipalities in which dep's hazardous sites cleanup program has deemed a site and is proposing a remedial response.","applicant_types":["municipality"],"categories":["water"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/44","tier":"likely","is_new":false,"is_updated":false,"days_to_close":355260,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4323,"slug":"municipal-opportunities-for-retrofits-and-energy-efficiency-more-program-pa-grants-dep/31","name":"Municipal Opportunities for Retrofits and Energy Efficiency (MORE) program","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"loan","funding_source":"pass_through","status":"open","opens_at":"2024-12-27","closes_at":"2999-07-01","closes_text":"Revolving Loan Fund","rolling":true,"amount_min":5000,"amount_max":null,"match_required":null,"match_pct":null,"summary":"The MORE Loan is a revolving loan fund to help local governments achieve their energy efficiency projects, small or large. The MORE Loan offers below-market interest rates; however, MORE Grant recipients can buy down their interest rate to as low as 0%.","eligibility":"Eligibility: Borrowers must have a level 2 commercial energy audit and energy conservation measure project design/scope to apply for the loan. MORE Loans can be used for the following:<br /><br />Energy efficiency upgrades<br />Building retrofits<br />On-site renewable energy generation projects (must be paired with energy efficiency measures to qualify)<br /><br />Each local government borrower must provide NEIF with a copy of the proceedings submitted to, as well as the approval from, the Pennsylvania Department of Community and Economic Development (DCED) stating that the debt to be incurred by the borrower, or by any local government unit guaranteeing its debt, in connection with the project funding is approved under the Local Government Unit Debt Act (LGUDA), 53 Pa.C.S. § 8001 et seq. The loan cannot be closed without prior approval by DCED. More information about the LGUDA approval requirements and process can be found on DCED’s website(opens in a new tab) and questions should be directed to DCED at RA-DCLGUDA@pa.gov or (717) 783-8452.\nApplicant type: Municipality\nPopulation served: Pennsylvania local governments","applicant_types":["municipality"],"categories":["energy"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/31","tier":"likely","is_new":false,"is_updated":false,"days_to_close":355260,"deadline_placeholder":true,"days_since_deadline":null,"last_reopened":null},{"id":4327,"slug":"2026-27-regional-policing-assistance-program-pa-grants-pccd/63","name":"2026-27 Regional Policing Assistance Program","number":null,"level":"state","state":"PA","agency":"Pennsylvania Commission on Crime and Delinquency","agency_code":"PA-PCCD","connector":"pa_grants","funding_type":"grant","funding_source":"pass_through","status":"open","opens_at":"2026-07-22","closes_at":null,"closes_text":"Annual","rolling":null,"amount_min":null,"amount_max":200000,"match_required":null,"match_pct":null,"summary":"The goal(s) and objective(s) of the Regional Policing Assistance Program are to improve the following: uniformity and consistency of enforcement across municipalities; recruitment; distribution and deployment of police personnel; training and personnel efficiency; career enhancement opportunities; enhanced professionalism; and reduction of costs.","eligibility":"Eligibility: Eligibility for these funds is open to any municipality – a city, borough, township, or home-rule municipality. Applicants may also be a public or quasi-public body, or its representative duly authorized to act on behalf of one or more municipalities.\nApplicant type: Any municipality; Applicants may also be a public or quasi-public body, or its representative duly authorized to act on behalf of one or more municipalities.\nPopulation served: All pennsylvanians","applicant_types":["municipality"],"categories":["public_safety"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/pccd/63","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":225,"slug":"assisted-outpatient-treatment-grants-gov-363811","name":"Assisted Outpatient Treatment","number":"SM-27-002","level":"federal","state":null,"agency":"Substance Abuse and Mental Health Services Adminis","agency_code":"HHS-SAMHS-SAMHSA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"forecasted","opens_at":"2026-09-03","closes_at":null,"closes_text":null,"rolling":null,"amount_min":null,"amount_max":null,"match_required":false,"match_pct":null,"summary":"The purpose of this program is to facilitate the implementation of Assisted Outpatient Treatment (AOT) for adults with serious mental illness (SMI). Recipients are expected to implement the AOT program, working with civil courts, community partners, and other entities to support community-based treatment for adults with SMI who meet criteria for AOT.","eligibility":"Eligibility is statutorily limited to counties, cities, mental health systems (including mental health authorities), mental health courts, or any other entities with authority under the law of the State in which the applicant is located to implement, monitor and oversee assisted outpatient programs.","applicant_types":["county","municipality"],"categories":["health"],"alns":["93.997"],"listings":[{"aln":"93.997","name":"Assisted Outpatient Treatment"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/363811","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":1004,"slug":"atlanta-fy-2021-fy-2023-eda-planning-and-local-technical-assistance-grants-gov-332052","name":"Atlanta FY 2021 – FY 2023 EDA Planning and Local Technical Assistance","number":"EDA-ATL-TA-ATRO-2021-2006846","level":"federal","state":null,"agency":"Department of Commerce","agency_code":"DOC","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2021-03-15","closes_at":null,"closes_text":"Applications are accepted on a continuing basis and processed as received. This Planning and Local Technical Assistance opportunity will remain in effect until superseded by a future announcement.","rolling":null,"amount_min":0,"amount_max":300000,"match_required":true,"match_pct":null,"summary":"NOTICE: Application Process as of April 6th EDA is excited to announce the launch of its new grants management platform: the Economic Development Grants Experience (EDGE). EDGE was developed to streamline the application and grants management process by implementing a single platform with increased transparency, improved user experience, higher data quality, and more efficiency throughout the entire grant lifecycle. As of April 6th, 2023, applications can no longer be submitted on Grants.gov, and will ONLY be accepted through EDGE. To apply in EDGE, please go to: sfgrants.eda.gov. More information on how to apply is provided in the full NOFO. PARTNERSHIP PLANNING program instructions: Please note that applicants will be invited to submit applications through EDGE for the Partnership Planning program. For more information, please reach out to your EDA point of contact. Program Description: EDA makes planning and local technical assistance investments to support economic development, foster job creation, and attract private investment in economically distressed areas of the United States. Under the Planning program, EDA makes Partnership Planning, Short-Term Planning, and State Planning awards to eligible recipients to create and implement regional economic development plans designed to build capacity and guide the economic prosperity and resiliency of an area or region. More specifically, EDA makes Partnership Planning investments to designated planning organizations (i.e., District Organizations) serving EDA-designated Economic Development Districts and to Indian Tribes to facilitate the development, implementation, revision, or replacement of Comprehensive Economic Development Strategies (CEDS), which articulate and prioritize the strategic economic goals of recipients’ respective regions. EDA also makes Short-Term and State Planning awards for economic development planning activities that guide the eventual creation and retention of high-quality jobs, particularly for the unemployed and underemployed in the Nation’s most economically distressed regions. Under the Local Technical Assistance program, EDA makes awards to strengthen the capacity of local or State organizations, institutions of higher education, and other eligible entities to undertake and promote effective economic development programs through projects such as feasibility studies, impact analyses, disaster resiliency plans, and project planning. *Please note: While the published Notice of Funding Opportunity (available under \"Related Documents\") states that the ED900A form and the SF424B form are both required for a complete application, these forms are no longer required and have therefore been removed from the package template.","eligibility":"Pursuant to section 3 of the Public Works and Economic Development Act of 1965 (42 U.S.C. § 3122) (PWEDA) and EDA’s regulation at 13 C.F.R. § 300.3, the following types of entities are eligible to receive funding assistance from EDA: 1. District Organizations (as defined in 13 C.F.R. § 300.3); 2. Indian Tribes or a consortium of Indian Tribes; 3. States, cities, or other political subdivisions of a State, including a special purpose unit of a State or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions; 4. Institutions of higher education or a consortium of institutions of higher education; or 5. Public or private non-profit organizations or associations acting in cooperation with officials of a political subdivision of a State.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["11.302","11.303"],"listings":[{"aln":"11.302","name":"Economic Development Support for Planning Organizations"},{"aln":"11.303","name":"Economic Development Technical Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/332052","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":1006,"slug":"austin-fy-2021-fy-2023-eda-planning-and-local-technical-assistance-grants-gov-332137","name":"Austin FY 2021 – FY 2023 EDA Planning and Local Technical Assistance","number":"EDA-AUS-TA-AURO-2021-2006848","level":"federal","state":null,"agency":"Department of Commerce","agency_code":"DOC","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2021-03-15","closes_at":null,"closes_text":"Applications are accepted on a continuing basis and processed as received. This Planning and Local Technical Assistance opportunity will remain in effect until superseded by a future announcement.","rolling":null,"amount_min":0,"amount_max":300000,"match_required":true,"match_pct":null,"summary":"UPDATED NOTICE - PLEASE READ: April 6, 2023 EDA is excited to announce the launch of its new grants management platform: the Economic Development Grants Experience (EDGE). EDGE was developed to streamline the application and grants management pr e_deadline":null,"last_reopened":null},{"id":691,"slug":"eda-fy25-disaster-supplemental-grants-gov-359225","name":"EDA FY25 Disaster Supplemental","number":"EDA-DISASTER-2025","level":"federal","state":null,"agency":"Economic Development Administration","agency_code":"DOC-EDA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2025-06-04","closes_at":null,"closes_text":"There are no submission deadlines. Applications will be accepted on an ongoing basis until the publication of a new Disaster Supplemental NOFO, cancellation of this Disaster Supplemental NOFO or all available funds have been expended.","rolling":null,"amount_min":0,"amount_max":50000000,"match_required":true,"match_pct":null,"summary":"Through this Disaster NOFO, EDA will award investments in regions experiencing severe economic distress or other economic harm resulting from hurricanes, wildfires, tornadoes, floods, and other natural disasters occurring in calendar years 2023 and 2024. EDA’s goal under this NOFO is to assist communities recovering from a disaster by realizing opportunities to recover and change the economic trajectory of the community for the better. In other words, EDA funding seeks to help communities recover and set them on a path to exceed their previous pre-disaster baseline. EDA seeks projects that are responsive to community needs post-disaster by engaging all aspects of the community, with special focus on private industry partners. This Disaster NOFO provides funding through three pathways: Readiness Path – Standalone non-construction projects designed to increase a community’s readiness to apply for or implement disaster recovery funding from private and public sources including, but not limited to, future EDA NOFOs and the Implementation or Industry Transformation Paths under this NOFO. Projects will fund strategy development, capacity building, and/or predevelopment costs necessary for future recovery projects. Implementation Path – Standalone construction or non-construction projects designed to address the economic challenges faced by a community recovering from a natural disaster and improve economic trajectories beyond pre-disaster economic conditions. Industry Transformation Path – Led by a coalition of regional stakeholders, a portfolio of large-scale, multicomponent construction and non-construction projects designed to fundamentally transform the economic trajectory of a region through the development or acceleration of an industry.","eligibility":"Eligible applicants under the FY25 Disaster program include a(n): District organization of an EDA-designated Economic Development District (EDD); Indian tribe or a consortium of Indian tribes; State, county, city, or other political subdivision of a state, including a special purpose unit of a state or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions, institution of higher education or a consortium of institutions of higher education; public or private nonprofit organization or association acting in cooperation with officials of a political subdivision of a state; an economic development organization; or a public-private partnership for public infrastructure. EDA is not authorized to provide grants or cooperative agreements to individuals or for-profit entities under this NOFO. Applications from individuals or for-profit entities will not be considered for funding.","applicant_types":["county","municipality","nonprofit","school","tribe"],"categories":["other"],"alns":["11.307"],"listings":[{"aln":"11.307","name":"Economic Adjustment Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/359225","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":982,"slug":"fy-2023-disaster-supplemental-grants-gov-347414","name":"FY 2023 Disaster Supplemental","number":"EDA-DISASTER-2023","level":"federal","state":null,"agency":"Economic Development Administration","agency_code":"DOC-EDA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2023-04-24","closes_at":null,"closes_text":"There are no submission deadlines. Applications will be accepted on an ongoing basis until the publication of a new Disaster Supplemental NOFO, cancellation of this Disaster Supplemental NOFO or all available funds have been expended.","rolling":null,"amount_min":0,"amount_max":30000000,"match_required":true,"match_pct":null,"summary":"Subject to the availability of funds, awards made under this NOFO will help communities and regions devise and implement long-term economic recovery strategies through a variety of non-construction and construction projects, as appropriate, to address economic challenges in areas where a Presidential declaration of a major disaster was issued under the Robert T. Stafford Disaster Relief and Emergency Assistance Act (42 U.S.C. § 5121 et seq.) (Stafford Act) “as a result of Hurricanes Ian and Fiona, and of wildfires, flooding, and other natural disasters occurring in calendar years 2021 and 2022….” EDA is excited to announce the launch of its new grants management platform: the Economic Development Grants Experience (EDGE). EDGE was developed to streamline the application and grants management process by implementing a single platform with increased transparency, improved user experience, higher data quality, and more efficiency throughout the entire grant lifecycle. Starting April 6, 2023, applications will no longer be accepted on Grants.gov, and will ONLY be accepted through EDGE (sfgrants.eda.gov). To apply for the FY 2023 Disaster Supplemental NOFO, please access the portal here. More information on how to apply is provided in the full NOFO.","eligibility":"District Organization; Indian Tribe or a consortium of Indian Tribes; State, county, city, or other political subdivision of a State, including a special purpose unit of a State or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions; Institution of higher education or a consortium of institutions of higher education; or Public or private non-profit organization or association acting in cooperation with officials of a political subdivision of a State. The project of an eligible applicant must be able to meet area eligibility requirements to be considered for funding under this Disaster Supplemental NOFO. Such eligibility is predicated upon the project being located in or primarily serving one or more communities impacted by Hurricanes Ian and Fiona, and of wildfires, flooding, and other natural disasters occurring in calendar years 2021 and 2022. More specifically, consistent with 13 C.F.R. parts 301 and 307, EDA will determine area eligibility pursuant to the applicable Federal disaster declaration under the Stafford Act, and the Federal Emergency Management Agency (FEMA) designation of areas as eligible for public assistance or individual assistance due to the declared disasters listed on FEMA’s website (www.fema.gov/disaster/). For construction projects (including design and engineering), the project must be located within an eligible county. For non-construction projects, the project’s scope of work must primarily benefit eligible counties, and stakeholders representing those eligible counties must be directly engaged in the project.","applicant_types":["county","higher_ed","municipality","nonprofit","tribe"],"categories":["other"],"alns":["11.307"],"listings":[{"aln":"11.307","name":"Economic Adjustment Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/347414","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":984,"slug":"fy-2025-eda-public-works-and-economic-adjustment-assistance-programs-grants-gov-346815","name":"FY 2025 EDA Public Works and Economic Adjustment Assistance Programs","number":"PWEAA2023","level":"federal","state":null,"agency":"Economic Development Administration","agency_code":"DOC-EDA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2023-03-14","closes_at":null,"closes_text":"There are no application submission deadlines. Applications will be accepted on an ongoing basis until the publication of a new PWEAA NOFO, cancellation of this PWEAA NOFO, or all available funds have been expended. EDA intends to review applications expeditiously upon receipt of the complete application.","rolling":null,"amount_min":100000,"amount_max":30000000,"match_required":true,"match_pct":null,"summary":"PLEASE FIND THE NOFO IN THE 'DOCUMENTS' SECTION OF THIS POST This opportunity has been updated as of May 11, 2026 ﻿Program Overview: EDA has authority to provide grants to meet the full range of communities’ and regions’ economic development needs from planning and technical assistance to construction of infrastructure. These grants are made through a series of Notices of Funding Opportunity (NOFOs) that can be found on EDA’s website at https://www.eda.gov/funding/funding-opportunities and are designed to support the economic development activities most useful to a community based on its needs and circumstances. EDA funds community or regionally generated ideas and assists communities to advance to the next level of economic development. This NOFO sets out EDA’s application submission and review procedures for two of EDA’s core economic development programs authorized under the Public Works and Economic Development Act of 1965, as amended (42 U.S.C. § 3121 et seq.) (PWEDA): (1) Public Works and Economic Development Facilities (Public Works) and (2) Economic Adjustment Assistance (EAA). EDA supports bottom-up strategies that build on regional assets to spur economic growth and resiliency. EDA encourages its grantees throughout the country to develop initiatives that present new ideas and creative approaches to advance economic prosperity in distressed communities. Through this NOFO EDA intends to advance general economic development in accordance with EDA’s investment priorities, which can be found on EDA's website here: Investment Priorities | U.S. Economic Development Administration","eligibility":"Pursuant to Section 3(4) of PWEDA (42 U.S.C. § 3122(4)(a)) and 13 C.F.R. § 300.3 (Eligible Recipient), eligible applicants for EDA financial assistance under the Public Works and EAA programs include a(n): (i) District Organization of an EDA-designated Economic Development District; (ii) Indian Tribe or a consortium of Indian Tribes; (iii) State, county, city, or other political subdivision of a State, including a special purpose unit of a State or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions; (iv) institution of higher education or a consortium of institutions of higher education; or (v) public or private non-profit organization or association acting in cooperation with officials of a political subdivision of a State. Individuals and for-profit entities are not eligible for funding under this NOFO.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["11.300","11.307"],"listings":[{"aln":"11.300","name":"Investments for Public Works and Economic Development Facilities"},{"aln":"11.307","name":"Economic Adjustment Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/346815","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":881,"slug":"gpd-grant-forecast-grants-gov-356629","name":"GPD Grant Forecast","number":"VA-GPD-FORECAST-FY2026-FY2028","level":"federal","state":null,"agency":"Homeless Providers Grant and Per Diem Program","agency_code":"VA-HPGPDP","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"forecasted","opens_at":"2024-10-03","closes_at":null,"closes_text":null,"rolling":null,"amount_min":null,"amount_max":null,"match_required":false,"match_pct":null,"summary":"THIS IS NOT A NOTICE OF FUNDING. THIS IS A GENERAL FORECAST ONLY. Grant and Per Diem (GPD) Program Introduction The GPD Program is VA’s largest transitional housing program for Veterans experiencing homelessness and is permanently authorized under Public Law 109-461. Since 1994, the GPD Program has awarded grants to community-based organizations to provide transitional housing with wraparound supportive services to assist vulnerable Veterans move into permanent housing. The grants are designed to meet Veterans at various stages as they move to stable housing. Community-based organizations receiving GPD grants offer focused transitional housing services through a variety of housing models targeted to different populations and needs of Veterans. The GPD program plays a vital role in the continuum of homeless services by providing supportive services to those Veterans who would otherwise be among the unsheltered homeless population. The result of GPD programs is that Veterans achieve residential stability, increase their skill levels and/or income, and obtain greater self-determination. Types of GPD Grants Transitional housing grants: Per Diem Only (PDO) grants provide funding in the form of per diem payments to reimburse grantees for the cost of care provided to Veterans in transitional supportive housing. Special Need grants target housing and services to specific populations of Veterans (e.g., women, Veterans with chronic mental illness, frail elderly Veterans, Veterans caring for minor dependents, terminally ill Veterans). Transition-In-Place (TIP) grants offer Veteran residents housing in which supportive services transition out of the residence over time, rather than the resident. Upon completion of the TIP services, the resident retains the unit as their permanent housing with no requirement to move. Other types of grants: Case Management grants support Veterans who were previously experiencing homelessness or who are at risk for homelessness so that they may obtain or retain permanent housing. Capital grants support the costs of acquiring, renovating, or constructing facilities and are only offered intermittently to improve existing facilities or to develop new transitional housing depending on VA's priorities and funding availability. Lists of current grantees are available on the GPD website. How to Apply for GPD Funding Not all grant types are available annually. When available, notices of funding can be found at the following locations: www.grants.gov and https://www.va.gov/homeless/gpd.asp. Application instructions are provided in each notice of funding. Each notice of funding will clarify specific eligibility criteria, application requirements, funding limitations, and other requirements. Applications are submitted through an online portal that is only available when there is an open notice of funding. Potential applicants who wish to see what was required for previous applications may review past notices of funding, available on the GPD provider website and www.grants.gov. Past notices of funding are not a guarantee of future requirements. Tentative Estimated GPD Award Schedule Specific dates are not able to be forecast. The follow tentative approximations are provided for general planning purposes. FY 2026 Case Management – GPD tentatively expects to offer a notice of funding around FY 2025 for case management awards starting approximately in FY 2026. FY 2027 PDO – GPD tentatively expects to offer a notice of funding around FY 2026 for PDO awards starting approximately in FY 2027. TIP – GPD tentatively expects to offer a notice of funding around FY 2026 for TIP awards starting approximately in FY 2027. FY 2028 GPD tentatively does not expect to offer a notice of funding for this timeframe. GPD may update this forecast closer to the time. THIS IS NOT A NOTICE OF FUNDING. THIS IS A GENERAL FORECAST ONLY.","eligibility":"THIS IS NOT A NOTICE OF FUNDING. THIS IS A GENERAL FORECAST ONLY.","applicant_types":["county","housing_authority","municipality","nonprofit","special_district","state","tribe"],"categories":["housing"],"alns":["64.024"],"listings":[{"aln":"64.024","name":"VA Homeless Providers Grant and Per Diem Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/356629","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":1008,"slug":"philadelphia-fy-2021-fy-2023-eda-planning-and-local-technical-assistance-grants-gov-332138","name":"Philadelphia FY 2021 – FY 2023 EDA Planning and Local Technical Assistance","number":"EDA-PHI-TA-PRO-2021-2006851","level":"federal","state":null,"agency":"Department of Commerce","agency_code":"DOC","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2021-03-15","closes_at":null,"closes_text":"Applications are accepted on a continuing basis and processed as received. This Planning and Local Technical Assistance opportunity will remain in effect until superseded by a future announcement.","rolling":null,"amount_min":0,"amount_max":300000,"match_required":true,"match_pct":null,"summary":"UPDATED NOTICE - PLEASE READ: April 6, 2023 EDA is excited to announce the launch of its new grants management platform: nizations, institutions of higher education, and other eligible entities to undertake and promote effective economic development programs through projects such as feasibility studies, impact analyses, disaster resiliency plans, and project planning. *Please note: While the published Notice of Funding Opportunity (available under \"Related Documents\") states that the ED900A form and the SF424B form are both required for a complete application, these forms are no longer required and have therefore been removed from the package template.","eligibility":"Pursuant to section 3 of the Public Works and Economic Development Act of 1965 (42 U.S.C. § 3122) (PWEDA) and EDA’s regulation at 13 C.F.R. § 300.3, the following types of entities are eligible to receive funding assistance from EDA: 1. District Organizations (as defined in 13 C.F.R. § 300.3); 2. Indian Tribes or a consortium of Indian Tribes; 3. States, cities, or other political subdivisions of a State, including a special purpose unit of a State or local government engaged in economic or infrastructure development activities, or a consortium of political subdivisions; 4. Institutions of higher education or a consortium of institutions of higher education; or 5. Public or private non-profit organizations or associations acting in cooperation with officials of a political subdivision of a State.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["11.302","11.303"],"listings":[{"aln":"11.302","name":"Economic Development Support for Planning Organizations"},{"aln":"11.303","name":"Economic Development Technical Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/332138","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":1003,"slug":"seattle-
