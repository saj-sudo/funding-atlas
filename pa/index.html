,{"id":314,"slug":"innovative-traffic-safety-enforcement-itse-grant-program-grants-gov-363446","name":"Innovative Traffic Safety Enforcement (ITSE) Grant Program","number":"NHTSA-693JJ926R000024-FY26","level":"federal","state":null,"agency":"National Highway Traffic Safety Administration","agency_code":"DOT-NHTSA","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-08-03","closes_at":"2027-09-01","closes_text":null,"rolling":null,"amount_min":300000,"amount_max":20000000,"match_required":false,"match_pct":null,"summary":"While the agency will consider innovative enhancements to existing countermeasures, the goal is to develop evidence-based projects that are scalable and transferable for use by State and local law enforcement agencies. The primary intent of this of the ITSE Grant Program is to 1) develop innovative traffic safety enforcement programs that demonstrate effectiveness by reducing the number of motor vehicle crashes due to one or more of the subject risky driving behaviors; and 2) ensure the traffic safety enforcement programs are repeatable and scalable for use by law enforcement throughout the United States. In addition to those goals, the Department seeks to fund projects that advance the priorities of this Administration as described in DOT’s mission statement and across executive orders.","eligibility":"Applicants eligible for an award include a State or local agency, authority, association, educational institution, or nonprofit organization that demonstrates that it has organizational capacity and experience to carry out the responsibilities of administering, coordinating, and implementing the activities of this NOFO, as explained in Section III ‘Program Description’, and based upon the documentation submitted by the applicant as required in Section IV ‘Application Contents and Format’. Only organizations capable of fulfilling the criteria listed within this NOFO will be considered for an award.","applicant_types":["county","higher_ed","municipality","nonprofit","special_district","state","tribe"],"categories":["other"],"alns":["20.614"],"listings":[{"aln":"20.614","name":"National Highway Traffic Safety Administration (NHTSA) Discretionary Safety Grants and Cooperative Agreements"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/363446","tier":"possible","is_new":false,"is_updated":false,"days_to_close":306,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":718,"slug":"laboratory-flexible-funding-model-lffm-grants-gov-358411","name":"Laboratory Flexible Funding Model (LFFM)","number":"RFA-FD-25-007","level":"federal","state":null,"agency":"Food and Drug Administration","agency_code":"HHS-FDA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2025-02-06","closes_at":"2028-01-11","closes_text":null,"rolling":null,"amount_min":0,"amount_max":1500000,"match_required":false,"match_pct":null,"summary":"This cooperative agreement is intended to enhance the capacity and capabilities of state human and animal food testing laboratories in support of an integrated food safety system (IFSS). This is achieved through prioritized sample testing and food defense preparedness in the areas of microbiology, chemistry, and radiochemistry, as well as method development and capacity/capability development projects that support and expand food safety and food defense testing.","eligibility":"Applicant organizations applying for product testing tracks must be accredited to ISO 17025 in at least one human or animal food testing method applicable to the discipline for which they are applying.Applicant organizations applying for tracks other than product testing must be accredited to ISO 17025 or have a quality system that ensures quality assurance and quality control of laboratory testing including but not limited to: validated methods, document control, training programs, and analyst competency requirements.Applicant organizations applying to any track other than Whole Genome Sequencing must have a valid 20.88 agreement with FDA prior to the time of application.","applicant_types":["county","higher_ed","municipality","special_district","state","tribe"],"categories":["other"],"alns":["93.103"],"listings":[{"aln":"93.103","name":"Food and Drug Administration Research"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/358411","tier":"possible","is_new":false,"is_updated":false,"days_to_close":438,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null},{"id":531,"slug":"2026-alaska-marine-education-and-training-mini-grant-program-grants-gov-362034","name":"2026 Alaska Marine Education and Training Mini-Grant Program","number":"NOAA-NMFS-AK-2026-33268","level":"federal","state":null,"agency":"DOC NOAA - ERA Production","agency_code":"DOC-DOCNOAAERA","connector":"grants_gov","funding_type":"cooperative_agreement","funding_source":"direct","status":"open","opens_at":"2026-04-23","closes_at":"2028-05-01","closes_text":null,"rolling":null,"amount_min":15000,"amount_max":75000,"match_required":false,"match_pct":null,"summary":"This announcement supports Executive Order 14276, Restoring America’s Seafood Competitiveness, by soliciting projects that support: workforce development for marine-related professions in marine science, aquaculture/mariculture, and maritime operations; enhancing seafood safety and management through training in seafood best practices, marketing, and fishery management; technological innovation in fishing practices; outreach and education for consumers on quality and sustainability of wild caught fish or products farmed through aquaculture/mariculture; enhanced regionally-specific management of fishery resources based on local knowledge; nsed gaming facility.<br />See program guidelines for specific eligible uses of funds. $100 non-refundable application fee\nApplicant type: Counties; Municipalities; Economic Development Agencies; Redevelopment Authorities","applicant_types":["county","municipality"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/44","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-30,"deadline_placeholder":false,"days_since_deadline":30,"last_reopened":null},{"id":4233,"slug":"spotlight-pa-grants-pca/2","name":"Spotlight","number":null,"level":"state","state":"PA","agency":"Council on the Arts","agency_code":"PA-PCA","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"closed","opens_at":"2026-08-03","closes_at":"2026-09-14","closes_text":"Annual","rolling":null,"amount_min":0,"amount_max":5000,"match_required":null,"match_pct":null,"summary":"The Spotlight Program supports smaller creative arts organizations and programs that deliver services, products, or programs aligned with Pennsylvania Creative Industries’ strategic plan key areas. In addition to providing essential funding, the program fosters a collaborative network for grantees, fostering opportunities to connect and share insights through tailored webinars organized by artistic discipline.","eligibility":"Eligibility: Applicants must: • Be a nonprofit, tax-exempt corporation, or a unit of local government (counties, cities, boroughs, townships, and municipal authorities). • Have an annual average arts revenue of $10,000 to less than $100,000. Pennsylvania Creative Industries determines revenue size by a two-year average demonstrated by: o Arts organization: most recent filed form 990 of the U.S. Department of the Treasury Internal Revenue Service.  If your 990 is a postcard, you must submit the postcard AND a board/committee approved, arts-specific program financial statement from the most recently completed two fiscal years. The program financial statement must detail program revenue, including contributed and earned income and income realized from investments, as applicable, and expenses. In-kind is not included.  If you are exempt from filing a 990 (please see list of exemptions: Annual exempt organization return: who must file | Internal Revenue Service), you must submit a board/committee approved, arts-specific program financial statement from the most recently completed two fiscal years. The program financial statement must detail program revenue, including contributed and earned income and income realized from investments, as applicable, and expenses. In-kind is not included. o Arts program of non-arts organization: applicant’s board/committee approved, arts-specific program financial statement from the most recently completed two fiscal years. The program financial statement must detail program revenue, including contributed and earned income and income realized from investments, as applicable, and expenses. In-kind is not included. • Have a history of at least two years of consistent arts programming in Pennsylvania. • Be located in Pennsylvania and registered as a Pennsylvania Non-profit Corporation with the Pennsylvania Department of State Bureau of Corporations and Charitable Organizations, and in compliance with required annual report filing(s).\nApplicant type: Nonprofit (501(c)(3), Unit of local government","applicant_types":["county","municipality","nonprofit"],"categories":["other"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/pca/2","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-46,"deadline_placeholder":false,"days_since_deadline":46,"last_reopened":null},{"id":4232,"slug":"home-investment-partnerships-program-home-pa-grants-dced/31","name":"HOME Investment Partnerships Program (HOME)","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"pass_through","status":"closed","opens_at":"2026-06-30","closes_at":"2026-09-11","closes_text":"Varies","rolling":null,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":25.0,"summary":"The Pennsylvania HOME Program is a federally funded program that provides municipalities with grant and loan assistance to expand and preserve the supply of decent and affordable housing for low- and very low-income Pennsylvanians. HOME funds can be used in a variety of ways to address critical housing needs in the Commonwealth, including market-oriented approaches that offer opportunities such as homeownership or rental activities to revitalize communities with new investment. HOME Program funds are provided to DCED from the U.S. Department of Housing and Urban Development (HUD) through the annual entitlement appropriation process.","eligibility":"Eligibility: Units of Local government on behalf of private, non-profit and for-profit housing development entities. HOME participating jurisdictions (PJ’s) may also apply under certain criteria (Review Application Guidelines).\nApplicant type: Units of local government, including cities, towns, counties, boroughs and townships","applicant_types":["county","municipality"],"categories":["housing"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/31","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-49,"deadline_placeholder":false,"days_since_deadline":49,"last_reopened":null},{"id":4230,"slug":"cultural-and-historical-support-grants-pa-grants-phmc/1","name":"Cultural and Historical Support Grants","number":null,"level":"state","state":"PA","agency":"Historical & Museum Commission","agency_code":"PA-PHMC","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"closed","opens_at":"2026-07-13","closes_at":"2026-08-21","closes_text":"Annual","rolling":null,"amount_min":2500,"amount_max":65000,"match_required":null,"match_pct":null,"summary":"The Pennsylvania Historical and Museum Commission's Cultural and Historical Support Grants program provides general operating support funding to eligible Pennsylvania museums and official county historical societies. The goal of this program is to strengthen Pennsylvania’s museums and allow applicants to determine how to use funds for operating expenses. A museum must meet the American Alliance of Museums' definition that \"a museum must be a legally organized nonprofit institution, essentially educational in nature, with professional staff, which owns or utilizes tangible objects, cares for them, and exhibits them to the public on some regular schedule\" Grant awards range from $2,500 to $65,000. As a general rule, no county shall receive an allocation greater than 37.5% of the available funds. In counties that exceed this cap, individual grant awards may be reduced. Grant award amounts are based on a formula that uses the operating budget for the most recently completed fiscal year. All awards are submitted to the Commission for approval and depend upon the availability of funds in the Commonwealth budget.","eligibility":"Eligibility: Eligible Organizations<br />1) Museums (as defined by the American Association of Museums) located in Pennsylvania with annual operating budgets exceeding $100,000 (excluding capital and in-kind services) and at least one full-time professional staff person.<br />2) Official County Historical Societies. If the operating budget is less than $400,000, the organization must apply as an Official County Historical Society. Official County Historical Societies with operating budgets in excess of $400,000 must apply as a Museum. <br /><br />Please contact RA-PHGRANTSUPPORT@pa.gov for more information on all eligibility requirements or visit the Who May Apply link above<br />\nApplicant type: Non-profit; Municipality; Higher-Education (College/University); Authorities\nPopulation served: Cultural institutions, offical county historical societies, and museums","applicant_types":["higher_ed","municipality","nonprofit","school"],"categories":["other"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/phmc/1","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-70,"deadline_placeholder":false,"days_since_deadline":70,"last_reopened":null},{"id":4227,"slug":"emergency-solutions-grant-program-esg-pa-grants-dced/22","name":"Emergency Solutions Grant Program (ESG)","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"pass_through","status":"closed","opens_at":"2026-06-29","closes_at":"2026-08-10","closes_text":"Varies","rolling":null,"amount_min":25000,"amount_max":null,"match_required":true,"match_pct":null,"summary":"Emergency Solutions Grant (ESG) is federal grant providing funding to assist with the rapid rehousing of homeless persons, street outreach, homelessness prevention, and emergency shelter activities. Funds may also be used to support the maintenance of a homeless management information system (HMIS) and administration. This program is authorized by McKinney-Vento Homeless Assistance Act as amended by the Homeless Emergency Assistance and Rapid Transition to Housing (HEARTH) Act of 2009.","eligibility":"Eligibility: Non-profit organizations are eligible to apply only for a regional project as long as it demonstrates a regional need and serving multiple counties.\nApplicant type: Any general unit of local government; Non-profit organizations.","applicant_types":["county","municipality","nonprofit"],"categories":["housing"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/22","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-81,"deadline_placeholder":false,"days_since_deadline":81,"last_reopened":null},{"id":4224,"slug":"multimodal-transportation-fund-mtf-pa-grants-dced/51","name":"Multimodal Transportation Fund (MTF)","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"closed","opens_at":"2026-03-01","closes_at":"2026-07-31","closes_text":"Annual","rolling":null,"amount_min":100000,"amount_max":3000000,"match_required":true,"match_pct":30.0,"summary":"The Multimodal Transportation Fund provides grants to encourage economic development and ensure that a safe and reliable system of transportation is available to the residents of the commonwealth.","eligibility":"Eligibility: Grants are available for projects with a total cost of $100,000 or more. Grants shall not exceed $3,000,000 for any project. Financial assistance under the Multimodal Transportation Fund shall be matched by local funding in an amount not less than 30% of the non-federal share of the project costs. $100 fee\nApplicant type: Businesses; Municipalities;Councils of Governments; Businesses; Economic Development Organizations; Public Transportation Agencies; Ports-Rail/Freight","applicant_types":["business","municipality"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/51","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-91,"deadline_placeholder":false,"days_since_deadline":91,"last_reopened":null},{"id":4222,"slug":"family-impa ent in Pennsylvania’s energy sector. DEP receives funding each year through the utilities gross receipts tax collected during each fiscal year to carry out the provisions of the Alternative Fuels Incentive Act. The primary goals of the Alternative Fuels Incentive Grant Program (AFIG) are to improve Pennsylvania’s air quality and reduce consumption of imported oil through the use of homegrown alternative fuels that will help the Commonwealth’s economy and environment. Vehicle Retrofit and Purchase projects include the incremental cost of purchase of new alternative fuel vehicles (any type or size). The new vehicles must be manufactured by the original equipment manufacturer to operate dedicated on alternative fuel. Vehicle Retrofit and Purchase also includes the incremental cost of retrofit of new or existing vehicles to operate on alternative fuels (any type or size) and can be operated on alternative fuel as dedicated. Eligible vehicles include but are not limited to: Dedicated RNG, LNG or CNG vehicles, liquid propane gas, hydrogen, biodiesel (blends greater than B20), and electricity (Battery Electric Vehicles only, including Neighborhood Electric Vehicles, and yard trucks); no GVWR limits. For further information on the program, see program guidance and review application instructions prior to applying.","eligibility":"Eligibility: You must be an eligible applicant to apply.\nApplicant type: School districts; Municipal authorities; Political subdivisions; Incorporated nonprofit entities; Corporations; Limited liability companies; Partnerships","applicant_types":["business","municipality","nonprofit","school"],"categories":["energy"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/11","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-100,"deadline_placeholder":false,"days_since_deadline":100,"last_reopened":null},{"id":4220,"slug":"fy25-paul-coverdell-forensic-science-improvements-pa-grants-pccd/59","name":"FY25 Paul Coverdell Forensic Science Improvements","number":null,"level":"state","state":"PA","agency":"Pennsylvania Commission on Crime and Delinquency","agency_code":"PA-PCCD","connector":"pa_grants","funding_type":"grant","funding_source":"pass_through","status":"closed","opens_at":"2026-06-02","closes_at":"2026-07-14","closes_text":"Annual","rolling":null,"amount_min":null,"amount_max":200000,"match_required":null,"match_pct":null,"summary":"The anticipated impacts resulting from this solicitation include supporting Pennsylvania forensic crime laboratories with obtaining or maintaining accreditation and/or the certification of forensic science analysts in an acceptable forensic science discipline, with an emphasis on combating opioids and synthetic drugs.","eligibility":"Eligibility: Eligibility for these funds is open to state, county, or municipal forensic crime laboratories to support activities that improve the quality and timeliness of forensic services.\nApplicant type: State, county, or municipal forensic crime laboratories.","applicant_types":["county","municipality"],"categories":["other"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/pccd/59","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-108,"deadline_placeholder":false,"days_since_deadline":108,"last_reopened":null},{"id":4208,"slug":"business-in-our-sites-bos-project-grants-pa-grants-dced/12","name":"Business in our Sites (BOS) - Project Grants","number":null,"level":"state","state":"PA","agency":"Community & Economic Development","agency_code":"PA-DCED","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"closed","opens_at":"2026-03-19","closes_at":"2026-06-30","closes_text":"Annual","rolling":null,"amount_min":null,"amount_max":null,"match_required":null,"match_pc cts that are primarily residential or recreational. Sites must be previously utilized property or undeveloped property that is planned and zoned for development. $350 non-refundable application fee for construction projects regardless if you are applying for a loan only or both a grant and loan. .50% to 1.00% based on scale in BOS guidelines\nApplicant type: Municipalities; Municipal Authorities; Redevelopment Authorities; Industrial Development Agencies; Private Developers (construction loans only)","applicant_types":["business","municipality"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/13","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-122,"deadline_placeholder":false,"days_since_deadline":122,"last_reopened":null},{"id":4214,"slug":"household-hazardous-waste-collection-grant-pa-grants-dep/28","name":"Household Hazardous Waste Collection Grant","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"closed","opens_at":"2024-07-01","closes_at":"2026-06-30","closes_text":"Continuous","rolling":true,"amount_min":null,"amount_max":null,"match_required":true,"match_pct":null,"summary":"Under the PA Household and Small Business Pollution Prevention Act, the Department of Environmental Protection offers 50 percent reimbursement collection program grants to municipalities and non-profits.","eligibility":"Eligibility: Act 190, Chapter 2, Household Hazardous Waste Collection Grant - Provides reimbursement to registered sponsors of collection programs for household hazardous waste, electronics, and tires (but not tire pile cleanups). Reimbursement available for up to 50 percent of eligible costs. Eligible costs typically include collection, transportation and management of the wastes plus education programs. Eligible entities include households, political subdivisions, and small businesses.\nApplicant type: Municipalities; Corporations; Public utilities; Trade associations; Persons are authorized to sponsor collection programs for HHW and similar wastes from eligible entities.","applicant_types":["business","municipality"],"categories":["water"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/28","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-122,"deadline_placeholder":false,"days_since_deadline":122,"last_reopened":null},{"id":4210,"slug":"independent-review-of-municipal-waste-permit-grant-pa-grants-dep/17","name":"Independent Review of Municipal Waste Permit Grant","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"closed","opens_at":"2024-07-01","closes_at":"2026-06-30","closes_text":"Continuous","rolling":true,"amount_min":null,"amount_max":10000,"match_required":null,"match_pct":null,"summary":"Grants are available to municipalities for assistance with independent review of permit applications for new municipal waste landfills or resource recovery facility, or expansion of an existing facility. The grants come as reimbursements of up to $10,000 for qualifying reviews.","eligibility":"Eligibility: The grant may not exceed $10,000 per application.\nApplicant type: Pennsylvania Municipalties","applicant_types":["municipality"],"categories":["water"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/17","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-122,"deadline_placeholder":false,"days_since_deadline":122,"last_reopened":null},{"id":4212,"slug":"independent-review-of-permit-application-siting-plan-grant-pa-grants-dep/36","name":"Independent Review of Permit Application/Siting Plan Grant","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"closed","opens_at":"2024-07-01","closes_at":"2026-06-30","closes_text":"continuous","rolling":true,"amount_min":null,"amount_max":50000,"match_required":null,"match_pct":null,"summary":"Grants are available to host municipalities and counties for the independent review of permit applications by a professional engineer licensed in the Commonwealth for new or expanded commercial hazardous waste disposal facilities. The grants come as reimbursements of up to $50,000 for qualifying reviews.","eligibility":"Eligibility: The Monies are to be used by the host county and host municipality to hire an independent consultant experienced in the review of hazardous waste permit applications in Pennsylvania. The review is to be conducted by a licensed engineer and is not to exceed $50,000 per complete application fold the municipality or $50,000 per county, for the <br />entire application.\nApplicant type: Municipalities and counties in Pennsylvania","applicant_types":["county","municipality"],"categories":["water"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/36","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-122,"deadline_placeholder":false,"days_since_deadline":122,"last_reopened":null},{"id":4216,"slug":"pennsylvania-infrastructure-bank-pib-pa-grants-penndot/1","name":"Pennsylvania Infrastructure Bank (PIB)","number":null,"level":"state","state":"PA","agency":"Transportation","agency_code":"PA-PENNDOT","connector":"pa_grants","funding_type":"loan","funding_source":"direct","status":"closed","opens_at":"2025-07-01","closes_at":"2026-06-30","closes_text":"Annual","rolling":null,"amount_min":null,"amount_max":null,"match_required":null,"match_pct":null,"summary":"The Pennsylvania Infrastructure Bank (PIB) is a PennDOT program that provides low-interest loans to help fund transportation projects within the Commonwealth. The goal of the PIB is to leverage state and federal funds, accelerate priority transportation projects, spur economic development and assist local governments with their transportation needs. Pennsylvania has a low interest loan program for transportation projects. PennDOT's program, The Pennsylvania Infrastructure Bank (PIB) program provides low interest loans for Transportation projects. The maximum term of a loan is 10 years. The PIB can fund up to 100% of the project. The interest rate is set at 1/2 half of the prime federal lending rate when a complete application is received by PennDOT. That federal rate is 7.0% now meaning the PIB interest is 3.5%. Emergency projects usually qualify for 0% interest loans; just submit the necessary PEMA/FEMA paperwork. Decisions are made on a case by case basis.","eligibility":"Applicant type: Municipalities; Counties; Private entities\nPopulation served: Statewide, municipalities and counties","applicant_types":["business","county","municipality"],"categories":["transportation"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/penndot/1","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-122,"deadline_placeholder":false,"days_since_deadline":122,"last_reopened":null},{"id":4204,"slug":"319-nonpoint-source-management-grants-program-pa-grants-dep/2","name":"319 Nonpoint Source Management Grants Program","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"grant","funding_source":"pass_through","status":"closed","opens_at":"2026-04-22","closes_at":"2026-06-22","closes_text":"Annual","rolling":null,"amount_min":null,"amount_max":null,"match_required":null,"match_pct":null,"summary":"Nonpoint source pollution originates from many sources over widespread areas. When rain or snowmelt runs over the land or through the ground, runoff picks up pollutants. It deposits them into rivers, lakes, wetlands, and coastal waters or groundwater. This pollutes about half of Pennsylvania’s water quality-impaired streams, lakes, and rivers. The 319 Nonpoint Source Grants Program provides funding to eligible applicants. The purpose will reduce nonpoint source pollution to restore or protect Pennsylvania’s waters. Projects will carry out 319 Watershed Implementation Plans (WIPs) in WIP watersheds. Typical projects are design, permitting and construction of best management practices (BMPs). 319 WIP revisions are eligible. Statewide or regional projects may be considered if funding remains. The U.S. Environmental Protection Agency provides funding. There is no match.","eligibility":"Eligibility: Visit the Section 319 Nonpoint Source Management grant program website for all eligibility requirements and guidance. Eligible Applicants: Incorporated watershed association; County or municipality; County conservation district; Council of government; Tax exempt, 501(c)(3) organizations registered with the Pennsylvania Bureau of Charitable Organizations; Educational Institution; Municipal Authority<br /><br />BMP Implementation and WIP revision projects must be located in a 319 WIP watershed. <br />\nApplicant type: Incorporated watershed association; county or municipality; county conservation district; council of governments; educational institution; municipal authority; tax-exempt 501(c)(3) organizations registered with the Pennsylvania Bureau of Charitable Organizations","applicant_types":["county","municipality","nonprofit"],"categories":["water"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/2","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-130,"deadline_placeholder":false,"days_since_deadline":130,"last_reopened":null},{"id":4207,"slug":"act-167-program-phase-1-pa-grants-dep/12","name":"Act 167 Program - Phase 1","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"closed","opens_at":"2026-04-22","closes_at":"2026-06-22","closes_text":"Annual","rolling":null,"amount_min":30000,"amount_max":50000,"match_required":true,"match_pct":75.0,"summary":"The Stormwater Management Act (Act of Oct. 4, 1978, P.L. 864, No. 167) (“Act 167”) requires each county to prepare and adopt a watershed stormwater management plan (“Act 167 Plan”) for each watershed located in the county, in consultation with the municipalities located within each watershed. Each county must periodically review and revise the plan at least every five years. Under Section 17 of Act 167, DEP is authorized to award grants to counties for reimbursement of costs in preparing and revising stormwater management plans when funds are appropriated by the General Assembly for this purpose. This grant program will provide funding to counties to prepare a Phase I scope of study under 25 Pa. Code § 111.14. Upon approval of Phase I by DEP, Phase II (or components thereof) may be authorized for the county to prepare or revise its Act 167 Plan.","eligibility":"Eligibility: See program guidance: http://greenport.pa.gov/elibrary/GetDocument?docId=8323634&DocName=GROWING GREENER PLUS GRANTS PROGRAM GUIDANCE 2024.PDF\nApplicant type: Counties","applicant_types":["county","municipality"],"categories":["water"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-10-19T05:10:27Z","source_url":"https://www.pa.gov/grants/search/grant-details/dep/12","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-130,"deadline_placeholder":false,"days_since_deadline":130,"last_reopened":null},{"id":4206,"slug":"growing-greener-plus-pa-grants-dep/1","name":"Growing Greener Plus","number":null,"level":"state","state":"PA","agency":"Environmental Protection","agency_code":"PA-DEP","connector":"pa_grants","funding_type":"grant","funding_source":"direct","status":"closed","opens_at":"2026-04-22","closes_at":"2026-06-22","closes_text":"Annual","rolling":null,"amount_min":null,"amount_max":500000,"match_required":false,"match_pct":null,"summary":"There are 52.6 percent of Pennsylvania’s water-quality-impaired watersheds polluted from nonpoint source pollution, such as abandoned mine drainage, urban and agricultural runoff, atmospheric deposition, on-lot sewage systems, earthmoving, stream hydromodification and timber harvesting. Pennsylvania’s Nonpoint Source Management Program establishes the overall strategy Pennsylvania will use to implement watershed restoration and protection activities. The purpose of the Growing Greener Plus program is to address nonpoint source pollution through local, watershed-based planning, restoration and protection efforts for projects funded by Watershed Planning, Restoration and Protection, Surface Mining Conservation and Reclamation Act Bond Forfeiture Grants and and Stormwater Management Planning (Act 167) Grant.","eligibility":"Eligibility: $500,000 grant limit. Please see program guidance and requirements at: https://www.dep.pa.gov/Citizens/GrantsLoansRebates/Growing-Greener/Pages/default.aspx\nApplicant type: Incorporated watershed association; county; county planning commission; municipality; county conservation district; council of governments; educational institution; municipal authority; tax-exempt corporation under 501(c)(3) and registered with the PA Bureau of Charitable Organizations","applicant_types":["county","municipality","nonprofit","school"],"catego <script>
/* Funding Atlas page script. Shared by the index and every state page; inlined by scripts/build_site.py.
   Plain browser JavaScript, no build step, no network: everything comes from the JSON block in the page.
   Nothing here invents data. A null stays blank; the only computed things are counts, sort orders and the
   wording of dates relative to the build date. */
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('data').textContent);
  var PAGE = document.body.getAttribute('data-page');
  var ROOT = PAGE === 'state' ? '../' : '';
  var TODAY = DATA.generated_at.slice(0, 10);

  // ---------- helpers ----------

  function h(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
  function words(s) { return cap(String(s || '').replace(/_/g, ' ')); }
  function money(n) { return n == null ? '' : '$' + Number(n).toLocaleString('en-US'); }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmtDate(iso, withYear) {
    if (!iso) return '';
    var y = +iso.slice(0, 4), m = +iso.slice(5, 7), d = +iso.slice(8, 10);
    var out = MONTHS[m - 1] + ' ' + d;
    return (withYear === false || (withYear === undefined && String(y) === TODAY.slice(0, 4))) ? out : out + ', ' + y;
  }
  function daysBetween(a, b) {
    return Math.round((Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10)) -
                       Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10))) / 86400000);
  }
  function relDays(d) {
    if (d < 0) return 'deadline passed ' + (-d) + (d === -1 ? ' day' : ' days') + ' ago';
    if (d === 0) return 'closes today';
    if (d === 1) return 'closes tomorrow';
    if (d < 14) return 'closes in ' + d + ' days';
    if (d < 60) return 'closes in ' + Math.round(d / 7) + ' weeks';
    return 'closes in ' + Math.round(d / 30) + ' months';
  }
  function isSoon(p) { return p.days_to_close != null && p.days_to_close >= 0 && p.days_to_close <= DATA.rules.closing_days; }
  function stateName(code) {
    var s = (DATA.states || []).filter(function (x) { return x.code === code; })[0];
    return s ? s.name : code;
  }
  function el(id) { return document.getElementById(id); }
  function pill(cls, text) { return '<span class="pill ' + cls + '">' + h(text) + '</span>'; }
  function tierPill(t) { return pill('tier-' + t, t === 'likely' ? 'Likely' : 'Possible'); }
  function statusPill(s) { return pill('st-' + s, cap(s)); }
  function levelPill(p) { return pill('lvl', p.level === 'federal' ? 'Federal' : (p.state ? stateName(p.state) : cap(p.level))); }
  function badges(p) { return (p.is_new ? pill('new', 'New') : '') + (p.is_updated ? pill('upd', 'Updated') : ''); }
  function sourceLine(src) {
    return h(src.label) + (src.last_ok ? ' read ' + fmtDate(src.last_ok) : ' (no successful read yet)');
  }

  // Wording of a change's field diff, for the feed.
  var FIELD_LABEL = {
    status: 'status', closes_at: 'closes', opens_at: 'opens', closes_at_text: 'deadline wording',
    amount_max: 'max award', amount_min: 'min award', match_required: 'match required', match_pct: 'match %',
    name: 'name', summary: 'summary', eligibility_text: 'eligibility text', funding_type: 'funding type',
    administering_agency: 'agency', applicant_types: 'applicant tags', categories: 'categories', alns: 'listings cited',
    rolling: 'rolling', source_url: 'source URL', external_number: 'number'
  };
  function fmtVal(field, v) {
    if (v == null || v === '') return '(blank)';
    if (field === 'amount_max' || field === 'amount_min') return money(v);
    if (field === 'closes_at' || field === 'opens_at') return fmtDate(v);
    if (field === 'match_required' || field === 'rolling') return v ? 'yes' : 'no';
    if (typeof v === 'object') return Array.isArray(v) ? v.length + ' values' : 'changed';
    return String(v).length > 40 ? String(v).slice(0, 39) + '…' : String(v);
  }
  function describe(c) {
    var lead = [], rest = [];
    c.fields.forEach(function (f) {
      if (f.field === 'status' || f.field === 'closes_at' || f.field === 'amount_max' || f.field === 'opens_at') {
        lead.push(h(FIELD_LABEL[f.field]) + ' <b>' + h(fmtVal(f.field, f.old)) + '</b> → <b>' + h(fmtVal(f.field, f.new)) + '</b>');
      } else {
        rest.push(FIELD_LABEL[f.field] || f.field.replace(/_/g, ' '));
      }
    });
    var out = lead.join(' · ');
    if (c.type === 'added') out = 'added to the registry' + (out ? ' · ' + out : '');
    if (c.type === 'missing') out = 'no longer listed by the source' + (out ? ' · ' + out : '');
    if (rest.length) out += (out ? ' · ' : '') + (lead.length || c.type !== 'changed' ? 'also ' : '') + h(rest.join(', '));
    return out || 'changed';
  }

  // Build-and-forget list of the feed, grouped by day. `link(c)` returns the HTML for the program name.
  function renderFeed(list, changes, link) {
    if (!changes.length) {
      list.innerHTML = '<li class="empty">No changes match.</li>';
      return;
    }
    var days = [], byDay = {};
    changes.forEach(function (c) {
      var d = c.at.slice(0, 10);
      if (!byDay[d]) { byDay[d] = []; days.push(d); }
      byDay[d].push(c);
    });
    list.innerHTML = days.map(function (d) {
      var ago = daysBetween(d, TODAY);
      var label = fmtDate(d) + (ago === 0 ? ' (today)' : ago === 1 ? ' (yesterday)' : ago < 14 ? ' (' + ago + ' days ago)' : '');
      return '<li class="day"><h3>' + h(label) + '</h3><ul>' + byDay[d].map(function (c) {
        var who = (c.agency || c.connector) + ' · ' + (c.level === 'federal' ? 'federal' : (c.state ? stateName(c.state) : c.level));
        return '<li class="ev"><span class="type ' + h(c.type) + '">' + h(c.type) + '</span><div>' +
          '<div class="name">' + link(c) + '</div>' +
          '<div class="what">' + describe(c) + '</div>' +
          '<div class="who">' + h(who) + '</div></div></li>';
      }).join('') + '</ul></li>';
    }).join('');
  }

  function renderFooter(extra) {
    var f = el('footer');
    if (!f) return;
    var q = (DATA.questions || []).map(function (x) { return '<li>' + h(x) + '</li>'; }).join('');
    f.innerHTML =
      '<div><h2>About this page</h2>' +
      '<p>This is a registry export, not advice. Each row is one program page or federal notice read by a connector; the status and dates are what that source said on the run date. Programs that only give a month ("Application opens: February") keep that wording rather than a guessed date. Blank fields mean the source did not state the value.</p>' +
      (extra || '') +
      '<p><b>New</b> marks a record first seen in the last ' + DATA.rules.new_days + ' days, after the source\'s first full read. <b>Updated</b> marks one whose source text changed in that window.</p></div>' +
      '<div><h2>What I would like to know from you</h2><ol>' + q + '</ol></div>' +
      '<div><h2>Data and code</h2>' +
      '<p>Records are open data under the <a href="https://opendatacommons.org/licenses/odbl/1-0/">Open Database License</a>; the connectors and this page are MIT licensed. Built ' + h(fmtDate(DATA.generated_at)) + ' from <a href="' + h(ROOT) + 'atlas.db.gz">atlas.db.gz</a> (SQLite, gzipped: every record, every raw payload and every logged change).</p>' +
      '<p><a href="' + h(DATA.repo_url) + '">Source code and connector docs</a> · <a href="' + h(ROOT) + '">All states</a></p></div>';
  }

  // =====================================================================================
  // State page
  // =====================================================================================

  function statePage() {
    var P = DATA.programs, B = DATA.between || [], C = DATA.changes, R = DATA.rules, S = DATA.state;
    P.forEach(function (p) {
      p._text = [p.name, p.agency, p.agency_code, p.number, p.summary].join(' ').toLowerCase();
    });
    var byId = {}, bySlug = {};
    P.concat(B).forEach(function (p) { byId[p.id] = p; bySlug[p.slug] = p; });

    var FACETS = [
      { key: 'tier', label: 'Relevance to a municipality', get: function (p) { return [p.tier]; },
        lab: function (v) { return v === 'likely' ? 'Likely' : 'Possible'; }, order: ['likely', 'possible'], open: true },
      { key: 'level', label: 'Level', get: function (p) { return [p.level]; }, lab: cap, open: true },
      { key: 'status', label: 'Status', get: function (p) { return [p.status]; }, lab: cap, open: true },
      { key: 'deadline', label: 'Deadline', get: function (p) { return [p.closes_at && !p.deadline_placeholder ? 'dated' : p.rolling ? 'rolling' : p.closes_text ? 'text' : 'none']; },
        lab: function (v) { return { dated: 'Has a date', rolling: 'Rolling or year-round', text: 'Described in words', none: 'Not stated' }[v]; },
        order: ['dated', 'rolling', 'text', 'none'], open: true },
      { key: 'category', label: 'Category', get: function (p) { return p.categories.length ? p.categories : ['none']; },
        lab: function (v) { return v === 'none' ? 'Not stated' : words(v); }, open: true },
      { key: 'funding_type', label: 'Funding type', get: function (p) { return [p.funding_type || 'none']; },
        lab: function (v) { return v === 'none' ? 'Not stated' : words(v); }, open: false },
      { key: 'agency', label: 'Agency', get: function (p) { return [p.agency || p.agency_code || 'Not stated']; },
        lab: function (v) { return v; }, open: false, long: true }
    ];
    var DEFAULT_SEL = { tier: ['likely'] };

    var st = { q: '', sort: 'closing', sel: {}, quick: null, tab: 'programs', feed: 'all', between: false };
    function resetSel() { st.sel = {}; Object.keys(DEFAULT_SEL).forEach(function (k) { st.sel[k] = DEFAULT_SEL[k].slice(); }); }
    resetSel();

    // ---- URL state (shareable filters; the detail panel is #p=slug) ----
    function parseHash() {
      var out = {};
      location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
        if (!kv) return;
        var i = kv.indexOf('='), k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i)), v = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1));
        out[k] = v;
      });
      return out;
    }
    function readHash() {
      var hsh = parseHash();
      if (hsh.q !== undefined) st.q = hsh.q;
      if (hsh.sort) st.sort = hsh.sort;
      if (hsh.tab === 'changes') st.tab = 'changes';
      if (hsh.feed) st.feed = hsh.feed;
      if (hsh.quick) st.quick = hsh.quick;
      if (hsh.between === '1') st.between = true;
      var any = false;
      FACETS.forEach(function (f) { if (hsh[f.key] !== undefined) { any = true; st.sel[f.key] = hsh[f.key] ? hsh[f.key].split(',') : []; } });
      if (hsh.all === '1' && !any) st.sel = {};
      return hsh.p || null;
    }
    function writeHash(slug) {
      var parts = [];
      if (st.q) parts.push('q=' + encodeURIComponent(st.q));
      if (st.sort !== 'closing') parts.push('sort=' + st.sort);
      if (st.quick) parts.push('quick=' + st.quick);
      if (st.tab === 'changes') parts.push('tab=changes');
      if (st.feed !== 'all') parts.push('feed=' + st.feed);
      if (st.between) parts.push('between=1');
      var same = true;
      FACETS.forEach(function (f) {
        var cur = (st.sel[f.key] || []).slice().sort().join(','), def = (DEFAULT_SEL[f.key] || []).slice().sort().join(',');
        if (cur !== def) { same = false; if (cur) parts.push(f.key + '=' + encodeURIComponent(cur)); }
      });
      if (!same && !FACETS.some(function (f) { return (st.sel[f.key] || []).length; })) parts.push('all=1');
      if (slug) parts.push('p=' + encodeURIComponent(slug));
      var hash = parts.length ? '#' + parts.join('&') : '';
      if (hash !== location.hash && !(hash === '' && location.hash === '')) {
        history.replaceState(null, '', location.pathname + location.search + hash);
      }
    }

    // ---- matching ----
    function termsOf(q) { return q.toLowerCase().split(/\s+/).filter(Boolean); }
    function matches(p, skip) {
      if (st.quick === 'new' && !p.is_new) return false;
      if (st.quick === 'closing' && !isSoon(p)) return false;
      var terms = termsOf(st.q);
      for (var i = 0; i < terms.length; i++) if (p._text.indexOf(terms[i]) < 0) return false;
      for (var j = 0; j < FACETS.length; j++) {
        var f = FACETS[j];
        if (f.key === skip) continue;
        var sel = st.sel[f.key];

  function indexPage() {
    var S = DATA.states, F = DATA.federal;
    var withSources = S.filter(function (s) { return s.programs > 0; });
    el('stats').innerHTML =
      '<div class="stat"><span class="v num">' + F.open + '</span><span class="k">federal notices open to local governments</span></div>' +
      '<div class="stat"><span class="v num">' + F.closing_soon + '</span><span class="k">of them close within ' + DATA.rules.closing_days + ' days</span></div>' +
      '<div class="stat"><span class="v num">' + withSources.length + '</span><span class="k">state' + (withSources.length === 1 ? '' : 's') + ' with state agency sources connected</span></div>' +
      '<div class="stat"><span class="v num">' + withSources.reduce(function (a, s) { return a + s.programs; }, 0) + '</span><span class="k">state programs read, ' + withSources.reduce(function (a, s) { return a + s.open; }, 0) + ' open for local governments, ' + withSources.reduce(function (a, s) { return a + (s.between || 0); }, 0) + ' between rounds</span></div>';

    function covText(s) {
      return s.programs > 0
        ? s.name + ': ' + s.agencies + (s.agencies === 1 ? ' agency' : ' agencies') + ', ' + s.programs + ' programs read, ' + s.open + ' open for local governments' + (s.between ? ', ' + s.between + ' between rounds' : '') + (s.last_ok ? ', read ' + fmtDate(s.last_ok) : '') + '. Plus ' + F.open + ' federal notices.'
        : s.name + ': no state sources yet. ' + F.open + ' federal notices.';
    }
    var map = el('map');
    map.innerHTML = S.map(function (s) {
      return '<a class="t' + (s.programs > 0 ? ' src' : '') + (s.open > 0 ? ' open' : '') + '" href="' + s.code.toLowerCase() + '/" style="grid-row:' + (s.row + 1) + ';grid-column:' + (s.col + 1) + '" data-code="' + s.code + '" title="' + h(s.name) + '">' + s.code + '<span class="sr-only">, ' + h(covText(s)) + '</span></a>';
    }).join('');
    var hover = el('hover');
    function show(e) {
      var a = e.target.closest('a.t');
      if (!a) return;
      var s = S.filter(function (x) { return x.code === a.getAttribute('data-code'); })[0];
      hover.innerHTML = '<b>' + h(s.name) + '</b> · ' + h(covText(s).replace(s.name + ': ', ''));
    }
    map.addEventListener('mouseover', show);
    map.addEventListener('focusin', show);

    var sel = el('goto-select');
    sel.innerHTML = S.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (s) {
      return '<option value="' + h(s.code) + '">' + h(s.name) + (s.programs > 0 ? ' (state sources)' : '') + '</option>';
    }).join('');
    el('goto').addEventListener('submit', function (e) { e.preventDefault(); location.href = sel.value.toLowerCase() + '/'; });

    renderFeed(el('feed'), DATA.changes, function (c) {
      var href = c.state && c.listed ? c.state.toLowerCase() + '/#p=' + encodeURIComponent(c.slug) : c.source_url;
      return '<a href="' + h(href) + '">' + h(c.name) + '</a>';
    });
    renderFooter('<p>Each state page carries every federal notice plus that state\'s agency programs where connectors exist. Coverage is stated on the page; a state with no sources yet says so.</p>');
  }

  if (PAGE === 'state') statePage(); else indexPage();
})();

</script>
</body>
</html>
