ury expects to award up to approximately $10.2 million in competitive project grants under this NOFO. State and local governments receiving project grants will be eligible to receive a separate grant for up to 15 percent of the project grant amount to pay for all or a portion of the cost of a statutorily required independent evaluation, which will be paid regardless of whether outcomes have been met. Treasury expects up to approximately $1.6 million to be available to pay for the costs of independent evaluations under this NOFO.","eligibility":"The list of eligible applicants does not represent all possible eligible entities. For purposes of this NOFO, the term “State” shall, consistent with the Uniform Administrative Requirements, Cost Principles, and Audit Requirements for Federal Awards (Uniform Guidance) at 2 CFR Part 200, include any of a State’s agencies or instrumentalities, and the terms “local government” and “federally recognized Indian tribe” shall have the meanings given in the Uniform Guidance.","applicant_types":["county","higher_ed","housing_authority","municipality","special_district","state","tribe"],"categories":["other"],"alns":["21.017"],"listings":[{"aln":"21.017","name":"Social Impact Partnerships to Pay for Results Act (SIPPRA)"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-11-19T18:42:09Z","source_url":"https://www.grants.gov/search-results-detail/364003","tier":"likely","is_new":false,"is_updated":false,"days_to_close":130,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-10-16","added",null,null,"first_read"],["2026-11-12","status","forecasted","open","source"],["2026-11-12","closes_at",null,"2027-04-06","source"],["2026-11-12","opens_at","2026-10-07","2026-11-12","source"],["2026-11-19","edit",2,null,"source"]]}}</script>
