S Strategic Plan, the EOC Grant Program supports the goal to Strengthen National Preparedness and Resilience.\nThe 2022-2026 FEMA Strategic Plan outlines three bold, ambitious goals in order to position FEMA to address the increasing range and complexity of disasters, support the diversity of communities we serve, and complement the nation’s growing expectations of the emergency management community. The EOC Grant Program supports Goal 3: Promote and Sustain a Ready FEMA and a Prepared Nation.\nThe FY 2024 EOC Grant Program will provide $103,189,080 for equipping, upgrading or constructing the EOC projects included in Appendix A of this funding notice. Per the National Fire Protection Association, an EOC is defined as a “facility or capability from which direction and control is exercised in an emergency. This type of center or capability is designated to ensure that the capacity exists for leadership to direct and control operations from a centralized facility or capability in the event of an emergency.” “Construction,” as defined in this program, refers to building a new facility or any changes to the footprint of an existing facility, while “upgrading” refers only to internal improvements to an existing facility.","eligibility":"Eligible applicants: State Governments; City or township governments; Native American tribal governments (Federally recognized); Government Organizations\nAdditional eligibility: Applicant Eligibility: Only State Administrative Agencies (SAAs) (on behalf of state and local units of government) and Tribal governments with identified projects in Appendix A of this funding notice are eligible to apply.\nBeneficiary Eligibility: n/a\nCredentials Documentation: n/a","applicant_types":["county","municipality","state","tribe"],"categories":["public_safety"],"alns":[],"listings":[],"first_seen":"2026-10-28T16:12:53Z","last_changed":"2026-11-04T02:59:53Z","source_url":"https://il.amplifund.com/Public/Opportunities/Details/25a7d712-a267-45ad-9a0b-a
