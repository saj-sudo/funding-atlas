s funding helps to cover the replacement or upgrade of building systems. Schools are eligible for funding if they are among those ranked in the highest tier of the wNMCI ranking list. (wNMCI is the Weighted New Mexico Condition Index, a scoring system used to measure the condition of public school buildings to ensure that resources go to the schools most in need of repairs, upgrades, or replacement.) Eligible systems include: Exterior envelope (roof, walls, windows, doors) Mechanical Electrical Plumbing Special systems (fire detection, fire suppression, communications) Site drainage and utilities Any systems identified in the FAD as Category 1 (critical issues that pose immediate threats to life, health or safety) Demolition of abandoned facilities (regardless of rank or building type) Demolition According to New Mexico Statute 22-24-4, demolitions of abandoned school district facilities can be fully funded by the public school capital outlay fund if two criteria are met: (1) the costs of continuing to insure the abandoned facility outweigh any potential benefit; (2) there is no practical use for the abandoned facility without the expenditure of substantial renovation costs. If the two criteria are satisfied, the council may enter into an agreement with the school district to fully fund the demolition of the abandoned school district facility. To apply for funding, districts can submit an application for a Systems-Based Project when the application cycle is open.","eligibility":"Public Schools","applicant_types":["county","municipality","school"],"categories":["other"],"alns":[],"listings":[],"first_seen":"2026-11-21T17:07:36Z","last_changed":"2026-11-21T17:07:36Z","source_url":"https://nmpsfa.org/systems-based-projects/","tier":"possible","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-11-21","added",null,null,"first_read"]]}}</script>
