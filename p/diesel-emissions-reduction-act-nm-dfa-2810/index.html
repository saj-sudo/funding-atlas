sel vehicles and equipment throughout the state. Eligible diesel vehicles, engines and equipment may include: buses (school and Class 5+ transit); Class 5 � Class 8 heavy-duty highway vehicles (e.g. refuse, commercial transportation); marine engines; locomotives; and nonroad engines, equipment, or vehicles such as those used in construction, handling of cargo (including at ports and airports), agriculture, mining, or energy production (including stationary generators and pumps). The existing vehicle, engine, or equipment must be fully operational. The replacement vehicle, engine or equipment should resemble the replacement in form and function. The participating fleet owner must currently own and operate the existing vehicle or equipment and have owned and operated the vehicle during the two years prior to upgrade. The existing vehicle, engine, or equipment must have at least three years of remaining life at the time of upgrade. Remaining life is the fleet owner�s estimate of the number of years until the unit would have been retired from service if the unit were not being upgraded or scrapped because of the grant funding. Funding cannot be used for the purchase of vehicles, engines, or equipment to expand a fleet. The vehicle, engine or equipment being replaced must be scrapped or rendered permanently disabled within 90 days of being replaced. Equipment and vehicle components that are not part of the engine or chassis may be salvaged from the unit being replaced (e.g., plow blades, shovels, seats, tires, etc.). The replaced vehicle must be scrapped by drilling a three-by-three-inch hole in the engine block and disabling the chassis by cutting through the frame rails on each side. A scrappage statement signed by the vehicle owner and the dismantler is required. A sample scrappage statement can be downloaded. The grant funds will be used for the purchase and installation of EPA or California Air Resources Board (CARB) verified/certified technologies or vehicle, engine or equipment replacement utilizing a zero-tailpipe emissions power source, in accordance with DERA funding guidelines. Both the EPA verified technologies list for clean diesel and CARB verified technology list are available. Engine replacements utilizing all-electric technology (i.e., zero emission) do not require EPA or CARB certification. New vehicles or engines must be certified to meet the most current EPA emissions standards for on-road diesel vehicles. While projects from the entire state will be accepted, special consideration will be given to projects located in or adjacent to those counties with levels of ozone at or above 95% of the National Ambient Air Quality Standard (NAAQS) for ozone. This currently includes Bernalillo, Do�a Ana, Eddy, Lea, Sandoval, San Juan, and Valencia counties.","eligibility":"Local Government, Tribes, Pueblos, Nations, Non-profit, Business / For-profit","applicant_types":["business","county","municipality","nonprofit","tribe"],"categories":["transportation"],"alns":[],"listings":[],"first_seen":"2026-11-21T17:07:36Z","last_changed":"2026-11-21T17:07:36Z","source_url":"https://www.env.nm.gov/air-quality/diesel/","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-11-21","added",null,null,"first_read"]]}}</script>
