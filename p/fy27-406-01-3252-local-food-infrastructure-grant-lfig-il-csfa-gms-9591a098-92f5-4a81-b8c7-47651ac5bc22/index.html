mmunities, enhance local food economies, generate economic growth for Illinois, and invest in supporting critical local food infrastructure needed to bolster processing, aggregation, and distribution of local food. Section 15(1) of the Local Food Infrastructure Grant Act authorizes the Department to make grants to Illinois resident individuals, groups, partnerships, or collaborations and shall include any one or more of the following entities that store, process, package, aggregate, or distribute value added agricultural products or plan to do so: Illinois farms with less than 50 employees; Illinois cooperatives with less than 50 employees; Illinois processing facilities with less than 50 employees; Illinois food businesses with less than 50 employees; Illinois food hubs with less than 50 employees; Illinois nonprofit organizations; and units of local government in Illinois.\nAll grant funding provided under this Act must be used for purchasing, leasing to own, renting, building, or installing infrastructure related to the processing, storage, aggregation, or distribution of value-added agricultural products.","eligibility":"Eligible applicants: Others\nApplicant eligibility: An applicant for grant funding under this Act must be an Illinois resident. \"Illinois Resident\" means an entity that is registered to do business in Illinois and has its home-base of operations in Illinois as proven by a valid W-9. Eligible grant applicants shall include any one or more of the following entities that store, process, package, aggregate, or distribute value-added agricultural products or plan to do so: Illinois farms with less than 50 employees; Illinois cooperatives with less than 50 employees; Illinois processing facilities with less than 50 employees; Illinois food businesses with less than 50 employees; Illinois food hubs with less than 50 employees; Illinois nonprofit organizations; and units of local government in Illinois.\nNOTE: An entity must have a “Qualified” status in Euna Grants by the application review date, January 6, 2027. Applications will be disqualified and not reviewed if the applicant is not in “qualified” status on the application review date. Qualified status is re-verified nightly. If the entity's status changes, an email notice is sent to the designated representative with a link to the Grantee Portal. The entity must use the link for technical assistance to seek remediation.\nPlease follow these steps before applying for IDOA administered grants.\nNOTE: Registration is required before an organization can apply for an award. Registration may take 2-4 weeks. You may complete this process at anytime to ensure you are ready to apply for your next opportunity.\n1. Register in SAM.gov\n• SAM (System for Award Management) is a government-wide registry for vendors doing business with the Federal government. You must register your entity (you as an individual or your organization) to be able to bid on contracts or apply for federal assistance (e.g., grants, loans) from the federal government. Registration is Free. SAM registration requires annual renewal.\n2. State law requires entities to register and pre-qualify online with GATA before applying for a state grant. Please verify that your organization/entity is in good standing with GATA and has an account on the GATA Grantee Portal.\n3. Register on IL.amplifund.com using the same email address used for SAM.gov and GATA registration.\n• The LFIG application is located within the Euna Grants grants management software platform. All applications must be submitted using Euna Grants.\nPRE-QUALIFICATION REQUIREMENTS\nThere are five grantee pre-qualification requirements:\n1. Authentication\n2. Grantee Registration\n3. Grantee Pre-qualification\n4. Fiscal and Administrative Risk Assessment (ICQ)\n5. Programmatic Risk Assessment (This process is completed if applicant is moved to award.)\nThese grantee pre-award requirements are mandated by Federal Uniform Guidance (2 CFR 200) and the Grant Accountability and Transparency Act (GATA). Grantees must complete these requirements prior to receiving a grant award from the State of Illinois.\nFor technical assistance, please review the Grantee Portal Frequently Asked Questions, the attached GATA New User Guide (English and Spanish), and the GATA Grantee Access Quick Guide. For questions about pre-award requirements, contact AGR.Grants@Illinois.gov.\n1. Authentication\nThe Grantee Portal utilizes the Illinois.gov Authentication Portal. A personal or business email address is required to establish an account. Authentication verifies the relationship between an individual and the organization they represent. Authentication is performed once for each individual associated with a registration. To obtain an account click the “Create a new account” link below the “Sign in” button. For help with the Illinois.gov Authentication Portal please click the 'Can't access your account' link below the sign in button.\n2. Grantee Registration\nAll grantees must be registered with the State of Illinois. Grantee Registration is completed by browsing to https://grants.illinois.gov/portal and associating your Illinois.gov account with your organization. New accounts must enter the organization’s information on the Registration screen. Existing accounts must click the “Edit” button next to the organization name on the Main Menu.\n3. Grantee Pre-qualification\nAll entities must:\nA. Be qualified to do business with the State of Illinois.\nAn entity is \"qualified\" to be an awardee if it:\n1. has an active DUNS number or UEI, as applicable;\n2. has an active SAM.gov public account;\n3. is in good standing with the Illinois Secretary of State, if the Illinois Secretary of State requires the entity's organization type to be registered. Governmental entities, school districts and select religious organizations are not required to be registered with the Illinois Secretary of State. Refer to the Illinois Secretary of State Business Services website: https://www.ilsos.gov/departments/business_services/home.html;\n4. is not on the Illinois Stop Payment List;\n5. is not on the SAM.gov Exclusion List or the Federal Excluded Parties List;\n6. is not on the Illinois Medicaid Sanctions List (https://www.illinois.gov/hfs/oig/Pages/SanctionsList.aspx).\nUpon registration, the Grantee Portal will list the status of each requirement. If a status is not \"good\", a link for technical assistance provides an explanation of how the issue can be corrected. The status of all requirements must be \"good\" for the entity to be qualified.\n“Qualified” status is required at the application review date. Applications will be disqualified and not reviewed if the applicant is not in “qualified” status.\nQualified status is re-verified nightly. If the entity's status changes, an email notice is sent to the designated representative with a link to the Grantee Portal. The entity must use the link for technical assistance to seek remediation.\nIf an entity is on the SAM.gov Exclusion List or in Permanent Stop Payment Status on the Illinois Stop Payment List, the entity is \"Not Qualified\". There is no remediation available. The State of Illinois cannot do business with entities on the SAM.gov Exclusion List or in Permanent Stop Payment Status on the Illinois Stop Payment List.\nIf an entity is on the Illinois Stop Payment List, is not in good standing with the Illinois Secretary of State, is on the Illinois Medicaid Sanctions List, does not have an active DUNS number or UEI as applicable, or has an expired SAM.gov account, the entity has a temporary \"Not Qualified\" status, but can remediate. Technical assistance links through the Grantee Portal enable the entity to self-mediate the issue.\nB. Register on IL.amplifund.com. (This is the State of Illinois online grants management software platform now known as Euna Grants.)\n4. Fiscal and Administrative Risk Assessment (ICQ)\nEntities must complete an Internal Controls Questionnaire (ICQ) as the Fiscal and Administrative Risk Assessment. The ICQ is completed once, annually. All state agencies will utilize the results of the ICQ. The entity can access the ICQ from the grantee portal.\n5. Programmatic Risk Assessment (This process is completed if applicant is moved to award.)\nA Programmatic Risk Assessment is completed by the awarding agency based on the program and entity information. Programmatic Risk Assessment determine specific conditions in the grant agreement as necessary.\nAWARD REQUIREMENTS\nTo be qualified for a grant award, an entity must:\n1. have an active DUNS number or UEI, as applicable;\n2. have an active SAM.gov public account;\n3. be in good standing with the Illinois Secretary of State, if the Illinois Secretary of State requires the entity's organization type to be registered. Governmental entities, school districts and select religious organizations are not required to be registered with the Illinois Secretary of State. Refer to the Illinois Secretary of State Business Services website: https://www.ilsos.gov/departments/business_services/home.html;\n4. not be on the Illinois Stop Payment List;\n5. not be on the SAM.gov Exclusion List or the Federal Excluded Parties List;\n6. not be on the Illinois Medicaid Sanctions List (https://www.illinois.gov/hfs/oig/Pages/SanctionsList.aspx).\nQualified status is re-verified nightly. If the entity's status changes, an email notice is sent to the designated representative with a link to the Grantee Portal. The entity must use the link for technical assistance to seek remediation.\nIf an entity is on the SAM.gov Exclusion List or in Permanent Stop Payment Status on the Illinois Stop Payment List, the entity is \"Not Qualified\". There is no remediation available. The State of Illinois cannot do business with entities on the SAM.gov Exclusion List or in Permanent Stop Payment Status on the Illinois Stop Payment List.\nIf an entity is on the Illinois Stop Payment List, is not in good standing with the Illinois Secretary of State, is on the Illinois Medicaid Sanctions List, does not have an active DUNS number or UEI as applicable, or has an expired SAM.gov account, the entity has a temporary \"Not Qualified\" status, but can remediate. Technical assistance links through the Grantee Portal enable the entity to self-mediate the issue.\nResources:\n• State of Illinois Grant Accountability and Transparency Act (GATA) State Grantee Portal New User Guide https://gata.illinois.gov/content/dam/soi/en/web/gata/documents/resource-library/gata-new-user-guide.pdf\n• See 44 Ill. Adm. Code 7000.70 https://www.ilga.gov/agencies/JCAR/EntirePart?titlepart=04407000\nAdditional eligibility: Conflict of Interest Disclosure - must be signed by the authorized signatory before submission. Can be printed, signed (wet/digital), scanned, uploaded into Euna Grants.\nMandatory Disclosure - must be signed by the authorized signatory before submission. Can be printed, signed (wet/digital), scanned, uploaded into Euna Grants.","applicant_types":["business","county","household","individual","municipality","nonprofit","state"],"categories":["other"],"alns":[],"listings":[],"first_seen":"2026-11-02T19:31:52Z","last_changed":"2026-11-04T02:59:53Z","source_url":"https://il.amplifund.com/Public/Opportunities/Details/9591a098-92f5-4a81-b8c7-47651ac5bc22","tier":"likely","is_new":false,"is_updated":false,"days_to_close":40,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-11-02","added",null,null,"source"],["2026-11-04","edit",7,null,"code"]]}}</script>
