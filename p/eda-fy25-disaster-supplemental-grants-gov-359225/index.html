profit entities under this NOFO. Applications from individuals or for-profit entities will not be considered for funding.","applicant_types":["county","municipality","nonprofit","school","tribe"],"categories":["other"],"alns":["11.307"],"listings":[{"aln":"11.307","name":"Economic Adjustment Assistance"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-19T05:20:27Z","source_url":"https://www.grants.gov/search-results-detail/359225","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-10-16","added",null,null,"first_read"],["2026-10-19","edit",1,null,"code"]]}}</script>
