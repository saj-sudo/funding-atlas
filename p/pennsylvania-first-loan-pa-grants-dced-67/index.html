ealth, to aid in restoring employment in communities affected by unemployment, and to assist persons, firms, associations, political subdivisions, corporations, cooperative associations and other organizations in the execution of its duties and functions under the Act.","eligibility":"Eligibility: All costs financed through the Pennsylvania First Program must be necessary for the operation of an eligible business or businesses at a project site(s) in the commonwealth. Specifically, funds may be used for: 1. Job training for direct, full-time, commonwealth resident employees of the applicant/business. 2. Acquisition of land, buildings or rights-of-way. 3. Construction or rehabilitation of buildings. 4. Construction or rehabilitation of infrastructure necessary for the operation of an eligible business or businesses at a project site not to include tap-in fees. 5. Purchase or upgrade of machinery and equipment. 6. Working capital. 7. Project site preparation, including demolition and clearance. 8. Environmental assessments. 9. Remediation of hazardous material.10. Architectural and engineering fees not to exceed 10% of the total Pennsylvania First Program award. Please see Section III of the Guidelines for a full list of Program Requirements.\nApplicant type: Businesses; Corporations; Partnerships; Sole proprietorships; Limited liability companies; Other forprofit entities; Not-for-profit entities; Municipalities; Boroughs; Townships; Towns; Cities; Home rule municipalities; Municipal Authorities; Redevelopment Authorities; Industrial Development Authorities; Corporations; Local Development Districts","applicant_types":["business","municipality","nonprofit","special_district"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-10-19T05:10:27Z","last_changed":"2026-11-11T17:08:49Z","source_url":"https://www.pa.gov/grants/search/grant-details/dced/67","tier":"likely","is_new":false,"is_updated":false,"days_to_close":3321,"deadline_placeholder":tr
