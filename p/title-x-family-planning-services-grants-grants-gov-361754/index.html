<script type="application/json" id="data">{"generated_at":"2026-11-27T19:28:55Z","site_url":"https://saj-sudo.github.io/funding-atlas/","repo_url":"https://github.com/saj-sudo/funding-atlas","rules":{"new_days":7,"updated_days":7,"closing_days":30},"state":null,"states":[],"sources":[{"connector":"grants_gov","label":"Grants.gov","last_ok":"2026-11-27T19:26:53Z"}],"questions":["What is open right now that is not on this page?","Which rows should not be here, and why?","Which columns do you actually use when deciding whether to apply? Which are noise?","Where do you look for this today, and what does that source get right that this one does not?"],"program":{"id":541,"slug":"title-x-family-planning-services-grants-grants-gov-361754","name":"Title X Family Planning Services Grants","number":"PA-FPH-27-001","level":"federal","state":null,"agency":"Office of the Assistant Secretary for Health","agency_code":"HHS-OPHS","connector":"grants_gov","funding_type":"grant","funding_source":"direct","status":"open","opens_at":"2026-04-03","closes_at":"2027-01-11","closes_text":"Applications must be submitted electronically no later than 6:00 pm Eastern Time.","rolling":null,"amount_min":200000,"amount_max":22000000,"match_required":false,"match_pct":null,"summary":"The Office of Population Affairs (OPA) announces the anticipated availability of funds for Fiscal Year (FY) 2027 grants under the authority of Title X of the Public Health Service Act, Section 1001 (42 U.S.C. §300).This notice solicits applications for projects to provide Title X services throughout the 50 United States, District of Columbia, Guam, the Commonwealth of Puerto Rico, the Northern Mariana Islands, the U.S. Virgin Islands, American Samoa, the U.S. Outlaying Islands (Midway, Wake, et al.), the Republic of the Marshall Islands, the Federated State of Micronesia, and the Republic of Palau (hereafter, States). OPA intends to make available approximately up to $257 million for up to 90 grant awards for a period of up to five (5) years. The actual amount available will not be determined until enactment of the FY 2027 federal budget.OPA\"s Title X Family Planning Program funds \"voluntary family planning projects [that] offer a broad range of acceptable and effective family planning methods and services (including natural family planning methods, infertility services, and services for adolescents).\" (Title X of the Public Health Service Act, 42 U.S.C. 300 et seq., available at https://opa.hhs.gov/sites/default/files/2020-07/title-x-statute-attachment-a_0.pdf). The Title X Program is implemented through competitively awarded grants to a diverse network of public and private nonprofit entities. The program helps millions of low-income and uninsured Americans develop health literacy and access family planning and related health services, empowering individuals and families to make informed decisions and navigate chronic health conditions and pregnancy with confidence. By offering counseling and education to improve individuals\" optimal health outcomes, Title X promotes the level of health literacy necessary to support informed consent across the reproductive lifespan. For example, endometriosis often goes undiagnosed for years because symptoms such as severe menstrual pain or irregular bleeding are frequently normalized or minimized. Body literacy counseling helps patients recognize that these experiences are not \"normal\" features of womanhood, but potential indicators of an underlying condition, prompting earlier discussion with providers, timely diagnosis, appropriate treatment, and improved long-term reproductive and overall health outcomes.Likewise, foundational knowledge of reproductive physiology enables patients and couples to recognize early signs of dysfunction, seek timely evaluation, and participate meaningfully in care decisions. Persistent gaps in reproductive knowledge highlight the need for such education. For example, a survey conducted for OPA in 2020 found that only 50% of women and 38% of men know that a woman\"s ovaries do not keep producing new eggs until menopause (https://opa.hhs.gov/sites/default/files/2021-01/fertility-knowledge-survey-findings-exec-summary-2020.pdf). By supporting body literacy education alongside evidence-based evaluation and treatment of chronic disease, Title X services can help patients move beyond symptom-focused care toward informed, preventive, and restorative approaches to reproductive health.These efforts align with HHS\"s focus on addressing the root causes of chronic illnesses by targeting conditions that affect reproductive health and fertility. By promoting strategies that support education and counseling on reproductive health goals, reduce chronic disease, and assist individuals seeking to achieve healthy pregnancies, the Title X Program strengthens American families, individuals, and communities.This notice solicits applications from public and private nonprofit entities to establish and operate voluntary Title X projects. These projects include a broad range of effective and acceptable services, including pregnancy testing and counseling, basic infertility services, sexually transmitted infection (STI) services (such as HIV prevention education, counseling, testing, and referral), health literacy, reproductive goals counseling to increase optimal health outcomes, and other preconception health services. Title X services also help address and provide referrals for health conditions that affect fertility, including endometriosis, polycystic ovary syndrome (PCOS), and uterine fibroids in women, as well as low sperm count, low sperm motility, low testosterone, and erectile dysfunction in men. OPA seeks a broad competition for Title X grant awards and are interested in innovative strategies to address chronic disease; reduce overmedicalization by strengthening approaches focused on underlying behavioral and lifestyle factors of health and evidence-based practices such as fertility-awareness based methods; promote health and body literacy; advance reproductive goals counseling for all clients; and support family formation.All activities funded under this announcement must be in compliance with the requirements of the Title X statute, legislative mandates, and regulations. Copies of the Title X statute, regulations, and legislative mandates may be downloaded from the OPA website at https://opa.hhs.gov/grant-programs/title- x-service-grants/title-x-statutes-regulations-and-legislative-mandates.","eligibility":"Any public or private nonprofit entity is eligible to apply.","applicant_types":["county","higher_ed","housing_authority","municipality","nonprofit","school","special_district","state","tribe"],"categories":["health"],"alns":["93.217"],"listings":[{"aln":"93.217","name":"Family Planning Services"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/361754","tier":"possible","is_new":false,"is_updated":false,"days_to_close":45,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-10-16","added",null,null,"first_read"]]}}</script>
