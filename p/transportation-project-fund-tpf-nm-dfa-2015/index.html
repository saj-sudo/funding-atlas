ludes getting a letter from the NMDOT District if the project is partially or fully within NM DOT right-of-way. Selection Criteria and Decision Authority: Projects are reviewed to ensure project qualifies for the funding. Projects are then and ranked by MPO/ RTPO's and District representatives and a final recommendation list is prepared for NMDOT Cabinet Secretary. When awarding funds, they take into account past awards and proposed project cost.","eligibility":"Counties| Municipalities","applicant_types":["county","municipality","tribe"],"categories":["transportation"],"alns":[],"listings":[],"first_seen":"2026-11-21T17:07:36Z","last_changed":"2026-11-21T17:07:36Z","source_url":"https://www.dot.nm.gov/business-support/project-oversight-division/","tier":"likely","is_new":false,"is_updated":false,"days_to_close":184,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-11-21","added",null,null,"first_read"]]}}</script>
