t effort with both public and private participation, demonstrating the ability to drive economic growth. Have an up-to-date community economic development plan and a marketing plan supporting business development and job growth. Have passed the Local Economic Development Act in their region and, ideally, a Local Option Gross Receipts Tax for economic development, or other economic development financing tools in their service area. Eligible Projects Must achieve specific economic development goals, such as job creation, tax base expansion, and/or business development, with measurable outcomes. Must align with the community’s adopted economic development plan. Should have a clear start and end date. Must include an appropriate budget and timeline. The LEADS Program is administered by the Community, Business and Rural Development Team (aka Regional Reps). Team members work with communities to identify projects and prepare the LEADS application.","eligibility":"Local Government, Tribes, Pueblos, Nations","applicant_types":["county","municipality","tribe"],"categories":["infrastructure"],"alns":[],"listings":[],"first_seen":"2026-11-21T17:07:36Z","last_changed":"2026-11-21T17:07:36Z","source_url":"https://edd.newmexico.gov/grants/leads/","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-11-21","added",null,null,"first_read"]]}}</script>
