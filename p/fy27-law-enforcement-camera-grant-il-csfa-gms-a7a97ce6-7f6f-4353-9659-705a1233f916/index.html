<script type="application/json" id="data">{"generated_at":"2026-11-27T19:28:55Z","site_url":"https://saj-sudo.github.io/funding-atlas/","repo_url":"https://github.com/saj-sudo/funding-atlas","rules":{"new_days":7,"updated_days":7,"closing_days":30},"state":{"code":"IL","name":"Illinois"},"states":[{"code":"IL","name":"Illinois"}],"sources":[{"connector":"il_csfa","label":"Illinois Catalog of State Financial Assistance (GATA)","last_ok":"2026-11-27T19:08:52Z"}],"questions":["What is open right now that is not on this page?","Which rows should not be here, and why?","Which columns do you actually use when deciding whether to apply? Which are noise?","Where do you look for this today, and what does that source get right that this one does not?"],"program":{"id":6613,"slug":"fy27-law-enforcement-camera-grant-il-csfa-gms-a7a97ce6-7f6f-4353-9659-705a1233f916","name":"FY27 Law Enforcement Camera Grant","number":"569-00-3496","level":"state","state":"IL","agency":"Illinois Law Enforcement Training Standards Board","agency_code":"IL-LETSB","connector":"il_csfa","funding_type":"grant","funding_source":"direct","status":"unknown","opens_at":"2026-09-15","closes_at":"2026-11-18","closes_text":null,"rolling":null,"amount_min":1,"amount_max":3000000,"match_required":true,"match_pct":null,"summary":"Program Description\nThe Illinois Law Enforcement Training & Standards Board (“ILETSB” or “Board”) is issuing this Notice of Funding Opportunity (NOFO) to advance civil rights and equity, expand access to justice, support crime victims and individuals impacted by the justice system, enhance community safety, protect the public from crime and emerging threats, and strengthen trust between law enforcement and the community.\nThe purpose of this program is to provide grants to Illinois police agencies of municipalities, counties, park districts, state-controlled universities, colleges or public community colleges and all units of Illinois local government for the purchase or lease of in-car video cameras for use in law enforcement vehicles; officer-worn body cameras for law enforcement officers and data storage related to officer-worn cameras; and training for law enforcement officers in the operation of the cameras (20 Ill. Adm. Code 1705 100-199).\nThe State of Illinois, ILETSB and the law enforcement community acknowledge that effective policing depends on a foundation of trust and mutual respect between law enforcement agencies and the communities they protect and serve. Without this trust, the legitimacy of policing practices and the overall integrity of the criminal justice system can be undermined. In recent years, officer-worn body cameras and in-car video cameras have emerged as an important tool. The passage of Illinois’ Safety, Accountability, Fairness and Equity – Today (SAFE-T) Act (Public Act 101-0652)1 made changes to the Law Enforcement Officer-Worn Body Camera Act which required all law enforcement agencies to implement body-worn cameras by January 1, 2025.\nCameras offer several key benefits. They provide a modern and reliable way to collect evidence during interactions between officers and the public. They also offer valuable material for training and professional development by allowing agencies to review real encounters and improve officer performance. In situations where disputes arise or accusations of misconduct are made, body‑worn cameras can provide an objective record, helping to resolve incidents fairly and transparently.\nRecognizing both the benefits of this technology and the importance of its responsible use, the General Assembly has implemented standardized protocols and procedures for body‑worn cameras statewide. These guidelines are intended to ensure that the technology is used effectively, consistently, and with appropriate safeguards to protect individual privacy. By establishing uniform standards, the General Assembly and ILETSB aims to maximize the benefits of body-worn and in-car cameras while enhancing transparency, reinforcing and strengthening community trust, supporting effective policing practices, and promoting fairness within the criminal justice system (50 ILCS 706 and 50 ILCS 707).","eligibility":"Eligible applicants: Government Organizations\nApplicant eligibility: Regardless of the source of funding (federal pass-through or State), all grantees are required to register with the State of Illinois through the Grant Accountability and Transparency Act (GATA) website, https://gata.illinois.gov, complete a pre-qualification process, and be determined “qualified” as described in Section 7000.70. Registration and prequalification are required before an organization can apply for an award.\nThe entity is “qualified” to be an awardee if it:\n1. Has an active UEI (Unique Entity Identifier) number;\n2. Has an active SAM.gov account;\nNote: SAM.gov registrations must be marked as “public” to allow the GATA Grantee Portal to expedite the review of information.\n3. Has an acceptable fiscal condition;\n4. Is in good standing with the Illinois Secretary of State, if the Illinois Secretary of State requires the entity’s organization type to be registered. Governmental entities, school districts and select religious organizations are not required to be registered with the Illinois Secretary of State. Refer to the Illinois Secretary of State Business Services website: http://www.cyberdriveillinois.com/departments/business_services/home.html\n5. Is not on the Illinois Stop Payment list;\n6. Is not on the SAM.gov Exclusion list;\n7. Is not on the Sanctioned Party List maintained by HFS.\nThis opportunity is open to Illinois law enforcement agencies of municipalities, counties, park districts, state-controlled universities or colleges or public community colleges and all units of Illinois local government recognized by the Board.\nApplicants must list their active law enforcement officers on a roster on file with the Board and indicate that all active law enforcement officers reflected on the agency roster are subject to the mandated training requirements of Section 7 of the Police Training Act. Applicants must also remain compliant with all Board training requirements at the time of award. Any officer that is not compliant may be listed as inactive upon reporting the date the officer left service, the officer’s expected date of return, the reason for leaving service, and an acknowledgement that all outstanding training will be completed within 60 days of return.\nApplicants must also be compliant with all reporting requirements of Sections 15 and 20 of the Law Enforcement Camera Grant Act [50 ILCS 707] and Section 10-25 of the Law Enforcement Officer-Worn Body Camera Act [50 ILCS 706].\nAll grant recipients must continue to meet the requirements of the Law Enforcement Camera Grant Act, the Grant Accountability and Transparency Act (see 44 Ill. Adm. Code 7000.70), and all corresponding administrative rules after an award.\nThe Board complies with all applicable provisions of State and Federal laws and regulations pertaining to nondiscrimination, sexual harassment and equal employment opportunity including but not limited to: The Illinois Human Rights Act (775 ILCS 5/1-101 et seq.), the Public Works Employment Discrimination Act (775 ILCS 101 et seq.), The United States Civil Rights Act of 1964 (as amended) (42 USC 2000a and 2000H-6), Section 504 of the Rehabilitation Act of 1973 (29 USC 794), The Americans with Disabilities Act of 1990 (42 USC 12101 et seq.), and the Age Discrimination Act (42 USC6101 et seq.).\nCost Sharing or Matching:\nNot applicable – cost sharing and matching is not required.\nIndirect Cost Rate:\nPlease see Award Information Section\nOther, if applicable:\nPre-award costs, those incurred prior to the start date of the award, are allowed. Pre-award costs must have been incurred on/after 7/1/2021 through the date of application. Documentation requirements of pre-award costs include:\n1. Submission of original detailed quote(s) and a zero-balance invoice with attached proof of payment (EFT or cancelled check). This information must match the budget amount submitted in Euna.\n2. Submission of proof of installation via a work-order showing the date installation was completed and serial number(s) of each camera for in-car camera requests. In-car cameras must have been installed prior to the application submission date.\nApplicants may submit only one application for this opportunity.\nApplicants who have previously received a Camera Grant from ILETSB are eligible to apply; however, the application and supporting documentation must clearly demonstrate that the requested funds will be used for new, unreimbursed costs. Expenses that have already been reimbursed by Grant source..\nAdditional eligibility: Applications and accompanying materials are subject to disclosure in response to requests received under provisions of the Freedom of Information Act (5 ILCS 140/1 et seq.). Information that could be proprietary, privileged, or confidential commercial or financial information should be clearly identified as such in the application materials. The Board will maintain the confidentiality of that information only to the extent permitted by law.\nOther, if applicable.\nApplicants may submit only one application for this opportunity.","applicant_types":["business","county","higher_ed","municipality","special_district"],"categories":[],"alns":[],"listings":[],"first_seen":"2026-10-28T16:12:53Z","last_changed":"2026-11-19T18:29:08Z","source_url":"https://il.amplifund.com/Public/Opportunities/Details/a7a97ce6-7f6f-4353-9659-705a1233f916","tier":"likely","is_new":false,"is_updated":false,"days_to_close":-9,"deadline_placeholder":false,"days_since_deadline":9,"last_reopened":null,"history":[["2026-10-28","added",null,null,"first_read"],["2026-11-04","edit",6,null,"code"],["2026-11-11","edit",1,null,"code"],["2026-11-19","missing",null,null,"source"]]}}</script>
