g supportive services to those Veterans who would otherwise be among the unsheltered homeless population. The result of GPD programs is that Veterans achieve residential stability, increase their skill levels and/or income, and obtain greater self-determination. Types of GPD Grants Transitional housing grants: Per Diem Only (PDO) grants provide funding in the form of per diem payments to reimburse grantees for the cost of care provided to Veterans in transitional supportive housing. Special Need grants target housing and services to specific populations of Veterans (e.g., women, Veterans with chronic mental illness, frail elderly Veterans, Veterans caring for minor dependents, terminally ill Veterans). Transition-In-Place (TIP) grants offer Veteran residents housing in which supportive services transition out of the residence over time, rather than the resident. Upon completion of the TIP services, the resident retains the unit as their permanent housing with no requirement to move. Other types of grants: Case Management grants support Veterans who were previously experiencing homelessness or who are at risk for homelessness so that they may obtain or retain permanent housing. Capital grants support the costs of acquiring, renovating, or constructing facilities and are only offered intermittently to improve existing facilities or to develop new transitional housing depending on VA's priorities and funding availability. Lists of current grantees are available on the GPD website. How to Apply for GPD Funding Not all grant types are available annually. When available, notices of funding can be found at the following locations: www.grants.gov and https://www.va.gov/homeless/gpd.asp. Application instructions are provided in each notice of funding. Each notice of funding will clarify specific eligibility criteria, application requirements, funding limitations, and other requirements. Applications are submitted through an online portal that is only available when there is an open notice of funding. Potential applicants who wish to see what was required for previous applications may review past notices of funding, available on the GPD provider website and www.grants.gov. Past notices of funding are not a guarantee of future requirements. Tentative Estimated GPD Award Schedule Specific dates are not able to be forecast. The follow tentative approximations are provided for general planning purposes. FY 2026 Case Management – GPD tentatively expects to offer a notice of funding around FY 2025 for case management awards starting approximately in FY 2026. FY 2027 PDO – GPD tentatively expects to offer a notice of funding around FY 2026 for PDO awards starting approximately in FY 2027. TIP – GPD tentatively expects to offer a notice of funding around FY 2026 for TIP awards starting approximately in FY 2027. FY 2028 GPD tentatively does not expect to offer a notice of funding for this timeframe. GPD may update this forecast closer to the time. THIS IS NOT A NOTICE OF FUNDING. THIS IS A GENERAL FORECAST ONLY.","eligibility":"THIS IS NOT A NOTICE OF FUNDING. THIS IS A GENERAL FORECAST ONLY.","applicant_types":["county","housing_authority","municipality","nonprofit","special_district","state","tribe"],"categories":["housing"],"alns":["64.024"],"listings":[{"aln":"64.024","name":"VA Homeless Providers Grant and Per Diem Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/356629","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-10-16","added",null,null,"first_read"]]}}</script>
