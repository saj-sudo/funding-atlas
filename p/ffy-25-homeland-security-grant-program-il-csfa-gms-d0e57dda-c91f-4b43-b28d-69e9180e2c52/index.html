fort of the whole community, inclusive of children, individuals with disabilities and others with access and functional needs, diverse communities, and people with limited English proficiency. The FY 2025 HSGP supports the core capabilities across the five mission areas of Prevention, Protection, Mitigation, Response, and Recovery based on allowable costs. The HSGP supports the Quadrennial Homeland Security Review Mission to Strengthen National Preparedness and Resilience. HSGP is comprised of two grant programs specific to Illinois: State Homeland Security Program (SHSP): The SHSP assists state, tribal, territorial, and local preparedness activities that address high-priority preparedness gaps across all core capabilities where a nexus to terrorism exists. All supported investments are based on capability targets and gaps identified during the Threat and Hazard Identification and Risk Assessment (THIRA) process, and assessed in the State Preparedness Report (SPR). Urban Area Security Initiative (UASI): The UASI Program assists high-threat, high-density Urban Areas in efforts to build, sustain, and deliver the capabilities necessary to prevent, protect against, mitigate, respond to, and recover from acts of terrorism. In Illinois, the defined Urban Area is Chicago to include the County of Cook.","eligibility":"Eligible applicants: Government Organizations\nAdditional eligibility: Applicant Eligibility: Local unit of government, state agencies and universities, statewide mutual aid organizations\nBeneficiary Eligibility: N/A\nCredentials Documentation: N/A","applicant_types":["county","higher_ed","municipality","state"],"categories":["public_safety"],"alns":[],"listings":[],"first_seen":"2026-10-28T16:12:53Z","last_changed":"2026-11-04T02:59:53Z","source_url":"https://il.amplifund.com/Public/Opportunities/Details/d0e57dda-c91f-4b43-b28d-69e9180e2c52","tier":"likely","is_new":false,"is_updated":false,"days_to_close":643,"deadline_placeholder":false,"days_since_deadlin
