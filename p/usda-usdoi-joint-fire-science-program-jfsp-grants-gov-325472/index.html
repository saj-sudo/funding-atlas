added, and the specific focus of individual topics may be altered. Investigators should recognize this uncertainty and not invest substantial time or resources working on proposals until the FOAs and their associated topics are formally posted. Investigators should not contact the JFSP Office or Governing Board members seeking further information on these topics. No further information will be released until the FOAs are formally posted. Primary FOA A. Relative impacts of prescribed and wildland fire Although the documented benefits of prescribed fire are numerous including habitat improvement and hazardous fuel reduction, there are drawbacks as well, such as reductions in air quality, which may impact human health. Prescribed fire is often implemented with the assumption that it will mitigate the effects of uncontrolled wildfire, because prescribed fire has been shown to reduce the intensity of subsequent wildfire under certain conditions. This is desirable because the impacts of wildfire are usually of a higher magnitude, larger in size and intensity, and pose a risk to public safety. To fully evaluate the trade-offs between prescribed fire programs and current wildfire impacts, an assessment framework is vital. Currently, there is little information on the spatial scale, frequency and spatial pattern at which prescribed fire begins to have an impact on subsequent wildfire extent, intensity and severity. As a result, JFSP is interested in proposals that improve our understanding of the relationship between prescribed fire programs and subsequent wildfire characteristics and this information is needed across a variety of vegetation types and regions. B. Types and distribution of ignitions and their relation to fire size and impacts One approach to reducing the negative impacts of wildfire to social and ecological values is to reduce the occurrence of human-caused wildfire ignitions with targeted wildfire prevention strategies. Planning and implementing effective fire prevention strategies requires detailed knowledge of the temporal and spatial distribution of different wildfire ignition sources (e.g., arson, accidental, lightning) and factors that influence whether different ignition sources lead to development of large wildfires. As a result, JFSP is interested in proposals that evaluate driving factors for the spatial and temporal distribution of ignitions and the effectiveness of different fire prevention actions as they relate to different human-caused ignitions. C. Science in support of fuel treatment performance metrics While it is relatively easy to document changes in fuels conditions following treatments at finer spatial scales, there is currently no objective framework to link fuel conditions to desired outcomes (e.g., reducing fire intensity and severity, improving fire suppression efficacy, reducing resource loss) at the landscape level. Such information is critical for developing cost-effective strategies to address the threats of wildfire. One possible strategy is to consider the evaluation of fuels treatment programs using a risk framework, where the probability and intensity of wildfire is considered in conjunction with valued resources. The development of a risk framework should assist agencies in measuring the extent and duration of risk reduction that could be achieved from a given fuel treatment. As a result, JFSP is interested in proposals that improve our understanding of the impacts of fuels treatments on fire suppression efficiency and protection of valued resources including the development of fuel treatment performance metrics at landscape scales. GRIN FOA - Graduate Research Innovation (GRIN) Award In partnership with the Association for Fire Ecology, the Joint Fire Science Program (JFSP) will likely continue the Graduate Research Innovation (GRIN) program for current master and doctoral students in the field of wildland fire and related physical, biological, and social sciences. The purpose of these awards is to enhance student exposure to the management and policy relevance of their research. As a result, these awards will enable graduate students to conduct research that will supplement and enhance the quality, scope, or applicability of their thesis or dissertation to develop information and products useful to managers and decision-makers. Proposals must describe new, unfunded work that extends ongoing or planned research that is the subject of a thesis or dissertation that has been approved by the graduate student’s advisory committee. Proposals must be directly related to the mission and goals of JFSP to be considered, and they must address management- or policy-related questions related to one or more of the following general topic areas: fuels management and fire behavior, emissions and air quality, fire effects and post-fire recovery, relative impacts of prescribed fire versus wildfire, or human dimensions of fire. Note: The specific topics eligible for GRIN proposals identified in the FOA may differ from those listed above.","eligibility":"The following types of entities are eligible to apply for award under this announcement. Failure to meet eligibility requirements will result in precluding the BLM from making an award. Types are: - State, local government, Indian Tribe; - Institution of Higher Education (IHE); - Nonprofit Organizations","applicant_types":["business","county","higher_ed","household","housing_authority","individual","municipality","nonprofit","school","special_district","state","tribe","utility"],"categories":["other"],"alns":["15.232"],"listings":[{"aln":"15.232","name":"Joint Fire Science Program"}],"first_seen":"2026-10-16T14:01:07Z","last_changed":"2026-10-16T14:01:07Z","source_url":"https://www.grants.gov/search-results-detail/325472","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-10-16","added",null,null,"firs
