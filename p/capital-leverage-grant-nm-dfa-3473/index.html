s are disbursed). Minimum RD&D Fund grant: $1,000,000 per award. Minimum non-State funding: $1,000,000 per project. Pathways: Requests up to $10,000,000 proceed under Pathway 1 Requests above $10,000,000 proceed under Pathway 2, which requires supplemental application information and has an extended review period. How it works: Submit a short letter of intent (LOI). TIO will target a 21-calendar day response, encouraging or discouraging a full application. Submit a full application. TIO will screen it for eligibility and program fit, score it against the evaluation criteria published in this solicitation, and make an award decision. If selected for funding and depending on the status of the outside funding, TIO will issue a commitment letter or proceed directly to grant agreement negotiation. Deadlines: Letters of intent and applications are accepted and decided on a rolling basis for as long as funding remains available, subject to TIO’s discretion. Target turnaround: TIO aims to respond to letters of intent within 21 calendar days. For Pathway 1 requests, TIO aims to decide complete applications within approximately 60 calendar days of receipt. For Pathway 2 requests, TIO targets a decision within approximately 90 days, extendable at TIO’s discretion based on the size, complexity, or other aspects of the proposed project. This solicitation includes an optional expedited review process in cases of documented exigent circumstances (§ 7.c). Response timelines begin on TIO’s receipt of the relevant complete submission but no earlier than October 1, 2026.","eligibility":"Local Government, Tribes, Pueblos, Nations, Business / For-profit","applicant_types":["business","county","municipality","tribe"],"categories":["infrastructure","other"],"alns":[],"listings":[],"first_seen":"2026-11-21T17:07:36Z","last_changed":"2026-11-21T17:07:36Z","source_url":"https://edd.newmexico.gov/divisions-and-offices/tio/capital-leverage-grant/","tier":"likely","is_new":false,"is_updated":fa
