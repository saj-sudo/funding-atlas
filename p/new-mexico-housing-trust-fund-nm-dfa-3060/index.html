 not be utilized as a first mortgage loan during the construction period. It can, however, be in the first lien position during the rental project’s permanent period. A New Mexico Housing Trust Fund loan can be awarded in a first lien position during both the construction and permanent phases of a single-family project. In certain cases, the New Mexico Housing Trust Fund may also be awarded in a junior lien position. Interest Rates 9% Low Income Housing Tax Credit (LIHTC) Projects: Base interest rate of 3%. May allow for a 1% discount for rural, senior, tribal, and permanent supportive projects. 4% LIHTC Projects: Base interest rate of 2%. May allow for a 1% discount for rural, senior, tribal, and permanent supportive projects. Non-LIHTC Projects: Base interest rate of 1%. Loan Term & Amount 9% Low Income Housing Tax Credit (LIHTC) Projects: Construction loans: Up to two years (current maximum of $3,000,000) Permanent long term amortizing loans: up to 40 years (current maximum $2,000,000 4% LIHTC Projects: Construction loans: Up to two years (current maximum of $4,000,000) Permanent long term amortizing loans: up to 40 years (current maximum $3,000,000) Non-LIHTC, Loans only Projects: Construction loans: Up to two years (current maximum of $3,000,000) Permanent long term amortizing loans: up to 40 years (current maximum $2,000,000) Affordability Requirements Rental: Households earning 60 percent or less of area median income (AMI.) Single family residences: Households earning 150 percent or less of AMI. Guaranties A guaranty will be required from a financially responsible entity acceptable to Housing New Mexico if funds are to be used during construction. If the proposed borrower has sufficient financial depth, a guaranty may not be required. See checklist for required information. Subordinations New Mexico Housing Trust Fund (NMHTF) loans may be subordinated to senior lien position loans but are still considered \"hard debt\" and not subject to available cash flow
