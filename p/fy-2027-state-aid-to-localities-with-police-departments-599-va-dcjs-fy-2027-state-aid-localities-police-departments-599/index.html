e DCJS On-line Grants Management System (OGMS) by 5:00 PM on Tuesday, August 4, 2026.\nCurrent “599” recipients are eligible to recertify. To maintain eligibility, a locality must have a police department as defined in the Code of Virginia §9.1-165, and all of the department’s law enforcement personnel must meet the state’s minimum training requirements. Before the start of each year, the participating locality must certify to DCJS that it meets this criterion. Each locality must also certify that it will use the “599” funds to supplement, not supplant, local funds provided for public safety services.\nShould you have any questions or concerns about this program, please contact Phyllis Vaughan at phyllis.vaughan@dcjs.virginia.gov or (804) 340-9754.","applicant_types":["county","municipality"],"categories":[],"alns":[],"listings":[],"first_seen":"2026-11-04T03:02:20Z","last_changed":"2026-11-04T03:02:20Z","source_url":"https://www.dcjs.virginia.gov/grants/programs/fy-2027-state-aid-localities-police-departments-599","tier":"possible","is_new":false,"is_updated":false,"days_to_close":-115,"deadline_placeholder":false,"days_since_deadline":115,"last_reopened":null,"history":[["2026-11-04","added",null,null,"first_read"]]}}</script>
