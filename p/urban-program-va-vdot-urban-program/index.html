urban localities to help them maintain nearly 27,000 lane miles of roadway infrastructure.\nAs established in Section 33.2-319 of the Code of Virginia, the Urban Maintenance Program oversees Commonwealth Transportation Board (CTB) payments to cities and towns in the urban system for maintenance, construction, and reconstruction of highways that meet specific criteria and conditions.\nThere are currently 85 localities in the urban system.\nA municipality qualifies for the urban program if it meets any of the following criteria:\nAll cities, regardless of population\nAll incorporated towns of more than 3,500 population, according to the latest U.S.\nThe towns of Chase City, Elkton, Grottoes, Narrows, Pearisburg, Saltville, Altavista, Dublin, Lebanon and Wise\nProvides unified policies and procedures to help VDOT staff and urban localities deliver programs that meet state and federal requirements.\nAccess VDOT’s FY86–FY27 payment-rate history table detailing urban arterials/collectors and Henrico/Arlington County lane-mile rates.\nIdentify eligible maintenance activities using a tool aligned with the U‑3 Survey and VDOT reporting to determine which tasks qualify for Urban Maintenance funding.\nNot all maintenance activities qualify for Urban Maintenance Program funding.\nYou can find a full list of eligible and ineligible activities in the Maintenance Eligibility Tool.\nTo help urban localities align their maintenance expenditure reporting with the Highway Finance Survey, Local Assistance developed an accounting template.\nUrban Maintenance Fund Accounting Template for Localities\nUrban localities must report their maintenance expenditures to VDOT each year.\nThe survey, distributed to localities by December, must be completed using audited financial data.\nThe Virginia Code also requires urban localities to report on the performance of their systems.\nLocalities develop their own equipment rental rates.\nIf localities have not developed rates, we recommend using commercially available rates via the Rental Rate Blue Book.\nThe cost of the Rental Rate Blue Book purchase is an eligible expense for using maintenance funds.\nEach year, the CTB approves mileage additions and deletions and authorizes payments to localities in the urban system.\nLocalities are responsible for updating the Urban Inventory.\nThe Commissioner of Highways, with approval from the CTB, provides payments to cities and certain towns for maintaining eligible highways.\nThese payments are based on the number of moving-lane-miles of highways, or portions of highways, available to peak-hour traffic within each locality.\nEvaluation of City Street Conditions Final Report\nIn accordance with §§ 46.2-1140.1, 46.2-1143, 46.2-1148, and 46.2-1149.1 of the Code of Virginia beginning in Fiscal Year 2014, overweight permit fee revenue is distributed on the basis of lane mileage to localities along with their quarterly maintenance payments.\nUnlike other counties in Virginia, Arlington and Henrico counties have withdrawn from the secondary state highway system and maintain their system of local roads.\nSection 33.2-366 of the Code of Virginia sets out the process for determining the amount that the state pays these counties for the maintenance of their local road systems annually.\nGuide for County Road Systems in Arlington and Henrico counties\nFY27 Arlington County Allocation Worksheet\nFY27 Henrico County Allocation Worksheet\nFY27 County Overweight Permit Fee Revenue\nJanuary 12, 2023 - VDOT Assessment of Localities Pavement and Bridges Kickoff Meeting","applicant_types":["county","municipality"],"categories":[],"alns":[],"listings":[],"first_seen":"2026-11-04T03:04:20Z","last_changed":"2026-11-04T03:04:20Z","source_url":"https://www.vdot.virginia.gov/doing-business/for-localities/urban-program/","tier":"likely","is_new":false,"is_updated":false,"days_to_close":null,"deadline_placeholder":false,"days_since_deadline":null,"last_reopened":null,"history":[["2026-11-04","add
